<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digimon Index">
<title>Digimon Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: bottom tab bar switches between the Partner habitat (one-screen raising game) and the Index (search grid + detail with evo branches) */
:root{
  --bg:#eef1f7; --panel:#ffffff; --sunk:#e1e6f0; --fg:#141a2b; --muted:#5a6480; --line:#cfd6e4;
  --accent:#e0640f; --accent-ink:#ffffff; --link:#2346c7; --star:#d9a400;
  --good:#1f9d55; --warn:#d48a00; --bad:#d23c3c; --grid:rgba(35,70,199,.07); --silf:brightness(0) opacity(.5);
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1120; --panel:#161c30; --sunk:#1e263f; --fg:#e6eaf5; --muted:#8f9ab8; --line:#2a3452;
  --accent:#ff8a3d; --accent-ink:#1a0d02; --link:#8fa8ff; --star:#ffd04d;
  --good:#3ccf7a; --warn:#ffb534; --bad:#ff6b6b; --grid:rgba(143,168,255,.08); --silf:brightness(0) invert(1) opacity(.3); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
main.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{font:700 1.35rem/1 var(--display);letter-spacing:.02em;margin:0}
.brand small{display:block;font:400 .72rem/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:4px}
.count{margin-left:auto;font:600 .8rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.search{display:flex;gap:6px;padding-bottom:10px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;font:inherit;color:var(--fg)}
.favbtn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0 10px;white-space:nowrap;font-size:.85rem}
.favbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;
  font:600 .78rem var(--mono);letter-spacing:.03em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.status{padding:28px 0;color:var(--muted);text-align:center}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:280px;margin:12px auto 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.err{color:var(--fg)}
.retry{margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:9px 16px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-block:14px 24px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r);padding:8px 6px 10px;text-align:center;min-width:0}
.card:active{transform:scale(.97)}
.card .pic{width:72px;height:72px;object-fit:contain}
.card .nm{font-weight:700;font-size:.82rem;line-height:1.2;overflow-wrap:anywhere}
.card .no{font:.68rem var(--mono);color:var(--muted)}
.card.raised{border-color:var(--good)}
.tick{position:absolute;top:5px;right:6px;font:700 .7rem var(--mono);color:var(--good)}

/* detail */
.detail{padding-block:12px 24px}
.back{border:0;background:none;color:var(--link);padding:6px 0;font-weight:700}
.trail{display:flex;flex-wrap:wrap;gap:4px 6px;font:.75rem var(--mono);color:var(--muted);margin:4px 0 10px}
.trail button{border:0;background:none;padding:0;color:var(--link);font:inherit}
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .art{margin:0 auto}}
.art{width:100%;max-width:220px;aspect-ratio:1;object-fit:contain;background:var(--sunk);border-radius:12px}
.hero h2{font:700 clamp(1.6rem,5vw,2.4rem)/1.05 var(--display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.idline{font:.78rem var(--mono);color:var(--muted);margin-top:6px}
.raisedline{font:700 .78rem var(--mono);color:var(--good);margin-top:4px}
.star{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;margin-top:10px;font-weight:700}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
dl.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;text-align:left}
dl.stats dt{font:600 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
dl.stats dd{margin:0;font-weight:700}
.desc{max-width:65ch;margin:16px 0 0;color:var(--fg)}
h3{font:700 1rem var(--display);letter-spacing:.04em;text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3 span{font:600 .75rem var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.evos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.evo{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);
  padding:8px;text-align:left;min-width:0}
.evo.raised{border-color:var(--good)}
.evo img{width:48px;height:48px;object-fit:contain;flex:none}
.evo .t{min-width:0}
.evo b{display:block;overflow-wrap:anywhere}
.evo small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.75rem;line-height:1.3}
.evo.nolink{cursor:default;opacity:.75}
.more{margin-top:8px;border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:8px 14px;font-weight:700}
.empty{color:var(--muted);font-style:italic}
.skills{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.skill b{display:block}
.skill p{margin:2px 0 0;color:var(--muted);font-size:.85rem}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:12px 0 10px;font:700 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* partner */
.partner{padding-block:14px 10px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.ptop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ptop h2{font:700 1.6rem/1.1 var(--display);margin:0;overflow-wrap:anywhere}
.stage{font:600 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.habitat{position:relative;height:230px;border-radius:16px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--panel);
  display:flex;align-items:flex-end;justify-content:center}
.habitat::after{content:"";position:absolute;left:18%;right:18%;bottom:22px;height:14px;border-radius:50%;background:var(--sunk)}
.sprite{position:relative;z-index:1;width:170px;height:170px;object-fit:contain;margin-bottom:26px;animation:bob 2.4s ease-in-out infinite}
.sprite.happy{animation:hop .5s ease-in-out 3}
.sprite.flash{animation:flash .35s steps(2) 8}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{50%{transform:translateY(-22px)}}
@keyframes flash{50%{filter:brightness(4) saturate(0)}}
.bubble{position:absolute;top:12px;left:12px;right:12px;z-index:2;font-size:.85rem;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;min-height:1.5em}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.meter label{display:flex;justify-content:space-between;font:600 .68rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meter label b{color:var(--fg);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:4px;transition:width .4s}
.evobox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.evobox .row{display:flex;justify-content:space-between;gap:8px;font:600 .72rem var(--mono);color:var(--muted);flex-wrap:wrap}
.evobox .row b{color:var(--fg)}
.evotrack{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.evotrack i{display:block;height:100%;background:var(--accent);transition:width .4s}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.act small{font:400 .66rem var(--mono);color:var(--muted)}
.act:active:not(:disabled){transform:scale(.96)}
.big{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font:700 1.05rem var(--display);letter-spacing:.04em;width:100%}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;font-weight:700;width:100%}
.danger{color:var(--bad);border-color:var(--bad)}
.lineage{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;font:.72rem var(--mono);color:var(--muted)}
.lineage img{width:34px;height:34px;object-fit:contain}
.egg{width:130px;height:165px;margin:0 auto;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;cursor:pointer;border:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),transparent 30%),
    radial-gradient(circle at 65% 62%,var(--accent) 0 11%,transparent 12%),radial-gradient(circle at 35% 70%,var(--link) 0 8%,transparent 9%),
    radial-gradient(circle at 55% 30%,var(--good) 0 7%,transparent 8%),var(--sunk);
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.08);animation:wobble 2.6s ease-in-out infinite}
.egg.shake{animation:shake .4s}
@keyframes wobble{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.center{text-align:center}
.mvlist{display:grid;gap:6px}
.mvrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.mvrow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mvrow.locked{opacity:.6}
.mvt{display:grid;min-width:0}
.mvt small{color:var(--muted);font-size:.75rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mvk{font:700 .58rem var(--mono);letter-spacing:.05em;padding:3px 6px;border-radius:6px;background:var(--sunk);color:var(--muted);min-width:42px;text-align:center}
.mvk.phys{color:var(--bad)}
.mvk.mag{color:var(--link)}
.mvk.heal{color:var(--good)}
.mvk.buff{color:var(--warn)}
.mvk.drain{color:var(--accent)}
.mvc{font-weight:700;color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--link);font-weight:700;padding:2px 0;justify-self:start;text-align:left}
.xptrack{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.xptrack i{display:block;height:100%;background:var(--link);transition:width .4s}
.act.wide{width:100%;flex-direction:row;justify-content:center;gap:8px;flex-wrap:wrap}
.dsheet{gap:8px}
.dhead{display:flex;flex-wrap:wrap;gap:4px 10px;font:600 .66rem var(--mono);color:var(--muted);align-items:center}
.dhead b{color:var(--fg);font:700 .95rem var(--display)}
.dbar{display:inline-block;width:40px;height:5px;border-radius:3px;background:var(--sunk);margin-left:4px;vertical-align:middle;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--good)}
.dbar.s i{background:var(--link)}
#dgc{display:block;margin:0 auto;border-radius:10px;touch-action:manipulation;max-width:100%}
.dlog{font-size:.78rem;color:var(--muted);min-height:3.6em;line-height:1.2}
.dctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.dpad button{border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:1rem;touch-action:manipulation}
.dpad button:active{background:var(--sunk)}
.dside{display:grid;gap:6px}
.dside .act{padding:7px 6px}
.dside .ghost{padding:7px}
.wallet{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:600 .74rem var(--mono);color:var(--muted)}
.wallet b{color:var(--fg);font-variant-numeric:tabular-nums}
.wallet .favbtn{margin-left:auto;padding:6px 12px}
.shop{display:grid;gap:8px}
.shopitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.shopitem .info{display:grid;gap:2px;min-width:0}
.shopitem .info small{color:var(--muted);font-size:.78rem;line-height:1.3}
.shopitem .act{min-width:76px}
.egg.mini{width:40px;height:52px;animation:none;cursor:default;display:block}
.egg.rare{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),transparent 30%),radial-gradient(circle at 62% 60%,var(--star) 0 12%,transparent 13%),radial-gradient(circle at 34% 68%,var(--accent) 0 9%,transparent 10%),radial-gradient(circle at 55% 28%,var(--star) 0 7%,transparent 8%),var(--fg);box-shadow:inset -10px -14px 0 rgba(0,0,0,.2),0 0 0 2px var(--star)}
.party{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.slot{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 2px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.slot img{width:40px;height:40px;object-fit:contain}
.slot small{font:.56rem/1.2 var(--mono);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot.on small{color:var(--fg)}
.slot.empty{border-style:dashed;color:var(--muted)}
.slot.empty span{font:400 1.4rem/40px var(--display)}
.slot i{position:absolute;top:2px;right:4px;font:700 .7rem var(--mono);font-style:normal;color:var(--warn)}
.hist{display:grid;gap:6px}
.hist div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:.85rem}
.hist small{color:var(--muted);font-family:var(--mono)}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:520px;background:var(--panel);color:var(--fg);border-radius:18px;padding:18px;display:grid;gap:12px;max-height:88vh;overflow:auto}
.sheet h4{margin:0;font:700 1.2rem var(--display)}
.tmeter{position:relative;height:34px;border-radius:8px;background:var(--sunk);overflow:hidden}
.tmeter .zone{position:absolute;top:0;bottom:0;background:var(--good);opacity:.45}
.tmeter .mark{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:var(--fg);border-radius:2px}
.dots{display:flex;gap:6px;justify-content:center;font:700 1rem var(--mono)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fighter{display:grid;gap:4px;justify-items:center;text-align:center;min-width:0}
.fighter img{width:96px;height:96px;object-fit:contain}
.fighter b{font-size:.85rem;overflow-wrap:anywhere}
.fighter.hit img{animation:shake .3s}
.attr{font:600 .62rem var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.bars{display:grid;gap:2px;width:100%}
.bars small{font:.62rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hp.spb i{background:var(--link)}
.statrow{display:flex;gap:4px 10px;flex-wrap:wrap;font:600 .72rem var(--mono);color:var(--muted)}
.statrow b{color:var(--fg)}
.bact{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bact .act small{white-space:nowrap}
.hp{width:100%;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--good);transition:width .5s}
.vs{font:700 1rem var(--display);color:var(--muted)}
.blog{font-size:.88rem;min-height:2.8em;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.choice{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;display:grid;justify-items:center;gap:4px;text-align:center}
.choice img{width:84px;height:84px;object-fit:contain}
img.sil{filter:var(--silf)}
.choice b{font-size:.85rem;overflow-wrap:anywhere}
.choice small{font:.66rem var(--mono);color:var(--good)}
.reveal{display:grid;justify-items:center;gap:6px;text-align:center}
.reveal img{width:160px;height:160px;object-fit:contain}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card:active,.act:active{transform:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1 class="brand">Digimon Index<small id="tagline">raise · digivolve · collect</small></h1>
      <button id="retroBtn" class="favbtn" aria-pressed="false" title="Show Digimon as pixel sprites" style="margin-left:auto;padding:6px 10px">▦ Retro</button>
      <span class="count" id="count" style="margin-left:0"></span>
    </div>
    <div id="indexChrome" hidden>
      <div class="search" id="searchRow">
        <input id="q" type="search" placeholder="Search by name" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search Digimon by name">
        <button id="raisedOnly" class="favbtn" aria-pressed="false">✓ Raised</button>
        <button id="favOnly" class="favbtn" aria-pressed="false">★ Saved</button>
      </div>
      <div class="rail" id="rail" role="group" aria-label="Filter by level"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="partnerView" class="partner"><div class="status">Loading…</div></section>
  <section id="listView" hidden>
    <div class="status" id="status">Loading the database…<div class="bar"><i id="prog"></i></div></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="detailView" class="detail" hidden></section>
</main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button id="tabPartner" role="tab" aria-selected="true">Partner</button>
  <button id="tabIndex" role="tab" aria-selected="false">Index</button>
</nav>
<div id="overlay" class="ov" hidden></div>

<script>
const API = 'https://digi-api.com/api/v1';
const LEVELS = ['Baby I','Baby II','Child','Adult','Perfect','Ultimate','Armor','Hybrid','Unknown'];
const STAGES = ['Baby I','Baby II','Child','Adult','Perfect','Ultimate'];
const LEVEL_EN = {'Baby I':'Fresh','Baby II':'In-Training','Child':'Rookie','Adult':'Champion','Perfect':'Ultimate','Ultimate':'Mega','Armor':'Armor','Hybrid':'Hybrid','Unknown':'Unknown'};
const EVO_NEED = [4, 8, 14, 22, 32];           // points to leave each stage
const FOE_BASE = [3, 8, 16, 26, 38, 52];        // opponent strength per stage
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = v => Math.max(0, Math.min(100, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

const state = {
  all: [], byId: new Map(), q: '', level: '', levelSets: {}, favOnly: false, raisedOnly: false,
  favs: new Set(store.get('dx_favs', [])), details: new Map(), trail: [],
  tab: store.get('dx_tab', 'partner'), levelOf: new Map(), stagesOf: new Map(), stageIds: {}, ready: false
};
const G = store.get('dx_game_v1', null) || { partner: null, col: {}, history: [] };
// older saves had a single partner; move it into the party
if (!Array.isArray(G.party)){ G.party = G.partner ? [G.partner] : []; G.active = 0; delete G.partner; }
const PARTY_MAX = 6;
if (typeof G.data !== 'number') G.data = 0;
if (!Array.isArray(G.eggs)) G.eggs = [];
const saveGame = () => store.set('dx_game_v1', G);
const raised = id => G.col[id] === 'raised';
const known = id => !!G.col[id];
const shown = (id, name) => known(id) ? name : '???';

async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function getDetail(id){
  let d = state.details.get(id);
  if (!d){ d = await getJSON(`${API}/digimon/${id}`); state.details.set(id, d); }
  return d;
}

// Walk every page of a list endpoint
async function pageAll(base, onProgress){
  const size = 250, out = [];
  for (let page = 0; page < 40; page++){
    const sep = base.includes('?') ? '&' : '?';
    const d = await getJSON(`${base}${sep}pageSize=${size}&page=${page}`);
    const items = d.content || [];
    out.push(...items);
    const p = d.pageable || {};
    if (onProgress && p.totalElements) onProgress(out.length / p.totalElements, p.totalElements);
    // the API's page count can be one short, so keep going until a page comes back partly empty
    if (!items.length || items.length < size) break;
  }
  return out;
}

async function loadAll(){
  const cached = store.get('dx_list_v2', null);
  if (cached && cached.t > Date.now() - 7*864e5 && cached.items?.length){ setAll(cached.items); }
  else {
    showStatus('Loading the database…', true);
    $('#partnerView').innerHTML = '<div class="status">Loading the database…</div>';
    try{
      const items = await pageAll(`${API}/digimon`, (f) => { const p = $('#prog'); if (p) p.style.width = Math.round(f*100) + '%'; });
      items.sort((a,b) => a.id - b.id);
      store.set('dx_list_v2', {t: Date.now(), items});
      setAll(items);
    }catch(e){
      const msg = `Couldn't reach the Digimon database (${esc(e.message)}). Check your connection and try again.`;
      showError(msg, loadAll);
      $('#partnerView').innerHTML = `<div class="status"><div class="err">${msg}</div><button class="retry" id="retryAll">Try again</button></div>`;
      $('#retryAll').onclick = loadAll;
      return;
    }
  }
  await loadStages();
}

// Which stage (0 = Fresh … 5 = Mega) every Digimon belongs to
async function loadStages(){
  let cached = store.get('dx_levels_v2', null);
  if (!(cached && cached.t > Date.now() - 7*864e5 && cached.sets)){
    $('#partnerView').innerHTML = '<div class="status">Learning every evolution stage…</div>';
    try{
      const sets = {};
      for (const lv of STAGES) sets[lv] = (await pageAll(`${API}/digimon?level=${encodeURIComponent(lv)}`)).map(d => d.id);
      cached = {t: Date.now(), sets};
      store.set('dx_levels_v2', cached);
    }catch(e){
      $('#partnerView').innerHTML = `<div class="status"><div class="err">Couldn't load evolution stages (${esc(e.message)}).</div><button class="retry" id="retryLv">Try again</button></div>`;
      $('#retryLv').onclick = loadStages;
      return;
    }
  }
  STAGES.forEach((lv, i) => {
    state.stageIds[i] = cached.sets[lv] || [];
    state.levelSets[lv] = new Set(cached.sets[lv] || []);
    for (const id of cached.sets[lv] || []){
      if (!state.levelOf.has(id)) state.levelOf.set(id, i);
      state.stagesOf.set(id, [...(state.stagesOf.get(id) || []), i]);
    }
  });
  state.ready = true;
  tick();
  renderPartner();
  updateCount();
}

function setAll(items){
  state.all = items;
  state.byId = new Map(items.map(d => [d.id, d]));
  $('#status').hidden = true;
  renderGrid();
  route();
}

function showStatus(msg, bar){
  const s = $('#status'); s.hidden = false;
  s.innerHTML = esc(msg) + (bar ? '<div class="bar"><i id="prog"></i></div>' : '');
}
function showError(html, retry){
  const s = $('#status'); s.hidden = false;
  s.innerHTML = `<div class="err">${html}</div><button class="retry">Try again</button>`;
  s.querySelector('.retry').onclick = retry;
}
function updateCount(){
  const n = Object.values(G.col).filter(v => v === 'raised').length;
  if (state.tab === 'partner') $('#count').innerHTML = `${Object.keys(G.col).length} / ${state.all.length ? state.all.length.toLocaleString() : '—'} found<br>${n} raised`;
  else { const list = filtered(); $('#count').textContent = `${list.length.toLocaleString()} / ${state.all.length.toLocaleString()}`; }
}

// ---------- tabs ----------
function setTab(t){
  state.tab = t; store.set('dx_tab', t);
  $('#tabPartner').setAttribute('aria-selected', t === 'partner');
  $('#tabIndex').setAttribute('aria-selected', t === 'index');
  const isP = t === 'partner';
  $('#partnerView').hidden = !isP;
  $('#indexChrome').hidden = isP || !$('#detailView').hidden;
  $('#listView').hidden = isP || !$('#detailView').hidden;
  if (isP){ $('#detailView').hidden = true; if (location.hash) history.replaceState(null, '', location.pathname + location.search); tick(); renderPartner(); }
  else renderGrid();
  updateCount();
  window.scrollTo(0, 0);
}
$('#tabPartner').onclick = () => setTab('partner');
$('#tabIndex').onclick = () => { if (!$('#detailView').hidden) goList(); setTab('index'); };

// ---------- index list ----------
function renderRail(){
  const rail = $('#rail');
  const opts = [['','All levels'], ...LEVELS.map(l => [l, LEVEL_EN[l]])];
  rail.innerHTML = opts.map(([v, label]) =>
    `<button class="chip" data-level="${esc(v)}" aria-pressed="${state.level === v}" title="${esc(v || 'All')}">${esc(label)}</button>`).join('');
}

async function setLevel(lv){
  state.level = lv;
  renderRail();
  if (lv && !state.levelSets[lv]){
    $('#grid').innerHTML = '';
    showStatus(`Loading ${LEVEL_EN[lv] || lv} Digimon…`);
    try{
      const items = await pageAll(`${API}/digimon?level=${encodeURIComponent(lv)}`);
      state.levelSets[lv] = new Set(items.map(d => d.id));
      $('#status').hidden = true;
    }catch(e){
      showError(`Couldn't load that level (${esc(e.message)}).`, () => setLevel(lv));
      return;
    }
  }
  if (state.level === lv) renderGrid();
}

function filtered(){
  const q = state.q.trim().toLowerCase().replace(/[\s\-_]/g, '');
  const set = state.level ? state.levelSets[state.level] : null;
  return state.all.filter(d =>
    (!set || set.has(d.id)) &&
    (!state.favOnly || state.favs.has(d.id)) &&
    (!state.raisedOnly || raised(d.id)) &&
    (!q || (known(d.id) && d.name.toLowerCase().replace(/[\s\-_]/g, '').includes(q))));
}

function renderGrid(){
  if (state.tab !== 'index' || !state.all.length) return;
  const list = filtered();
  updateCount();
  const g = $('#grid');
  if (!list.length){
    g.innerHTML = '';
    showStatus(state.raisedOnly && !Object.keys(G.col).length ? 'Digimon your partner becomes will show up here.'
      : state.favOnly && !state.favs.size ? 'Tap ★ on any Digimon to save it here.' : 'No Digimon match that search.');
    return;
  }
  $('#status').hidden = true;
  g.innerHTML = list.map(d => `
    <button class="card${raised(d.id) ? ' raised' : ''}" data-id="${d.id}">
      ${raised(d.id) ? '<span class="tick">✓</span>' : ''}
      <img class="pic${known(d.id) ? '' : ' sil'}" loading="lazy" decoding="async" alt="" src="${esc(d.image)}" onerror="this.style.visibility='hidden'">
      <span class="nm">${esc(shown(d.id, d.name))}</span>
      <span class="no">#${String(d.id).padStart(4,'0')}${state.favs.has(d.id) ? ' ★' : ''}</span>
    </button>`).join('');
}

// ---------- index detail ----------
function idFromUrl(u){ const m = String(u||'').match(/\/(\d+)\/?$/); return m ? +m[1] : null; }

async function openDetail(id, fromEvo){
  id = +id;
  if (state.tab !== 'index'){ state.tab = 'index'; store.set('dx_tab', 'index'); $('#tabPartner').setAttribute('aria-selected', false); $('#tabIndex').setAttribute('aria-selected', true); $('#partnerView').hidden = true; }
  const v = $('#detailView');
  $('#listView').hidden = true; $('#indexChrome').hidden = true;
  v.hidden = false;
  const base = state.byId.get(id);
  if (!fromEvo) state.trail = [];
  v.innerHTML = `<button class="back" id="back">← All Digimon</button>
    <div class="status">${base ? esc(shown(id, base.name)) + ' · ' : ''}loading…</div>`;
  $('#back').onclick = goList;
  window.scrollTo(0, 0);
  let d;
  try{ d = await getDetail(id); }
  catch(e){
    v.innerHTML = `<button class="back" id="back">← All Digimon</button><div class="status"></div>`;
    $('#back').onclick = goList;
    const s = v.querySelector('.status');
    s.innerHTML = `<div class="err">Couldn't load this Digimon (${esc(e.message)}).</div><button class="retry">Try again</button>`;
    s.querySelector('.retry').onclick = () => openDetail(id, fromEvo);
    return;
  }
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  const last = state.trail[state.trail.length - 1];
  if (!last || last.id !== id) state.trail.push({id, name: shown(id, d.name)});
  if (state.trail.length > 12) state.trail = state.trail.slice(-12);
  renderDetail(d);
}

const evoId = e => idFromUrl(e.url) ?? e.id;

function evoCards(list, key){
  if (!list || !list.length) return `<p class="empty">None recorded.</p>`;
  const limit = 24;
  const card = (e, i) => {
    const eid = evoId(e);
    const linkable = eid && state.byId.has(eid);
    const img = e.image || (linkable ? state.byId.get(eid).image : '');
    const r = raised(eid), k = known(eid);
    return `<button class="evo${linkable ? '' : ' nolink'}${r ? ' raised' : ''}" ${linkable ? `data-evo="${eid}"` : 'disabled'} ${i >= limit ? `data-extra="${key}" hidden` : ''}>
      ${r ? '<span class="tick">✓</span>' : ''}
      ${img ? `<img class="${k ? '' : 'sil'}" loading="lazy" alt="" src="${esc(img)}" onerror="this.style.visibility='hidden'">` : ''}
      <span class="t"><b>${k ? esc(e.digimon) : '???'}</b>${k && e.condition ? `<small>${esc(e.condition)}</small>` : ''}</span>
    </button>`;
  };
  return `<div class="evos">${list.map(card).join('')}</div>` +
    (list.length > limit ? `<button class="more" data-more="${key}">Show all ${list.length}</button>` : '');
}

function renderDetail(d){
  const v = $('#detailView');
  const img = (d.images && d.images[0] && d.images[0].href) || state.byId.get(d.id)?.image || '';
  const levels = (d.levels||[]).map(l => LEVEL_EN[l.level] && LEVEL_EN[l.level] !== l.level ? `${LEVEL_EN[l.level]} (${l.level})` : l.level).join(', ');
  const join = (arr, k) => (arr||[]).map(x => x[k]).filter(Boolean).join(', ');
  const k = known(d.id);
  const descObj = k && ((d.descriptions||[]).find(x => /^en/i.test(x.language)) || (d.descriptions||[])[0]);
  const fav = state.favs.has(d.id);
  const nexts = d.nextEvolutions || [], priors = d.priorEvolutions || [];
  const rc = list => list.filter(e => raised(evoId(e))).length;
  const trail = state.trail.length > 1
    ? `<nav class="trail" aria-label="Evolution path">${state.trail.map((t, i) =>
        i === state.trail.length - 1 ? `<span>${esc(t.name)}</span>` : `<button data-trail="${i}">${esc(t.name)}</button><span>→</span>`).join('')}</nav>` : '';
  const stat = (k, val) => val ? `<dt>${k}</dt><dd>${esc(val)}</dd>` : '';
  v.innerHTML = `
    <button class="back" id="back">← All Digimon</button>
    ${trail}
    <h3>Evolves from <span>${priors.length}${rc(priors) ? ` · ${rc(priors)} raised` : ''}</span></h3>
    ${evoCards(priors, 'prior')}
    <div class="hero" style="margin-top:18px">
      ${img ? `<img class="art${k ? '' : ' sil'}" alt="${esc(shown(d.id, d.name))}" src="${esc(img)}">` : '<div class="art"></div>'}
      <div>
        <h2>${esc(shown(d.id, d.name))}</h2>${k ? '' : '<div class="raisedline" style="color:var(--muted)">Not discovered yet. Battle it or raise it to reveal it.</div>'}
        <div class="idline">#${String(d.id).padStart(4,'0')}${d.releaseDate ? ' · debut ' + esc(d.releaseDate) : ''}${d.xAntibody ? ' · X-Antibody' : ''}</div>
        ${raised(d.id) ? '<div class="raisedline">✓ Raised by you</div>' : ''}
        <button class="star" id="star" aria-pressed="${fav}">${fav ? '★ Saved' : '☆ Save'}</button>
        <dl class="stats">
          ${stat('Level', levels)}${k ? stat('Attribute', join(d.attributes,'attribute')) : ''}
          ${k ? stat('Type', join(d.types,'type')) + stat('Field', join(d.fields,'field')) : ''}
        </dl>
      </div>
    </div>
    ${descObj ? `<p class="desc">${esc(descObj.description)}</p>` : ''}
    <h3>Evolves into <span>${nexts.length}${rc(nexts) ? ` · ${rc(nexts)} raised` : ''}</span></h3>
    ${evoCards(nexts, 'next')}
    ${k && (d.skills||[]).length ? `<h3>Skills <span>${d.skills.length}</span></h3>
      <div class="skills">${d.skills.map(s => `<div class="skill"><b>${esc(s.skill)}${s.translation && s.translation !== s.skill ? ' · ' + esc(s.translation) : ''}</b>${s.description ? `<p>${esc(s.description)}</p>` : ''}</div>`).join('')}</div>` : ''}
  `;
  $('#back').onclick = goList;
  $('#star').onclick = () => {
    state.favs.has(d.id) ? state.favs.delete(d.id) : state.favs.add(d.id);
    store.set('dx_favs', [...state.favs]);
    renderDetail(d);
  };
}

function goList(){
  state.trail = [];
  $('#detailView').hidden = true;
  $('#listView').hidden = false; $('#indexChrome').hidden = false;
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
  renderGrid();
  window.scrollTo(0, state.scroll || 0);
}

function route(){
  const id = +location.hash.slice(1);
  if (id && state.all.length) openDetail(id, true);
  else if (!$('#detailView').hidden) goList();
}

// ================= PARTNER GAME =================
const P = () => G.party[G.active] || null;
let busy = false;

function stageOf(id){ return state.levelOf.get(id); }
// some Digimon are listed at two levels, so check membership instead of a single level
const inStage = (id, s) => !!state.levelSets[STAGES[s]]?.has(id);
const higherStage = (id, s) => (state.stagesOf.get(id) || []).find(x => x > s);

function newPartner(id){
  const b = state.byId.get(id);
  const now = Date.now();
  if (G.party.length >= PARTY_MAX) return;
  G.party.push({ id, name: b.name, image: b.image, stage: 0, hunger: 70, energy: 80, mood: 75, str: 2,
    evo: 0, mistakes: 0, stageMistakes: 0, wins: 0, losses: 0, born: now, last: now, flags: {}, line: [id], stageLine: [0], final: false });
  G.active = G.party.length - 1;
  initMoves(G.party[G.active]); syncMoves(G.party[G.active]);
  G.col[id] = 'raised';
  saveGame();
}

// Time passes while you're away, for every Digimon in the party
function tick(){
  const now = Date.now(); let changed = false;
  for (const p of G.party){
    const mins = Math.min((now - p.last) / 60000, 1440);
    if (mins < 0.2) continue;
    p.hunger = clamp(p.hunger - mins / 4);
    p.mood = clamp(p.mood - mins / 5);
    p.energy = clamp(p.energy + mins / 6);
    p.last = now;
    checkNeglect(p); changed = true;
  }
  if (changed) saveGame();
}
function checkNeglect(p){
  for (const k of ['hunger', 'mood']){
    if (p[k] <= 0 && !p.flags[k]){ p.flags[k] = true; p.mistakes++; p.stageMistakes++; p.msg = `${p.name} was ${k === 'hunger' ? 'starving' : 'miserable'} while you were gone. That's a care mistake.`; }
    if (p[k] > 20) p.flags[k] = false;
  }
}

function meterColor(v){ return v >= 50 ? 'var(--good)' : v >= 25 ? 'var(--warn)' : 'var(--bad)'; }
function meter(label, v){
  const n = Math.round(v);
  return `<div class="meter"><label>${label}<b>${n}</b></label><div class="track"><i style="width:${n}%;background:${meterColor(n)}"></i></div></div>`;
}
function ageText(p){
  const h = (Date.now() - p.born) / 3600000;
  return h < 1 ? `${Math.max(1, Math.round(h*60))} min old` : h < 48 ? `${Math.round(h)} h old` : `${Math.round(h/24)} days old`;
}
function moodLine(p){
  if (p.msg){ const m = p.msg; p.msg = ''; return m; }
  if (p.hunger < 25) return `${p.name} is hungry.`;
  if (p.energy < 20) return `${p.name} is worn out and needs rest.`;
  if (p.mood < 25) return `${p.name} looks bored. Play with it!`;
  if (canEvolve(p)) return `${p.name} is glowing… it's ready to digivolve!`;
  return pick([`${p.name} is looking at you.`, `${p.name} is ready for anything.`, `${p.name} wants to get stronger.`, `${p.name} is wandering around.`]);
}
const canEvolve = p => p.stage < 5 && !p.final && p.evo >= EVO_NEED[p.stage];

function renderPartner(){
  if (state.tab !== 'partner') return;
  const v = $('#partnerView');
  if (!state.ready){ if (!v.querySelector('.status')) v.innerHTML = '<div class="status">Loading…</div>'; return; }
  const p = P();
  if (!p) return renderEgg();
  initMoves(p);
  const partyHtml = partyBar() + walletRow();
  const need = EVO_NEED[p.stage];
  const atTop = p.stage >= 5 || p.final;
  const lineImgs = p.line.map(id => state.byId.get(id)).filter(Boolean)
    .map(b => `<img alt="${esc(b.name)}" title="${esc(b.name)}" src="${esc(b.image)}">`).join('<span>→</span>');
  v.innerHTML = `
    ${partyHtml}
    <div class="ptop"><h2>${esc(p.name)}</h2><span class="stage">Lv ${p.level}</span><span class="stage">${LEVEL_EN[STAGES[p.stage]]}</span>
      <span class="stage">${ageText(p)}</span></div>
    <div class="habitat"><div class="bubble" id="bubble" aria-live="polite">${esc(moodLine(p))}</div>
      <img class="sprite" id="sprite" alt="${esc(p.name)}" src="${esc(p.image)}"></div>
    <div class="meters">${meter('Hunger', p.hunger)}${meter('Energy', p.energy)}${meter('Mood', p.mood)}</div>
    <div class="evobox">
      <div class="row statrow">${statChips(partnerStats(p))}</div>
      <div class="row"><span>LEVEL <b>${p.level}</b></span><span>XP <b>${p.xp} / ${XP_NEED(p.level)}</b></span></div>
      <div class="xptrack"><i style="width:${Math.min(100, p.xp / XP_NEED(p.level) * 100)}%"></i></div>
      <div class="row"><span>WINS <b>${p.wins}</b> · LOSSES <b>${p.losses}</b></span><span>MISTAKES <b>${p.stageMistakes}</b></span></div>
      ${atTop ? `<div class="row"><span>Final form reached. Keep battling or start a new egg.</span></div>`
        : `<div class="row"><span>DIGIVOLUTION</span><b>${Math.min(p.evo, need)} / ${need}</b></div>
           <div class="evotrack"><i style="width:${Math.min(100, p.evo / need * 100)}%"></i></div>`}
    </div>
    ${canEvolve(p) ? `<button class="big" id="evolveBtn">Digivolve!</button>` : ''}
    <div class="actions">
      <button class="act" data-act="feed">🍖 Feed<small>+hunger</small></button>
      <button class="act" data-act="play">⚽ Play<small>+mood</small></button>
      <button class="act" data-act="rest">💤 Rest<small>+energy</small></button>
      <button class="act" data-act="train" ${p.energy < 20 ? 'disabled' : ''}>💪 Train<small>${p.energy < 20 ? 'too tired' : 'raise stats'}</small></button>
      <button class="act" data-act="battle" ${p.energy < 25 ? 'disabled' : ''}>⚔️ Battle<small>${p.energy < 25 ? 'too tired' : '+evo points'}</small></button>
      <button class="act" data-act="moves">🌀 Moves<small>${p.moves.length} known · ${p.equip.length}/4 set</small></button>
    </div>
    <button class="act wide" data-act="dungeon" ${p.energy < 30 ? 'disabled' : ''}>🗺️ Explore a dungeon<small>${p.energy < 30 ? 'too tired (needs 30 energy)' : '5 floors · items · DigiData'}</small></button>

function retire(){

// ----- de-digivolve: step back one form to try a different branch -----
function dedigivolve(){
  const p = P(); if (busy || p.line.length < 2) return;
  const stages = p.stageLine || p.line.map((_, i) => i);
  p.line.pop(); stages.pop();
  const id = p.line[p.line.length - 1]; const b = state.byId.get(id);
  const from = p.name;
  p.id = id; p.name = b.name; p.image = b.image;
  p.stage = stages[stages.length - 1] ?? Math.max(0, p.stage - 1);
  p.stageLine = stages; p.evo = 0; p.stageMistakes = 0; p.final = false;
  say(`${from} de-digivolved back into ${b.name}. Raise it again to try a different path!`, 'happy');
}

// ----- overlay helpers -----
function openOv(html){ const o = $('#overlay'); o.innerHTML = `<div class="sheet">${html}</div>`; o.hidden = false; return o; }

// ----- stats: HP, SP, ATK, INT, SPD -----
// Each Digimon gets base stats from its stage plus a fixed per-species lean (some hit hard, some are casters, some are fast).
const STAT_BASE = { hp: [36, 60, 96, 150, 225, 315], sp: [10, 14, 20, 28, 38, 50], atk: [4, 7, 12, 19, 28, 40], int: [4, 7, 12, 19, 28, 40], spd: [4, 6, 10, 15, 21, 28] };
const STAT_KEYS = ['hp', 'sp', 'atk', 'int', 'spd'];
const STAT_LABEL = { hp: 'HP', sp: 'SP', atk: 'ATK', int: 'INT', spd: 'SPD' };
function seeded(id, salt){ let h = (Math.imul(id, 2654435761) ^ Math.imul(salt, 40503)) >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13; return (h % 1000) / 1000; }
function baseStats(id, stage){
  const s = Math.max(0, Math.min(5, stage | 0)), lean = seeded(id, 9);
  const f = (k, i) => 0.82 + seeded(id, i) * 0.4;
  const atkLean = 0.8 + lean * 0.4, intLean = 1.2 - lean * 0.4;
  return { hp: Math.round(STAT_BASE.hp[s] * f('hp', 1)), sp: Math.round(STAT_BASE.sp[s] * f('sp', 2) * (0.9 + (1 - lean) * 0.25)),
    atk: Math.round(STAT_BASE.atk[s] * f('atk', 3) * atkLean), int: Math.round(STAT_BASE.int[s] * f('int', 4) * intLean), spd: Math.round(STAT_BASE.spd[s] * f('spd', 5)) };
}
function growthOf(p){
  if (!p.growth) p.growth = { hp: 0, sp: 0, atk: Math.max(0, Math.round(((p.str || 2) - 2) / 2)), int: 0, spd: 0 };
  return p.growth;
}
function partnerStats(p){ const b = baseStats(p.id, p.stage), g = growthOf(p); const o = {}; STAT_KEYS.forEach(k => o[k] = b[k] + (g[k] || 0)); return o; }
function statChips(st){ return STAT_KEYS.map(k => `<span>${STAT_LABEL[k]} <b>${st[k]}</b></span>`).join(''); }

// ----- training: pick a stat, then tap when the marker is in the green zone -----
const TRAININGS = [
  { key: 'atk', icon: '💪', name: 'Power', desc: 'Raises ATK' },
  { key: 'int', icon: '🔮', name: 'Mind', desc: 'Raises INT' },
  { key: 'spd', icon: '💨', name: 'Agility', desc: 'Raises SPD' },
  { key: 'hp', icon: '🛡️', name: 'Stamina', desc: 'Raises HP and SP' },
];
function train(){
  const p = P(); busy = true;
  openOv(`<h4>Training · ${esc(p.name)}</h4>
    <p style="margin:0;color:var(--muted)">What should ${esc(p.name)} work on?</p>
    <div class="actions">${TRAININGS.map(t => `<button class="act" data-train="${t.key}">${t.icon} ${t.name}<small>${t.desc}</small></button>`).join('')}</div>
    <button class="ghost" id="trCancel">Cancel</button>`);
  $('#trCancel').onclick = closeOv;
  $('#overlay').querySelectorAll('[data-train]').forEach(b => b.onclick = () => trainGame(b.dataset.train));
}
function trainGame(kind){
  const p = P(); const t = TRAININGS.find(x => x.key === kind);
  const zoneW = [28, 26, 23, 20, 17, 15][p.stage];
  let round = 0, hits = 0, pos = 0, dir = 1, raf = 0, zoneL = 0, waiting = false;
  const results = [];
  const speed = () => 0.9 + round * 0.35 + p.stage * 0.12;
  $('#overlay .sheet').innerHTML = `<h4>${t.icon} ${t.name} training</h4>
    <p style="margin:0;color:var(--muted)">Tap <b>Hit!</b> when the marker is inside the green zone.</p>
    <div class="tmeter"><span class="zone" id="zone"></span><span class="mark" id="mark"></span></div>
    <div class="dots" id="dots">○ ○ ○</div>
    <button class="big" id="hit">Hit!</button>`;
  const placeZone = () => { zoneL = rand(5, 95 - zoneW); const z = $('#zone'); z.style.left = zoneL + '%'; z.style.width = zoneW + '%'; };
  const dots = () => { $('#dots').textContent = [0,1,2].map(i => i < round ? (results[i] ? '●' : '✕') : '○').join(' '); };
  const loop = () => { pos += dir * speed(); if (pos >= 100){ pos = 100; dir = -1; } if (pos <= 0){ pos = 0; dir = 1; } $('#mark').style.left = pos + '%'; raf = requestAnimationFrame(loop); };
  placeZone(); raf = requestAnimationFrame(loop);
  $('#hit').onclick = async () => {
    if (waiting) return;
    const ok = pos >= zoneL && pos <= zoneL + zoneW;
    results.push(ok); if (ok) hits++; round++; dots();
    if (round < 3){ waiting = true; cancelAnimationFrame(raf); await sleep(350); placeZone(); waiting = false; raf = requestAnimationFrame(loop); return; }
    cancelAnimationFrame(raf);
    const g = growthOf(p), per = 1 + Math.floor(p.stage / 2), bonus = hits && p.mood > 60 ? 1 : 0;
    let gained;
    if (kind === 'hp'){ const h = hits * per * 3 + bonus * 2, s = hits * per + bonus; g.hp += h; g.sp += s; gained = `+${h} HP, +${s} SP`; }
    else { const v = hits * per + bonus; g[kind] += v; gained = `+${v} ${STAT_LABEL[kind]}`; }
    p.evo += hits; p.energy = clamp(p.energy - 20); p.hunger = clamp(p.hunger - 10);
    if (!hits) p.mood = clamp(p.mood - 6);
    saveGame();
    $('#hit').textContent = 'Done';
    const lvr = await gainXP(p, hits * 3 + 1);
    $('#hit').onclick = () => { closeOv(); say((hits === 3 ? `Perfect training! ${p.name} gained ${gained}.` : hits ? `Good effort! ${p.name} gained ${gained}.` : `${p.name} missed every hit and looks discouraged.`) + levelText(lvr), hits ? 'happy' : null); };
  };
}

// ----- battle: turn-based, order by SPD, attribute triangle Vaccine > Virus > Data > Vaccine -----
const BEATS = { Vaccine: 'Virus', Virus: 'Data', Data: 'Vaccine' };
function attrMult(a, d){ if (BEATS[a] === d) return 1.5; if (BEATS[d] === a) return 0.75; return 1; }
function mainAttr(d){ const a = (d?.attributes || []).map(x => x.attribute).find(x => BEATS[x]); return a || (d?.attributes?.[0]?.attribute) || 'Free'; }
function movesFor(d, stage){
  const sk = (d?.skills || []).map(s => (s.translation && s.translation.trim()) || s.skill).filter(Boolean);
  const a = sk[0] || 'Data Burst', b = sk.length > 1 ? sk[sk.length - 1] : (sk[0] ? sk[0] + ' Max' : 'Digital Storm');
  return [
    { kind: 'atk', name: 'Attack', cost: 0 },
    { kind: 'skill', name: a, cost: 4 + stage * 2, power: 1.55 },
    { kind: 'skill', name: b, cost: 8 + stage * 3, power: 2.3 },
    { kind: 'guard', name: 'Guard', cost: 0 },
  ];
}
// ----- moves: each species gets its own moves from its real skills; partners learn them as they level -----
const STAGE_MIN_LV = [1, 6, 12, 20, 30, 42];
const XP_NEED = lv => 12 + lv * 6;
const BASIC = { name: 'Tackle', kind: 'phys', power: 1, desc: 'A basic body attack. Costs no SP.' };
const GUARD = { name: 'Guard', kind: 'guard', power: 0, cost: 0 };
const KIND_LABEL = { phys: 'PHY', mag: 'MAG', heal: 'HEAL', buff: 'BUFF', drain: 'DRAIN', guard: 'GRD' };
const GENERIC = [
  { name: 'Data Shot', kind: 'mag', power: 1.3, desc: 'Fires a compact burst of data.' },
  { name: 'Quick Strike', kind: 'phys', power: 1.3, desc: 'A fast physical hit.' },
  { name: 'Patch Up', kind: 'heal', power: 0.35, desc: 'Repairs damaged data, restoring HP.' },
  { name: 'Power Charge', kind: 'buff', power: 1.25, desc: 'Boosts all damage for the rest of the battle.' },
  { name: 'Byte Drain', kind: 'drain', power: 1.2, desc: 'Steals data from the foe to restore HP.' },
  { name: 'Heavy Slam', kind: 'phys', power: 1.9, desc: 'A crushing full-body slam.' },
  { name: 'Pulse Wave', kind: 'mag', power: 1.9, desc: 'A wave of digital energy.' },
];
function moveKind(name, desc){
  const t = (name + ' ' + (desc || '')).toLowerCase();
  if (/(heals|healing|heal |recover|restores|cures|revive)/.test(t)) return 'heal';
  if (/(drain|absorb|steals|leech)/.test(t)) return 'drain';
  if (/(powers? up|boosts|strengthen|increases|raises|barrier|shield)/.test(t)) return 'buff';
  if (/(punch|kick|claw|bite|tackle|slash|strike|horn|charge|fist|blade|sword|tail|ram|crush|smash|fang|head|lance|spear|axe|knuckle|chop|slam|stomp|body|cut|scratch|spin|drill|hammer|whip|jab|uppercut|talon)/.test(t)) return 'phys';
  return 'mag';
}
const learnCache = new Map();
function learnset(id, d, stage){
  const key = id + '|' + stage + '|' + (d ? 1 : 0);
  if (learnCache.has(key)) return learnCache.get(key);
  const base = STAGE_MIN_LV[stage] || 1, offs = [0, 2, 4, 7, 10, 14];
  const list = (d?.skills || []).filter(s => s.skill).slice(0, 6).map((s, i) => {
    const name = (s.translation && s.translation.trim()) || s.skill;
    const kind = moveKind(name, s.description);
    const power = kind === 'heal' ? 0.3 + i * 0.03 : kind === 'buff' ? 1.25 : Math.min(2.8, 1.35 + i * 0.3 + stage * 0.05);
    return { name, kind, power: Math.round(power * 100) / 100, learn: base + offs[i], desc: s.description || '' };
  });
  // species with few listed skills get a couple of generic moves picked for them
  for (let i = 0; list.length < 3 && i < 4; i++){
    const g = GENERIC[Math.floor(Math.abs(seeded(id, 20 + i + stage)) * GENERIC.length) % GENERIC.length];
    if (!list.some(m => m.name === g.name)) list.push(Object.assign({}, g, { learn: base + 3 + i * 4 }));
  }
  list.sort((a, b) => a.learn - b.learn);
  if (d) learnCache.set(key, list);
  return list;
}
function moveCost(m, stage){
  if (m.kind === 'guard' || (m.kind === 'phys' && m.power <= 1)) return 0;
  const f = m.kind === 'heal' ? 2.2 : m.kind === 'buff' ? 1.6 : m.power;
  return Math.max(2, Math.round(f * (3 + stage * 1.6)));
}
function toBattle(m, stage){ return { name: m.name, kind: m.kind, power: m.power, cost: moveCost(m, stage), desc: m.desc }; }
function moveLabel(m){
  const c = m.cost ? m.cost + ' SP · ' : 'free · ';
  if (m.kind === 'phys') return c + 'ATK ×' + m.power;
  if (m.kind === 'mag') return c + 'INT ×' + m.power;
  if (m.kind === 'drain') return c + 'INT ×' + m.power + ', heals';
  if (m.kind === 'heal') return c + 'heals ' + Math.round(m.power * 100) + '% HP';
  if (m.kind === 'buff') return c + '+' + Math.round((m.power - 1) * 100) + '% damage';
  return 'halve damage, +SP';
}
function initMoves(p){
  if (!p.level){ p.level = STAGE_MIN_LV[p.stage] || 1; p.xp = 0; }
  if (!Array.isArray(p.moves)){ p.moves = [Object.assign({}, BASIC)]; p.equip = [BASIC.name]; }
  if (!Array.isArray(p.equip)) p.equip = [BASIC.name];
}
function partnerMoves(p){
  initMoves(p);
  const eq = p.equip.map(n => p.moves.find(m => m.name === n)).filter(Boolean);
  if (!eq.length) eq.push(BASIC);
  // the free move always comes first so walking into enemies uses it
  eq.sort((a, b) => moveCost(a, p.stage) - moveCost(b, p.stage));
  return eq.map(m => toBattle(m, p.stage)).concat([GUARD]);
}
async function syncMoves(p){
  initMoves(p);
  let d = null; try{ d = await getDetail(p.id); }catch{ return []; }
  const learned = [];
  for (const m of learnset(p.id, d, p.stage)){
    if (m.learn > p.level || p.moves.some(k => k.name === m.name)) continue;
    p.moves.push({ name: m.name, kind: m.kind, power: m.power, desc: m.desc });
    if (p.equip.length < 4) p.equip.push(m.name);
    learned.push(m.name);
  }
  if (learned.length) saveGame();
  return learned;
}
async function gainXP(p, amount){
  initMoves(p);
  p.xp += Math.max(0, Math.round(amount)); const ups = [];
  while (p.xp >= XP_NEED(p.level) && p.level < 99){
    p.xp -= XP_NEED(p.level); p.level++;
    const g = growthOf(p); g[pick(['atk', 'int', 'spd'])] += 1; g.hp += 2;
    ups.push(p.level);
  }
  saveGame();
  const learned = ups.length ? await syncMoves(p) : [];
  return { ups, learned };
}
function levelText(r){
  if (!r || !r.ups.length) return '';
  return ' Level up! Now Lv ' + r.ups[r.ups.length - 1] + '.' + (r.learned.length ? ' Learned ' + r.learned.join(', ') + '!' : '');
}
function foeMoves(id, d, stage){
  const lv = (STAGE_MIN_LV[stage] || 1) + Math.floor(Math.random() * 8);
  const known = learnset(id, d, stage).filter(m => m.learn <= lv).sort((a, b) => b.power - a.power).slice(0, 3);
  return [toBattle(BASIC, stage)].concat(known.map(m => toBattle(m, stage))).concat([GUARD]);
}
async function movesScreen(){
  const p = P(); busy = true; initMoves(p);
  openOv('<h4>Moves · ' + esc(p.name) + '</h4><div class="status">Loading moves…</div>');

      '<p id="mvMsg" style="margin:0;min-height:1.2em;font-size:.85rem;color:var(--bad)"></p><button class="big" id="mvDone">Done</button>';
    $('#overlay').querySelectorAll('[data-eq]').forEach(b => b.onclick = () => {

      saveGame(); draw();

  draw();

function fighter(name, image, st, attr, moves, mood){
  const m = mood === undefined ? 1 : (mood >= 70 ? 1.05 : mood < 25 ? 0.92 : 1);
  const s = {}; STAT_KEYS.forEach(k => s[k] = Math.max(1, Math.round(st[k] * (k === 'hp' || k === 'sp' ? 1 : m))));
  return { name, image, st: s, hp: s.hp, sp: s.sp, attr, moves, guard: false };
}
function doMove(att, def, mv){
  if (mv.kind === 'heal'){ att.sp -= mv.cost || 0; const h = Math.max(1, Math.round(att.st.hp * mv.power)); att.hp = Math.min(att.st.hp, att.hp + h); return { text: att.name + ' used ' + mv.name + ' and restored ' + h + ' HP.' }; }
  if (mv.kind === 'buff'){ att.sp -= mv.cost || 0; att.buff = Math.min(1.9, (att.buff || 1) * mv.power); return { text: att.name + ' used ' + mv.name + '! Its attacks grew stronger.' }; }
  if (mv.kind === 'guard'){ att.guard = true; const g = Math.max(2, Math.ceil(att.st.sp * 0.2)); att.sp = Math.min(att.st.sp, att.sp + g); return { text: `${att.name} guards and recovers ${g} SP.` }; }
  att.sp -= mv.cost || 0;
  const evade = Math.max(0.03, Math.min(0.3, 0.05 + (def.st.spd - att.st.spd) * 0.012));
  if (Math.random() < evade) return { text: `${att.name} used ${mv.name}… but ${def.name} dodged!`, miss: true };
  const crit = Math.random() < Math.max(0.04, Math.min(0.25, 0.06 + (att.st.spd - def.st.spd) * 0.01));
  const am = attrMult(att.attr, def.attr);
  const base = (mv.kind === 'phys' || mv.kind === 'atk' ? att.st.atk : att.st.int) * (mv.power || 1) * (att.buff || 1);
  const dmg = Math.max(1, Math.round(base * rand(0.85, 1.15) * am * (crit ? 1.6 : 1) * (def.guard ? 0.5 : 1)));
  def.hp = Math.max(0, def.hp - dmg);
  let text = `${att.name} used ${mv.name}! ${dmg} damage.`;
  if (mv.kind === 'drain'){ const h = Math.max(1, Math.round(dmg / 2)); att.hp = Math.min(att.st.hp, att.hp + h); text += ' Drained ' + h + ' HP.'; }
  if (crit) text += ' Critical hit!';
  if (am > 1) text += ' Super effective!'; else if (am < 1) text += ' Not very effective…';
  if (def.guard) text += ' (guarded)';
  return { text, dmg };
}
function foeChoice(f, me){
  const usable = f.moves.filter(m => m.kind !== 'guard' && (m.cost || 0) <= f.sp);
  const guard = f.moves.find(m => m.kind === 'guard') || GUARD;
  const heal = usable.find(m => m.kind === 'heal');
  if (heal && f.hp < f.st.hp * 0.35 && Math.random() < 0.6) return heal;
  const buff = usable.find(m => m.kind === 'buff');
  if (buff && (f.buff || 1) < 1.3 && f.hp > f.st.hp * 0.6 && Math.random() < 0.3) return buff;
  const dmg = usable.filter(m => m.kind === 'phys' || m.kind === 'mag' || m.kind === 'drain');
  if (!dmg.length || (f.hp < f.st.hp * 0.3 && Math.random() < 0.15)) return guard;
  const score = m => (m.kind === 'phys' ? f.st.atk : f.st.int) * m.power * (0.7 + Math.random() * 0.6);
  return dmg.sort((a, b) => score(b) - score(a))[0];
}

async function battle(){
  const p = P(); busy = true;
  openOv(`<h4>Searching for a wild Digimon…</h4><div class="status">Loading battle data…</div>`);
  const pool = (state.stageIds[p.stage] || []).filter(id => id !== p.id && state.byId.has(id));
  const foeBase = state.byId.get(pick(pool));
  let myD = null, foeD = null;
  try{ [myD, foeD] = await Promise.all([getDetail(p.id), getDetail(foeBase.id)]); }catch{}
  await syncMoves(p);
  const mine = partnerStats(p), myBase = baseStats(p.id, p.stage), fb = baseStats(foeBase.id, p.stage);
  const foeSt = {}; STAT_KEYS.forEach(k => foeSt[k] = Math.max(1, Math.round(fb[k] * rand(0.92, 1.1) + 0.55 * (mine[k] - myBase[k]))));
  const me = fighter(p.name, p.image, mine, mainAttr(myD), partnerMoves(p), p.mood);
  const foe = fighter(foeBase.name, foeBase.image, foeSt, mainAttr(foeD), foeMoves(foeBase.id, foeD, p.stage));
  G.col[foeBase.id] = G.col[foeBase.id] || 'seen';
  saveGame();

  const side = (f, id) => `<div class="fighter" id="${id}"><img alt="" src="${esc(f.image)}"><b>${esc(f.name)}</b>
      <span class="attr">${esc(f.attr)}</span>
      <div class="bars"><div class="hp"><i></i></div><small class="hpt"></small><div class="hp spb"><i></i></div><small class="spt"></small></div></div>`;
  $('#overlay .sheet').innerHTML = `<h4>Wild battle!</h4>
    <div class="arena">${side(me, 'fMe')}<div class="vs">VS</div>${side(foe, 'fFoe')}</div>
    <div class="row statrow"><span>You: ${statChips(me.st)}</span></div>
    <div class="blog" id="blog" aria-live="polite">A wild ${esc(foe.name)} appeared! ${me.st.spd >= foe.st.spd ? `${esc(me.name)} is faster.` : `${esc(foe.name)} is faster.`}</div>
    <div class="bact" id="bact">${me.moves.map((m, i) => `<button class="act" data-mv="${i}">${esc(m.name)}<small>${esc(moveLabel(m))}</small></button>`).join('')}
      <button class="act" data-mv="run">Run<small>Escape (SPD)</small></button></div>`;
  const draw = () => {
    for (const [f, id] of [[me, '#fMe'], [foe, '#fFoe']]){
      const el = $(id); if (!el) continue;
      const hp = f.hp / f.st.hp * 100, sp = f.sp / f.st.sp * 100;
      el.querySelector('.hp:not(.spb) i').style.width = hp + '%'; el.querySelector('.hp:not(.spb) i').style.background = meterColor(hp);
      el.querySelector('.spb i').style.width = sp + '%';
      el.querySelector('.hpt').textContent = `HP ${f.hp}/${f.st.hp}`; el.querySelector('.spt').textContent = `SP ${f.sp}/${f.st.sp}`;
    }
  };
  const log = t => { const b = $('#blog'); if (b) b.textContent = t; };
  const hitFx = id => { const el = $(id); if (!el) return; el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); };
  const setButtons = on => $('#overlay').querySelectorAll('[data-mv]').forEach(b => {
    const m = me.moves[+b.dataset.mv]; b.disabled = !on || (m && m.cost > me.sp);
  });
  const playerMove = () => new Promise(res => { setButtons(true); $('#overlay').querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { setButtons(false); res(b.dataset.mv); }); });
  draw(); setButtons(false);
  await sleep(900);

  let outcome = null;
  for (let turn = 1; turn <= 40 && !outcome; turn++){
    const order = me.st.spd > foe.st.spd || (me.st.spd === foe.st.spd && Math.random() < 0.5) ? [me, foe] : [foe, me];
    for (const actor of order){
      if (outcome) break;
      actor.guard = false;
      if (actor === me){
        log(`Your move. What should ${me.name} do?`);
        const choice = await playerMove();
        if (choice === 'run'){
          if (Math.random() < Math.max(0.2, Math.min(0.95, 0.55 + (me.st.spd - foe.st.spd) * 0.04))){ outcome = 'ran'; log(`${me.name} got away safely.`); break; }
          log(`${me.name} couldn't get away!`); await sleep(800); continue;
        }
        const r = doMove(me, foe, me.moves[+choice]);
        if (r.dmg) hitFx('#fFoe');
        log(r.text);
      } else {
        await sleep(350);
        const r = doMove(foe, me, foeChoice(foe, me));
        if (r.dmg) hitFx('#fMe');
        log(r.text);
      }
      draw();
      await sleep(1000);
      if (foe.hp <= 0) outcome = 'win'; else if (me.hp <= 0) outcome = 'lose';
    }
    // a little SP comes back every round
    if (!outcome) for (const f of [me, foe]) f.sp = Math.min(f.st.sp, f.sp + 1);
  }
  if (!outcome) outcome = me.hp / me.st.hp >= foe.hp / foe.st.hp ? 'win' : 'lose';

  p.energy = clamp(p.energy - 25); p.hunger = clamp(p.hunger - 10);
  let summary;
  if (outcome === 'win'){
    const g = growthOf(p), k = pick(['atk', 'int', 'spd', 'hp']), v = k === 'hp' ? 3 + p.stage : 1 + Math.floor(p.stage / 2);
    g[k] += v; if (k === 'hp') g.sp += 1;
    p.wins++; p.evo += 3; p.mood = clamp(p.mood + 8);
    summary = `${p.name} won! +3 digivolution points, +${v} ${STAT_LABEL[k]}.`;
  } else if (outcome === 'lose'){ p.losses++; p.evo += 1; p.mood = clamp(p.mood - 10); summary = `${p.name} was defeated… Train up and try again.`; }
  else summary = `${p.name} escaped from ${foe.name}.`;
  saveGame();
  const xp = outcome === 'win' ? 10 + p.stage * 6 : outcome === 'lose' ? 3 + p.stage * 2 : 0;
  if (xp){ const lv = await gainXP(p, xp); summary += ' +' + xp + ' XP.' + levelText(lv); }
  $('#bact').innerHTML = `<button class="big" id="bDone">Continue</button>`;
  log(summary);
  $('#bDone').onclick = () => { closeOv(); say(outcome === 'win' ? `${p.name} beat ${foe.name}!` : outcome === 'lose' ? `${p.name} lost to ${foe.name}.` : `${p.name} ran from ${foe.name}.`, outcome === 'win' ? 'happy' : null); };
}

// ================= DUNGEON: turn-based, procedurally generated floors =================
const DG = { W: 34, H: 26, FLOORS: 5, VW: 11, VH: 9, SIGHT: 4 };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let dg = null;
const dgImgs = {};

function dgImage(id){
  if (dgImgs[id]) return dgImgs[id];
  const im = new Image(); dgImgs[id] = im;
  const src = state.byId.get(id)?.image;
  if (src) processArt(src, retroOn ? 40 : 96, retroOn).then(u => { if (u) im.src = u; });
  return im;
}

function genFloor(){
  for (let attempt = 0; attempt < 20; attempt++){
    const W = DG.W, H = DG.H, map = new Uint8Array(W * H), rooms = [];
    for (let t = 0; t < 80 && rooms.length < 8; t++){
      const w = 4 + (Math.random() * 5 | 0), h = 3 + (Math.random() * 4 | 0);
      const x = 1 + (Math.random() * (W - w - 2) | 0), y = 1 + (Math.random() * (H - h - 2) | 0);
      if (rooms.some(r => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
      rooms.push({ x, y, w, h });
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j * W + i] = 1;
    }
    if (rooms.length < 4) continue;
    const ctr = r => [r.x + (r.w >> 1), r.y + (r.h >> 1)];
    const carve = (x1, y1, x2, y2) => {
      let x = x1, y = y1;
      const sx = () => { while (x !== x2){ x += Math.sign(x2 - x); map[y * W + x] = 1; } };
      const sy = () => { while (y !== y2){ y += Math.sign(y2 - y); map[y * W + x] = 1; } };
      if (Math.random() < 0.5){ sx(); sy(); } else { sy(); sx(); }
    };
    rooms.sort((a, b) => a.x - b.x);
    for (let i = 1; i < rooms.length; i++){ const a = ctr(rooms[i - 1]), b = ctr(rooms[i]); carve(a[0], a[1], b[0], b[1]); }
    for (let k = 0; k < 2; k++){ const r1 = pick(rooms), r2 = pick(rooms); if (r1 !== r2){ const a = ctr(r1), b = ctr(r2); carve(a[0], a[1], b[0], b[1]); } }
    return { map, rooms };
  }
  return null;
}

const dgFloor = (x, y) => x >= 0 && y >= 0 && x < DG.W && y < DG.H && dg.map[y * DG.W + x] === 1;
const dgRoomAt = (x, y) => dg.rooms.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
function dgUnitAt(x, y){
  if (dg.me.x === x && dg.me.y === y) return dg.me;
  if (dg.ally && dg.ally.hp > 0 && dg.ally.x === x && dg.ally.y === y) return dg.ally;
  return dg.enemies.find(e => e.x === x && e.y === y) || null;
}
function dgFreeSpot(avoidRoom){
  for (let t = 0; t < 400; t++){
    const r = pick(dg.rooms); if (r === avoidRoom && dg.rooms.length > 1) continue;
    const x = r.x + (Math.random() * r.w | 0), y = r.y + (Math.random() * r.h | 0);
    if (!dgUnitAt(x, y) && !dg.items.some(i => i.x === x && i.y === y) && !(dg.stairs && dg.stairs.x === x && dg.stairs.y === y)) return { x, y };
  }
  return null;
}
// one step along the shortest path from (sx,sy) toward (tx,ty), avoiding other units
function dgStep(u, tx, ty, maxR){
  const W = DG.W, start = u.y * W + u.x, goal = ty * W + tx;
  const prev = new Map([[start, -1]]), q = [start];
  for (let qi = 0; qi < q.length && qi < 900; qi++){
    const c = q[qi]; if (c === goal) break;
    const cx = c % W, cy = (c / W) | 0;
    for (const d of Object.values(DIRS)){
      const nx = cx + d[0], ny = cy + d[1], n = ny * W + nx;
      if (prev.has(n) || !dgFloor(nx, ny) || Math.abs(nx - u.x) + Math.abs(ny - u.y) > maxR) continue;
      const occ = dgUnitAt(nx, ny); if (occ && n !== goal) continue;
      prev.set(n, c); q.push(n);
    }
  }
  if (!prev.has(goal)) return null;
  let c = goal; while (prev.get(c) !== start && prev.get(c) !== -1) c = prev.get(c);
  if (prev.get(c) === -1) return null;
  return { x: c % W, y: (c / W) | 0 };
}

function dgUnit(id, name, st, attr, moves, hpScale){
  const hp = Math.max(1, Math.round(st.hp * (hpScale || 1)));
  return { id, name, st, attr, moves, hp, max: hp, sp: st.sp, x: 0, y: 0, img: dgImage(id) };
}

async function dungeon(){
  const p = P(); busy = true;
  openOv('<h4>Entering the dungeon…</h4><div class="status">Generating floor 1…</div>');
  const ally = G.party.length > 1 ? G.party[(G.active + 1) % G.party.length] : null;
  let myD = null, allyD = null;
  try{ [myD, allyD] = await Promise.all([getDetail(p.id), ally ? getDetail(ally.id) : null]); }catch{}
  await syncMoves(p); if (ally) await syncMoves(ally);
  const st = partnerStats(p);
  dg = { stage: p.stage, floor: 0, data: 0, kos: 0, turn: 0, steps: 0, bag: { meat: 1, disk: 1 }, eggs: 0, over: false,
    me: dgUnit(p.id, p.name, st, mainAttr(myD), partnerMoves(p), 1), ally: null, log: [], sel: 0 };
  const firstSkill = dg.me.moves.findIndex(mv => mv.cost > 0 && mv.kind !== 'guard');
  dg.sel = firstSkill >= 0 ? firstSkill : 0;
  dg.me.face = DIRS.down;
  if (ally){ const ast = partnerStats(ally); dg.ally = dgUnit(ally.id, ally.name, ast, mainAttr(allyD), partnerMoves(ally), 1); }
  p.energy = clamp(p.energy - 30); saveGame();
  dgNextFloor();
  dgUI();
}

function dgNextFloor(){
  dg.floor++;
  const f = genFloor(); dg.map = f.map; dg.rooms = f.rooms;
  dg.seen = new Uint8Array(DG.W * DG.H); dg.enemies = []; dg.items = []; dg.stairs = null;
  const startRoom = dg.rooms[0];
  dg.me.x = startRoom.x + (startRoom.w >> 1); dg.me.y = startRoom.y + (startRoom.h >> 1);
  if (dg.ally && dg.ally.hp > 0){ const s = [[1,0],[-1,0],[0,1],[0,-1]].map(d => [dg.me.x + d[0], dg.me.y + d[1]]).find(c => dgFloor(c[0], c[1])) || [dg.me.x, dg.me.y]; dg.ally.x = s[0]; dg.ally.y = s[1]; }
  dg.stairs = dgFreeSpot(startRoom);
  // a few species per floor, from the leader's level
  const pool = (state.stageIds[dg.stage] || []).filter(id => state.byId.has(id));
  dg.species = [pick(pool), pick(pool), pick(pool)];
  const n = 3 + dg.floor;
  for (let i = 0; i < n; i++) dgSpawn(startRoom);
  const ni = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < ni; i++){
    const s = dgFreeSpot(); if (!s) continue;
    const r = Math.random();
    const type = dg.floor >= 3 && r < 0.05 ? 'egg' : r < 0.45 ? 'chip' : r < 0.75 ? 'meat' : 'disk';
    dg.items.push({ x: s.x, y: s.y, type });
  }
  dgReveal();
  dgLog('Floor ' + dg.floor + ' of ' + DG.FLOORS + '. Find the stairs!');
}

function dgSpawn(avoidRoom){
  if (dg.enemies.length >= 9) return;
  const s = dgFreeSpot(avoidRoom); if (!s) return;
  const id = pick(dg.species), b = state.byId.get(id); if (!b) return;
  const base = baseStats(id, dg.stage), mine = partnerStats(P()), myBase = baseStats(P().id, P().stage);
  const scale = 1 + 0.07 * (dg.floor - 1), st = {};
  STAT_KEYS.forEach(k => st[k] = Math.max(1, Math.round((base[k] + 0.4 * (mine[k] - myBase[k])) * scale)));
  const e = dgUnit(id, b.name, st, 'Free', foeMoves(id, null, dg.stage), 0.45);
  e.x = s.x; e.y = s.y; e.awake = false;
  dg.enemies.push(e);
  getDetail(id).then(d => { e.attr = mainAttr(d); e.moves = foeMoves(id, d, dg.stage); }).catch(() => {});
}

function dgVisible(x, y){
  const m = dg.me, r = dgRoomAt(m.x, m.y);
  if (r && x >= r.x - 1 && x <= r.x + r.w && y >= r.y - 1 && y <= r.y + r.h) return true;
  return Math.max(Math.abs(x - m.x), Math.abs(y - m.y)) <= 2;
}
function dgReveal(){
  const m = dg.me, r = dgRoomAt(m.x, m.y);
  const mark = (x, y) => { if (x >= 0 && y >= 0 && x < DG.W && y < DG.H) dg.seen[y * DG.W + x] = 1; };
  if (r) for (let y = r.y - 1; y <= r.y + r.h; y++) for (let x = r.x - 1; x <= r.x + r.w; x++) mark(x, y);
  for (let y = m.y - 2; y <= m.y + 2; y++) for (let x = m.x - 2; x <= m.x + 2; x++) mark(x, y);
}

function dgLog(t){ dg.log.push(t); if (dg.log.length > 3) dg.log.shift(); const el = $('#dlog'); if (el) el.innerHTML = dg.log.map(esc).join('<br>'); }

function dgHit(att, def, mv){
  const r = doMove(att, def, mv);
  dgLog(r.text);
  if (r.dmg){ def.flash = 3; if (def.hp <= 0) dgDown(def, att); }
}
function dgDown(u, by){
  if (u === dg.me){ dgLog(dg.me.name + ' fainted…'); dgEnd('faint'); return; }
  if (u === dg.ally){ dgLog(u.name + ' fainted and was carried out.'); return; }
  dg.enemies = dg.enemies.filter(e => e !== u);
  dg.kos++; const gain = 3 + dg.stage * 2; dg.data += gain;
  if (!G.col[u.id]) G.col[u.id] = 'seen';
  dgLog(u.name + ' was defeated! +' + gain + ' DigiData.');
}

// one player action, then everyone else moves
function dgAct(action, dir){
  if (!dg || dg.over || dg.busy) return;
  const m = dg.me;
  m.guard = false;
  if (action === 'move'){
    m.face = dir;
    const nx = m.x + dir[0], ny = m.y + dir[1], occ = dgUnitAt(nx, ny);
    if (occ && occ !== dg.ally) dgHit(m, occ, m.moves[0]);
    else if (!dgFloor(nx, ny)) { dgDraw(); return; }
    else {
      if (occ === dg.ally){ dg.ally.x = m.x; dg.ally.y = m.y; }
      m.x = nx; m.y = ny; dg.steps++;
      const it = dg.items.find(i => i.x === nx && i.y === ny);
      if (it){ dg.items = dg.items.filter(i => i !== it); dgPickup(it); }
    }
  } else if (action === 'skill'){
    const mv = m.moves[dg.sel] || m.moves[0];
    if ((mv.cost || 0) > m.sp){ dgLog('Not enough SP for ' + mv.name + '.'); return; }
    if (mv.kind === 'heal' || mv.kind === 'buff' || mv.kind === 'guard') dgHit(m, m, mv);
    else {
      let target = null; const range = mv.cost ? 4 : 1;
      for (let k = 1; k <= range; k++){
        const x = m.x + m.face[0] * k, y = m.y + m.face[1] * k;
        if (!dgFloor(x, y)) break;
        const u = dgUnitAt(x, y); if (u && u !== dg.ally){ target = u; break; }
      }
      if (target) dgHit(m, target, mv); else { m.sp -= mv.cost || 0; dgLog(m.name + ' used ' + mv.name + ', but hit nothing.'); }
    }
  } else if (action === 'meat'){
    if (!dg.bag.meat) return;
    dg.bag.meat--; const h = Math.round(m.max * 0.4); m.hp = Math.min(m.max, m.hp + h); P().hunger = clamp(P().hunger + 25);
    dgLog(m.name + ' ate meat. +' + h + ' HP, belly filled.');
  } else if (action === 'disk'){
    if (!dg.bag.disk) return;
    dg.bag.disk--; const s = Math.round(m.st.sp * 0.6); m.sp = Math.min(m.st.sp, m.sp + s);
    dgLog('Used an SP Disk. +' + s + ' SP.');
  }
  if (dg.over) return;
  if (dg.stairs && m.x === dg.stairs.x && m.y === dg.stairs.y){
    if (dg.floor >= DG.FLOORS){ dgEnd('clear'); return; }
    dgLog('Found the stairs!'); dgNextFloor(); dgDraw(); return;
  }
  dgWorld();
  dgReveal(); dgDraw();
}

function dgPickup(it){
  if (it.type === 'chip'){ const v = 6 + dg.stage * 4 + (Math.random() * 6 | 0); dg.data += v; dgLog('Picked up a Data Chip: +' + v + ' DigiData.'); }
  else if (it.type === 'meat'){ dg.bag.meat++; dgLog('Picked up some meat.'); }
  else if (it.type === 'disk'){ dg.bag.disk++; dgLog('Picked up an SP Disk.'); }
  else if (it.type === 'egg'){ dg.eggs++; dgLog('Found a Mystery Egg!'); }
}

function dgWorld(){
  dg.turn++;
  const m = dg.me, a = dg.ally;
  // ally: fight next to it, otherwise stay close to the leader
  if (a && a.hp > 0){
    const foe = dg.enemies.find(e => Math.abs(e.x - a.x) + Math.abs(e.y - a.y) === 1);
    a.guard = false;
    if (foe) dgHit(a, foe, foeChoice(a, foe));
    else if (Math.abs(a.x - m.x) + Math.abs(a.y - m.y) > 1){ const s = dgStep(a, m.x, m.y, 20); if (s){ a.x = s.x; a.y = s.y; } }
  }
  if (dg.over) return;
  for (const e of dg.enemies.slice()){
    if (dg.over) return;
    if (!dg.enemies.includes(e)) continue;
    e.guard = false;
    const targets = [m, a].filter(u => u && u.hp > 0);
    const t = targets.sort((u, v) => (Math.abs(u.x - e.x) + Math.abs(u.y - e.y)) - (Math.abs(v.x - e.x) + Math.abs(v.y - e.y)))[0];
    const dist = Math.abs(t.x - e.x) + Math.abs(t.y - e.y);
    if (dist <= 7 || dgRoomAt(e.x, e.y) && dgRoomAt(e.x, e.y) === dgRoomAt(m.x, m.y)) e.awake = true;
    if (dist === 1){ dgHit(e, t, foeChoice(e, t)); continue; }
    if (e.awake){ const s = dgStep(e, t.x, t.y, 14); if (s){ e.x = s.x; e.y = s.y; } }
    else if (Math.random() < 0.5){ const d = pick(Object.values(DIRS)); if (dgFloor(e.x + d[0], e.y + d[1]) && !dgUnitAt(e.x + d[0], e.y + d[1])){ e.x += d[0]; e.y += d[1]; } }
  }
  // regen, belly, reinforcements
  if (dg.turn % 4 === 0){ for (const u of [m, a]) if (u && u.hp > 0 && u.hp < u.max) u.hp++; }
  if (dg.turn % 6 === 0){ for (const u of [m, a]) if (u && u.hp > 0 && u.sp < u.st.sp) u.sp++; }
  const p = P(); p.hunger = clamp(p.hunger - 0.1);
  if (p.hunger <= 0){ m.hp = Math.max(0, m.hp - 1); if (dg.turn % 5 === 0) dgLog(m.name + ' is starving!'); if (m.hp <= 0) dgDown(m); }
  if (dg.turn % 30 === 0) dgSpawn(dgRoomAt(m.x, m.y));
}

function dgEnd(result){
  if (dg.over) return;
  dg.over = true;
  const p = P(), r = dg;
  let data = r.data, evo = Math.floor(r.kos / 2), eggs = r.eggs, title, note;
  if (result === 'clear'){
    data += 30 * (r.stage + 1) + 10 * DG.FLOORS; evo += 5;
    if (Math.random() < 0.25) eggs++;
    p.mood = clamp(p.mood + 15); title = 'Dungeon cleared!';
    note = 'You made it through all ' + DG.FLOORS + ' floors.';
  } else if (result === 'faint'){
    data = Math.floor(data / 2); eggs = 0; p.mood = clamp(p.mood - 15); title = 'Knocked out';
    note = p.name + ' fainted on floor ' + r.floor + '. Half the DigiData and any eggs were lost.';
  } else { title = 'Left the dungeon'; note = 'You escaped from floor ' + r.floor + ' with everything you found.'; }
  G.data += data; p.evo += evo; for (let i = 0; i < eggs; i++) G.eggs.push('mystery');
  const xp = Math.round((r.kos * (3 + 2 * r.stage) + (result === 'clear' ? 20 + 10 * r.stage : 0)) * (result === 'faint' ? 0.5 : 1));
  if (xp) gainXP(p, xp).then(lv => { const el = $('#dgLv'); if (el) el.textContent = '+' + xp + ' XP.' + levelText(lv); });
  saveGame();
  const sheet = $('#overlay .sheet');
  if (sheet) sheet.innerHTML = '<h4>' + title + '</h4><p style="margin:0;color:var(--muted)">' + esc(note) + '</p>' +
    '<div class="wallet" style="justify-content:space-between"><span>Defeated <b>' + r.kos + '</b></span><span>DigiData <b>+' + data + '</b></span><span>Evo <b>+' + evo + '</b></span>' + (eggs ? '<span>Eggs <b>+' + eggs + '</b></span>' : '') + '</div>' +
    '<p id="dgLv" style="margin:0;font-size:.88rem"></p><button class="big" id="dgDone">Continue</button>';
  const b = $('#dgDone'); if (b) b.onclick = () => { closeOv(); dg = null; say(result === 'clear' ? p.name + ' cleared the dungeon!' : result === 'faint' ? p.name + ' needs some rest after the dungeon.' : p.name + ' came back from the dungeon.', result === 'clear' ? 'happy' : null); };
}

// ----- dungeon screen -----
