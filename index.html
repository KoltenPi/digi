    '<div class="lbs">' + (rows.length ? rows.map((r, i) => row(r, i + 1)).join('') : '<p class="ownline">No Tamers yet. You could be the first!</p>') + '</div>' + me +
    '<p class="ownline">Your stats upload when you open this section and when you leave the app.</p>';
  el.querySelectorAll('[data-board]').forEach(b => b.onclick = () => { state.onlBoard = b.dataset.board; viewRanks(el).catch(e => onlSay(netErr(e))); });
}

// ----- weekly raid: one huge boss shared by every player -----
var RAID_PER = 1200;           // raid HP each new attacker adds, so the boss stays a challenge however many join
var RAID_TRIES = 3;            // raid fights per day
const raidWeek = () => 'w' + weekNo();
function raidBossId(){ const pool = (state.stageIds[5] || []).filter(id => !isExtra(id) && !state.armor.has(id) && state.byId.has(id)); return pool[Math.floor(Math.abs(seeded(weekNo(), 4242)) * pool.length) % pool.length]; }
function raidLocal(){
  const w = raidWeek(), day = dayKey();
  if (!G.raid || G.raid.week !== w) G.raid = { week: w, day, used: 0, dmg: 0, joined: false, claimed: false };
  if (G.raid.day !== day){ G.raid.day = day; G.raid.used = 0; }
  return G.raid;
}
async function raidDoc(){
  const N = await net(), F = N.F, ref = F.doc(N.db, 'raids', raidWeek());
  let s = await F.getDoc(ref);
  if (!s.exists()){
    const id = raidBossId(), b = state.byId.get(id);
    try{ await F.setDoc(ref, { boss: { id, name: b.name, image: b.image }, hp: 0, hitters: 0, week: raidWeek() }); }catch{}
    s = await F.getDoc(ref);
  }
  return s.data();
}
async function viewRaid(el){
  const N = await net(), F = N.F, R = raidLocal(), d = await raidDoc(), p = P();
  const max = RAID_PER * (d.hitters || 0), down = d.hitters > 0 && d.hp <= 0, left = RAID_TRIES - R.used;
  const top = await F.getDocs(F.query(F.collection(N.db, 'raids', raidWeek(), 'hits'), F.orderBy('dmg', 'desc'), F.limit(10)));
  const ends = (weekNo() + 1) * 7 * 864e5 - 3 * 864e5 - Date.now();
  const block = !p ? 'no partner' : asleep(p) ? 'asleep' : careInit(p).sick ? 'sick' : p.energy < 25 ? 'too tired' : '';
  el.innerHTML = '<div class="raidboss"><img alt="" src="' + esc(d.boss.image) + '"><div><h3 style="margin:0">👑 ' + esc(d.boss.name) + '</h3>' +
      '<small class="ownline">This week\'s raid boss · ends in ' + fmtLeft(ends) + '</small>' +
      '<div class="evotrack" style="margin-top:6px"><i style="width:' + (max ? Math.max(0, d.hp / max * 100) : 100) + '%;background:var(--bad)"></i></div>' +
      '<small>' + (down ? 'Defeated! 🎉' : max ? 'HP ' + d.hp.toLocaleString() + ' / ' + max.toLocaleString() : 'Nobody has attacked yet') + ' · ' + (d.hitters || 0) + ' Tamer' + (d.hitters === 1 ? '' : 's') + '</small></div></div>' +
    '<div class="wallet"><span>Your damage <b>' + R.dmg + '</b></span><span>Fights left today <b>' + Math.max(0, left) + ' / ' + RAID_TRIES + '</b></span></div>' +
    (down ? (R.dmg && !R.claimed ? '<button class="big" id="raidClaim">Claim your raid reward</button>' : R.claimed ? '<p class="ownline">✓ Reward claimed. A new boss arrives next week.</p>' : '<p class="ownline">The boss was defeated before you joined. A new boss arrives next week.</p>')
      : '<button class="big" id="raidGo"' + (block || left <= 0 ? ' disabled' : '') + '>' + (left <= 0 ? 'No fights left today' : block ? (p ? esc(p.name) + ' is ' + block : 'You need a partner') : '⚔️ Attack with ' + esc(p.name) + ' · 25 energy') + '</button>') +
    '<p class="ownline">Each fight, your partner battles a copy of the boss. The more of its HP you knock out, the more raid damage you deal (win for a bonus). Everyone who helps gets a reward when the boss falls, bigger for more damage.</p>' +
    '<h5 class="lockh">Top attackers</h5><div class="lbs">' + (top.docs.length ? top.docs.map((h, i) => '<div class="lbrow' + (h.id === N.uid ? ' me' : '') + '"><b>#' + (i + 1) + '</b><span></span><span>' + esc(h.data().name || '?') + '</span><b>' + (h.data().dmg || 0) + '</b></div>').join('') : '<p class="ownline">No attacks yet.</p>') + '</div>';
  const go = $('#raidGo'); if (go) go.onclick = () => raidFight(d.boss);
  const cl = $('#raidClaim'); if (cl) cl.onclick = () => {
    const item = pick(['egg:golden', 'egg:rare', 'egg:champion', randomCrest() || 'h:band', randomHeld()]), data = 300 + R.dmg * 2;
    R.claimed = true; G.data += data; grantItem(item); saveGame(); updateCount();
    onlineView('Raid reward: +' + data + ' DigiData and ' + itemIcon(item) + ' ' + itemName(item) + '!');
  };
}
function raidFight(boss){
  const p = P(), R = raidLocal(); if (!p || R.used >= RAID_TRIES || p.energy < 25 || busy) return;
  p.energy = clamp(p.energy - 25); R.used++; saveGame();
  battle(DIFFS[2], { foeId: boss.id, mult: 1.25, hpMul: 5, title: '👑 Raid · ' + boss.name, noRun: true, onDone: async (outcome, info) => {
    const pct = info && info.max ? Math.round(100 * Math.min(1, info.dealt / info.max)) : 0, dmg = pct + (outcome === 'win' ? 50 : 0), join = !R.joined;
    R.dmg += dmg; R.joined = true; const reward = 20 + Math.round(dmg / 2); G.data += reward; addBond(p, 1); saveGame();
    let line = 'You knocked out ' + pct + '% of its HP' + (outcome === 'win' ? ' and won (+50 bonus)' : '') + ': <b>' + dmg + ' raid damage</b>. +' + reward + ' DigiData.';
    $('#overlay .sheet').innerHTML = '<h4>👑 Raid fight over</h4><p style="margin:0" id="raidRes">' + line + '<br><small>Sending your damage…</small></p><button class="big" id="raidBack">Back to the raid</button>';
    $('#raidBack').onclick = () => { closeOv(); state.onlSub = 'raid'; setTab('world'); renderWorld('online'); };
    try{
      const N = await net(), F = N.F, ref = F.doc(N.db, 'raids', raidWeek());
      const res = await F.runTransaction(N.db, async tx => {
        const s = await tx.get(ref), d = s.data();
        if (d.hitters > 0 && d.hp <= 0) return { over: true };
        let hp = d.hp, hitters = d.hitters; if (join){ hp += RAID_PER; hitters++; }
        hp = Math.max(0, hp - dmg); tx.update(ref, { hp, hitters }); return { hp, hitters };
      });
      await F.setDoc(F.doc(N.db, 'raids', raidWeek(), 'hits', N.uid), { name: onl().name, dmg: F.increment(dmg), t: F.serverTimestamp() }, { merge: true });
      const el = $('#raidRes'); if (el) el.innerHTML = line + '<br><small>' + (res.over ? 'The boss was already defeated!' : res.hp <= 0 ? '🎉 You landed the final blow! The boss is down.' : 'Boss HP left: ' + res.hp.toLocaleString()) + '</small>';
    }catch(e){ const el = $('#raidRes'); if (el) el.innerHTML = line + '<br><small>' + esc(netErr(e)) + ' Your damage still counts toward your reward.</small>'; }
  } });
}

// ----- trade board -----
async function viewTrades(el){
  const N = await net(), F = N.F, O = onl(); O.claimed = O.claimed || {};
  // first, settle any of your trades that someone took
  const mine = await F.getDocs(F.query(F.collection(N.db, 'trades'), F.where('from', '==', N.uid)));
  const sold = [];
  for (const d of mine.docs){
    const t = d.data(); if (t.status !== 'taken') continue;
    if (!O.claimed[d.id]){ O.claimed[d.id] = 1; G.data += t.paid || 0; sold.push(t.monName + ' went to ' + (t.takerName || 'someone') + (t.paid ? ' for ' + t.paid + ' DigiData' : '')); }
    F.deleteDoc(d.ref).catch(() => {});
  }
  if (sold.length){ saveGame(); updateCount(); }
  const open = await F.getDocs(F.query(F.collection(N.db, 'trades'), F.where('status', '==', 'open'), F.limit(60)));
  const list = open.docs.map(d => Object.assign({ id: d.id, ref: d.ref }, d.data())).sort((a, b) => ((b.t && b.t.seconds) || 0) - ((a.t && a.t.seconds) || 0));
  const card = t => '<div class="tcard"><img alt="" src="' + esc(t.monImage) + '"><div><b>' + esc(t.monName) + '</b><small>' + LEVEL_EN[STAGES[t.monStage]] + ' · Lv ' + t.monLevel + ' · from ' + esc(t.fromName || '?') + '</small>' + (t.note ? '<small>“' + esc(t.note) + '”</small>' : '') + '</div>' +
    (t.from === N.uid ? '<button class="ghost" data-tcancel="' + t.id + '">Cancel</button>' : '<button class="act" data-ttake="' + t.id + '"' + (G.data < (t.price || 0) ? ' disabled' : '') + '>' + (t.price ? t.price + ' DD' : 'Free') + '</button>') + '</div>';
  el.innerHTML = (sold.length ? '<p class="ownline" style="color:var(--good)">💰 ' + esc(sold.join('. ')) + '.</p>' : '') +
    '<div class="wallet"><span>DigiData <b>' + G.data.toLocaleString() + '</b></span><span>Box <b>' + G.box.length + ' / ' + G.boxCap + '</b></span></div>' +
    '<button class="act wide" id="tPostBtn">📤 Post a Digimon from your Box</button><div id="tPost" hidden></div>' +
    '<div class="lbs">' + (list.length ? list.map(card).join('') : '<p class="ownline">No trades posted yet.</p>') + '</div>' +
    '<p class="ownline">Posting a Digimon takes it out of your Box until someone takes it or you cancel. When someone takes it, you get the price the next time you open this board.</p>';
  $('#tPostBtn').onclick = () => tradePostForm($('#tPost'));
  el.querySelectorAll('[data-ttake]').forEach(b => b.onclick = async () => {
    const t = list.find(x => x.id === b.dataset.ttake); if (!t) return;
    if (G.box.length >= G.boxCap){ onlSay('Your Box is full. Make room first.'); return; }
    if (G.data < (t.price || 0)){ onlSay('Not enough DigiData.'); return; }
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Tap to confirm'; return; }
    b.disabled = true;
    try{
      await F.runTransaction(N.db, async tx => {
        const s = await tx.get(t.ref); if (!s.exists() || s.data().status !== 'open') throw { code: 'gone' };
        tx.update(t.ref, { status: 'taken', taker: N.uid, takerName: O.name, paid: t.price || 0 });
      });
      const m = Object.assign({}, t.mon); delete m.exp; delete m.fav; m.last = Date.now();
      G.data -= t.price || 0; G.box.push(m); if (!raised(m.id)) G.col[m.id] = 'raised'; saveGame(); updateCount();
      onlineView('🔁 ' + t.monName + ' joined your Box!');
    }catch(e){ onlSay(e && e.code === 'gone' ? 'Someone else got there first.' : netErr(e)); viewTrades(el).catch(() => {}); }
  });
  el.querySelectorAll('[data-tcancel]').forEach(b => b.onclick = async () => {
    const t = list.find(x => x.id === b.dataset.tcancel); if (!t) return;
    if (G.box.length >= G.boxCap){ onlSay('Your Box is full, so there\'s nowhere to put it back.'); return; }
    b.disabled = true;
    try{
      const back = await F.runTransaction(N.db, async tx => { const s = await tx.get(t.ref); if (!s.exists() || s.data().status !== 'open') return false; tx.delete(t.ref); return true; });
      if (back){ const m = Object.assign({}, t.mon); m.last = Date.now(); G.box.push(m); saveGame(); onlineView(t.monName + ' is back in your Box.'); }
      else onlineView('Too late, someone already took it!');
    }catch(e){ onlSay(netErr(e)); b.disabled = false; }
  });
}
function tradePostForm(box){
  if (!box.hidden){ box.hidden = true; return; }
  const ok = G.box.map((m, i) => [m, i]).filter(([m]) => !m.exp && !m.fav);
  box.hidden = false;
  box.innerHTML = ok.length ? '<p class="ownline">Pick a Digimon (favorites and ones on expeditions can\'t be traded):</p><div class="tpick">' + ok.map(([m, i]) => '<button class="bcell" data-tpick="' + i + '"><img alt="" src="' + esc(m.image) + '"><b>' + esc(m.name) + '</b><small>Lv ' + (m.level || 1) + '</small></button>').join('') + '</div>' +
      '<div class="bkrow"><input id="tPrice" class="onlin" type="number" min="0" max="9999" inputmode="numeric" placeholder="Price in DigiData (0 = free)"><input id="tNote" class="onlin" maxlength="40" placeholder="Note (optional)"></div><button class="big" id="tSend" disabled>Post trade</button>'
    : '<p class="ownline">You have nothing to trade. Put a Digimon in your Box first.</p>';
  let sel = null;
  box.querySelectorAll('[data-tpick]').forEach(b => b.onclick = () => { sel = +b.dataset.tpick; box.querySelectorAll('[data-tpick]').forEach(x => x.classList.toggle('on', x === b)); $('#tSend').disabled = false; });
  const send = $('#tSend'); if (send) send.onclick = async () => {
    const m = G.box[sel]; if (!m) return;
    const price = Math.max(0, Math.min(9999, Math.round(+$('#tPrice').value || 0))), note = String($('#tNote').value || '').replace(/[<>]/g, '').trim().slice(0, 40);
    send.disabled = true;
    try{
      const N = await net(), F = N.F, mon = jclean(m); delete mon.exp; delete mon.fav; delete mon.msg;
      G.box.splice(sel, 1); saveGame();
      await F.addDoc(F.collection(N.db, 'trades'), { from: N.uid, fromName: onl().name, mon, monName: m.name, monImage: m.image, monStage: m.stage, monLevel: m.level || 1, price, note, status: 'open', t: F.serverTimestamp() });
      onlineView('📤 ' + m.name + ' is on the trade board.');
    }catch(e){ if (!G.box.includes(m)){ G.box.splice(sel, 0, m); saveGame(); } onlSay(netErr(e)); send.disabled = false; }
  };
}

// ----- friends: add by code, battle their real team -----
async function viewFriends(el){
  const N = await net(), F = N.F, O = onl(); O.friends = O.friends || [];
  const docs = await Promise.all(O.friends.map(f => F.getDoc(F.doc(N.db, 'users', f.uid)).then(s => s.exists() ? Object.assign({ uid: f.uid }, s.data()) : null).catch(() => null)));
  const today = dayKey(); O.fb = O.fb || {};
  el.innerHTML = '<div class="wallet"><span>Your friend code <b>' + myCode(N.uid) + '</b></span><button class="favbtn" id="fCopy">Copy</button></div>' +
    '<div class="bkrow"><input id="fCode" class="onlin" maxlength="8" autocomplete="off" placeholder="Friend\'s code" style="text-transform:uppercase"><button class="act" id="fAdd">Add friend</button></div>' +
    '<div class="lbs">' + (docs.filter(Boolean).length ? docs.map((f, i) => !f ? '' : '<div class="tcard">' + (f.partner && f.partner.image ? '<img alt="" src="' + esc(f.partner.image) + '">' : '<span></span>') +
      '<div><b>' + esc(f.name) + '</b><small>' + (f.title ? '★ ' + esc(f.title) + ' · ' : '') + 'Tamer Lv ' + (f.tamerLv || 1) + ' · ' + (f.found || 0) + ' found</small>' +
      '<small>' + (f.team || []).map(m => esc(m.name) + ' Lv ' + m.level).join(', ') + '</small></div>' +
      '<div class="fbtns">' + (f.team || []).map((m, j) => '<button class="act" data-fbat="' + i + ':' + j + '">⚔️ ' + esc(m.name) + '</button>').join('') + '<button class="ghost" data-fdel="' + i + '">Remove</button></div></div>').join('')
      : '<p class="ownline">No friends yet. Swap friend codes and add each other!</p>') + '</div>' +
    '<p class="ownline">Battles use your friend\'s real team (stats and moves from the last time they were online). The first win against each friend every day gives +60 DigiData.</p>';
  $('#fCopy').onclick = async () => { try{ await navigator.clipboard.writeText(myCode(N.uid)); onlSay('Friend code copied.'); }catch{ onlSay('Your code: ' + myCode(N.uid)); } };
  $('#fAdd').onclick = async () => {
    const code = String($('#fCode').value || '').trim().toUpperCase(); if (code.length < 8){ onlSay('Friend codes are 8 characters.'); return; }
    if (code === myCode(N.uid)){ onlSay('That\'s your own code!'); return; }
    try{
      const q = await F.getDocs(F.query(F.collection(N.db, 'users'), F.where('code', '==', code), F.limit(1)));
      if (!q.docs.length){ onlSay('No Tamer found with that code.'); return; }
      const d = q.docs[0]; if (O.friends.some(f => f.uid === d.id)){ onlSay('Already friends!'); return; }
      O.friends.push({ uid: d.id, name: d.data().name }); saveGame(); onlineView('Added ' + d.data().name + ' as a friend!');
    }catch(e){ onlSay(netErr(e)); }
  };
  el.querySelectorAll('[data-fdel]').forEach(b => b.onclick = () => {
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Tap to remove'; return; }
    O.friends.splice(+b.dataset.fdel, 1); saveGame(); onlineView();
  });
  el.querySelectorAll('[data-fbat]').forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.fbat.split(':').map(Number), f = docs[i], foe = f && f.team && f.team[j], p = P();
    if (!foe || !p || busy) return;
    if (asleep(p) || careInit(p).sick || p.energy < 25){ onlSay(p.name + (asleep(p) ? ' is asleep.' : careInit(p).sick ? ' is sick.' : ' is too tired (25 energy).')); return; }
    p.energy = clamp(p.energy - 25); saveGame();
    battle(DIFFS[1], { foe, title: '🤝 vs ' + f.name + '\'s ' + foe.name, onDone: (outcome) => {
      let line = outcome === 'win' ? p.name + ' beat ' + f.name + '\'s ' + foe.name + '!' : outcome === 'lose' ? f.name + '\'s ' + foe.name + ' won this time.' : 'You ran away.';
      if (outcome === 'win' && O.fb[f.uid] !== today){ O.fb[f.uid] = today; G.data += 60; addBond(p, 2); line += ' +60 DigiData (first win today).'; }
      saveGame(); updateCount();
      $('#overlay .sheet').innerHTML = '<h4>🤝 Friend battle</h4><p style="margin:0">' + esc(line) + '</p><button class="big" id="fbBack">Back</button>';
      $('#fbBack').onclick = () => { closeOv(); state.onlSub = 'friends'; setTab('world'); renderWorld('online'); };
    } });
  });
}

setRetro(false);
// light / dark mode: follows the phone until you pick one, then remembers it
function isDark(){ return document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function paintThemeBtn(){ $('#themeBtn').textContent = isDark() ? '☀️ Light' : '🌙 Dark'; $('#themeBtn').setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode'); }
$('#themeBtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('dx_theme', next); }catch{}
  paintThemeBtn(); setRetro(false);   // re-process art: cut out white backgrounds in dark mode
  if (typeof dg !== 'undefined' && dg && !dg.over) dgDraw();
};
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintThemeBtn(); setRetro(false); }); }catch{}
paintThemeBtn();
$('#trainerBtn').onclick = () => { if (!busy) trainerScreen(); };
paintTitle();
setInterval(updateTrainerBadge, 60000);
evCheck(); updateWorldBadge();
setInterval(() => { const before = G.ev && G.ev.key; evCheck(); updateWorldBadge(); if (busy || document.hidden) return; if (state.tab === 'world' && state.worldSub !== 'online') renderWorld(); else if ((G.ev && G.ev.key) !== before && state.tab === 'partner') renderPartner(); }, 30000);
questInit(); updateQuestBadge();
setTab(location.hash && +location.hash.slice(1) ? 'index' : state.tab);
loadAll();
