// ----- de-digivolve: step back one form to try a different branch -----
function dedigivolve(){
  const p = P(); if (busy || p.line.length < 2) return;
  const stages = p.stageLine || p.line.map((_, i) => i);
  p.line.pop(); stages.pop();
  const id = p.line[p.line.length - 1]; const b = state.byId.get(id);
  const from = p.name;
  p.id = id; p.name = b.name; p.image = b.image;
  p.stage = stages[stages.length - 1] ?? Math.max(0, p.stage - 1);
  p.stageLine = stages; p.evo = 0; p.stageMistakes = 0; p.stageWins = 0; p.stageLosses = 0; p.final = false;
  say(`${from} de-digivolved back into ${b.name}. Raise it again to try a different path!`, 'happy');
}

// ----- overlay helpers -----
function openOv(html){ const o = $('#overlay'); o.innerHTML = `<div class="sheet">${html}</div>`; o.hidden = false; return o; }
function closeOv(){ $('#overlay').hidden = true; $('#overlay').innerHTML = ''; busy = false; }

// ----- stats: HP, SP, ATK, INT, SPD -----
// Each Digimon gets base stats from its stage plus a fixed per-species lean (some hit hard, some are casters, some are fast).
const STAT_BASE = { hp: [36, 60, 96, 150, 225, 315], sp: [10, 14, 20, 28, 38, 50], atk: [4, 7, 12, 19, 28, 40], int: [4, 7, 12, 19, 28, 40], def: [4, 7, 12, 19, 28, 40], spd: [4, 6, 10, 15, 21, 28] };
const STAT_KEYS = ['hp', 'sp', 'atk', 'int', 'def', 'spd'];
const STAT_LABEL = { hp: 'HP', sp: 'SP', atk: 'ATK', int: 'INT', def: 'DEF', spd: 'SPD' };
function seeded(id, salt){ let h = (Math.imul(id, 2654435761) ^ Math.imul(salt, 40503)) >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13; return (h % 1000) / 1000; }
function baseStats(id, stage){
  const s = Math.max(0, Math.min(5, stage | 0)), lean = seeded(id, 9);
  const f = (k, i) => 0.82 + seeded(id, i) * 0.4;
  const atkLean = 0.8 + lean * 0.4, intLean = 1.2 - lean * 0.4;
  return { hp: Math.round(STAT_BASE.hp[s] * f('hp', 1)), sp: Math.round(STAT_BASE.sp[s] * f('sp', 2) * (0.9 + (1 - lean) * 0.25)),
    atk: Math.round(STAT_BASE.atk[s] * f('atk', 3) * atkLean), int: Math.round(STAT_BASE.int[s] * f('int', 4) * intLean), spd: Math.round(STAT_BASE.spd[s] * f('spd', 5)),
    def: Math.round(STAT_BASE.def[s] * (0.82 + Math.abs(seeded(id, 6)) * 0.4)) };
}
function growthOf(p){
  if (!p.growth) p.growth = { hp: 0, sp: 0, atk: Math.max(0, Math.round(((p.str || 2) - 2) / 2)), int: 0, spd: 0 };
  return p.growth;
}
function partnerStats(p){ const b = baseStats(p.id, p.stage), g = growthOf(p); const o = {}; STAT_KEYS.forEach(k => o[k] = b[k] + (g[k] || 0)); return o; }
function statChips(st){ return STAT_KEYS.map(k => `<span>${STAT_LABEL[k]} <b>${st[k]}</b></span>`).join(''); }

// ----- training: pick a stat, then tap when the marker is in the green zone -----
const TRAININGS = [
  { key: 'atk', icon: '💪', name: 'Power', desc: 'Raises ATK' },
  { key: 'int', icon: '🔮', name: 'Mind', desc: 'Raises INT' },
  { key: 'spd', icon: '💨', name: 'Agility', desc: 'Raises SPD' },
  { key: 'def', icon: '🛡️', name: 'Guard', desc: 'Raises DEF' },
  { key: 'hp', icon: '❤️', name: 'Stamina', desc: 'Raises HP' },
  { key: 'sp', icon: '🔋', name: 'Focus', desc: 'Raises SP' },
];
function train(){
  const p = P(); busy = true;
  openOv(`<h4>Training · ${esc(p.name)}</h4>
    <p style="margin:0;color:var(--muted)">What should ${esc(p.name)} work on?</p>
    <div class="actions">${TRAININGS.map(t => `<button class="act" data-train="${t.key}">${t.icon} ${t.name}<small>${t.desc}</small></button>`).join('')}</div>
    <button class="ghost" id="trCancel">Cancel</button>`);
  $('#trCancel').onclick = closeOv;
  $('#overlay').querySelectorAll('[data-train]').forEach(b => b.onclick = () => trainGame(b.dataset.train));
}
function trainGame(kind){
  const p = P(); const t = TRAININGS.find(x => x.key === kind);
  const zoneW = [28, 26, 23, 20, 17, 15][p.stage];
  let round = 0, hits = 0, pos = 0, dir = 1, raf = 0, zoneL = 0, waiting = false;
  const results = [];
  const speed = () => 0.9 + round * 0.35 + p.stage * 0.12;
  $('#overlay .sheet').innerHTML = `<h4>${t.icon} ${t.name} training</h4>
    <p style="margin:0;color:var(--muted)">Tap <b>Hit!</b> when the marker is inside the green zone.</p>
    <div class="tmeter"><span class="zone" id="zone"></span><span class="mark" id="mark"></span></div>
    <div class="dots" id="dots">○ ○ ○</div>
    <button class="big" id="hit">Hit!</button>`;
  const placeZone = () => { zoneL = rand(5, 95 - zoneW); const z = $('#zone'); z.style.left = zoneL + '%'; z.style.width = zoneW + '%'; };
  const dots = () => { $('#dots').textContent = [0,1,2].map(i => i < round ? (results[i] ? '●' : '✕') : '○').join(' '); };
  const loop = () => { pos += dir * speed(); if (pos >= 100){ pos = 100; dir = -1; } if (pos <= 0){ pos = 0; dir = 1; } $('#mark').style.left = pos + '%'; raf = requestAnimationFrame(loop); };
  placeZone(); raf = requestAnimationFrame(loop);
  $('#hit').onclick = async () => {
    if (waiting) return;
    const ok = pos >= zoneL && pos <= zoneL + zoneW;
    results.push(ok); if (ok) hits++; round++; dots();
    if (round < 3){ waiting = true; cancelAnimationFrame(raf); await sleep(350); placeZone(); waiting = false; raf = requestAnimationFrame(loop); return; }
    cancelAnimationFrame(raf);
    const g = growthOf(p), per = 1 + Math.floor(p.stage / 2), bonus = hits && p.mood > 60 ? 1 : 0;
    let gained;
    if (kind === 'hp'){ const h = hits * per * 4 + bonus * 2; g.hp = (g.hp || 0) + h; gained = '+' + h + ' HP'; }
    else if (kind === 'sp'){ const s = hits * per * 2 + bonus; g.sp = (g.sp || 0) + s; gained = '+' + s + ' SP'; }
    else { const v = hits * per + bonus; g[kind] = (g[kind] || 0) + v; gained = '+' + v + ' ' + STAT_LABEL[kind]; }
    p.evo += hits; p.energy = clamp(p.energy - 20); p.hunger = clamp(p.hunger - 10);
    questProgress('train'); if (hits === 3) questProgress('perfect');
    if (!hits) p.mood = clamp(p.mood - 6);
    saveGame();
    $('#hit').textContent = 'Done';
    const lvr = await gainXP(p, hits * 3 + 1);
    $('#hit').onclick = () => { closeOv(); say((hits === 3 ? `Perfect training! ${p.name} gained ${gained}.` : hits ? `Good effort! ${p.name} gained ${gained}.` : `${p.name} missed every hit and looks discouraged.`) + levelText(lvr), hits ? 'happy' : null); };
  };
}

// ----- battle: turn-based, order by SPD, attribute triangle Vaccine > Virus > Data > Vaccine -----
const BEATS = { Vaccine: 'Virus', Virus: 'Data', Data: 'Vaccine' };
function attrMult(a, d){ if (BEATS[a] === d) return 1.5; if (BEATS[d] === a) return 0.75; return 1; }
function mainAttr(d){ const a = (d?.attributes || []).map(x => x.attribute).find(x => BEATS[x]); return a || (d?.attributes?.[0]?.attribute) || 'Free'; }
function movesFor(d, stage){
  const sk = (d?.skills || []).map(s => (s.translation && s.translation.trim()) || s.skill).filter(Boolean);
  const a = sk[0] || 'Data Burst', b = sk.length > 1 ? sk[sk.length - 1] : (sk[0] ? sk[0] + ' Max' : 'Digital Storm');
  return [
    { kind: 'atk', name: 'Attack', cost: 0 },
    { kind: 'skill', name: a, cost: 4 + stage * 2, power: 1.55 },
    { kind: 'skill', name: b, cost: 8 + stage * 3, power: 2.3 },
    { kind: 'guard', name: 'Guard', cost: 0 },
  ];
}
// ----- moves: each species gets its own moves from its real skills; partners learn them as they level -----
const STAGE_MIN_LV = [1, 6, 12, 20, 30, 42];
const XP_NEED = lv => 12 + lv * 6;
const BASIC = { name: 'Tackle', kind: 'phys', power: 1, desc: 'A basic body attack. Costs no SP.' };
const GUARD = { name: 'Guard', kind: 'guard', power: 0, cost: 0 };
const KIND_LABEL = { phys: 'PHY', mag: 'MAG', heal: 'HEAL', buff: 'BUFF', drain: 'DRAIN', guard: 'GRD' };
const GENERIC = [
  { name: 'Data Shot', kind: 'mag', power: 1.3, desc: 'Fires a compact burst of data.' },
  { name: 'Quick Strike', kind: 'phys', power: 1.3, desc: 'A fast physical hit.' },
  { name: 'Patch Up', kind: 'heal', power: 0.35, desc: 'Repairs damaged data, restoring HP.' },
  { name: 'Power Charge', kind: 'buff', power: 1.25, desc: 'Boosts all damage for the rest of the battle.' },
  { name: 'Byte Drain', kind: 'drain', power: 1.2, desc: 'Steals data from the foe to restore HP.' },
  { name: 'Heavy Slam', kind: 'phys', power: 1.9, desc: 'A crushing full-body slam.' },
  { name: 'Pulse Wave', kind: 'mag', power: 1.9, desc: 'A wave of digital energy.' },
];
function moveKind(name, desc){
  const t = (name + ' ' + (desc || '')).toLowerCase();
  if (/(heals|healing|heal |recover|restores|cures|revive)/.test(t)) return 'heal';
  if (/(drain|absorb|steals|leech)/.test(t)) return 'drain';
  if (/(powers? up|boosts|strengthen|increases|raises|barrier|shield)/.test(t)) return 'buff';
  if (/(punch|kick|claw|bite|tackle|slash|strike|horn|charge|fist|blade|sword|tail|ram|crush|smash|fang|head|lance|spear|axe|knuckle|chop|slam|stomp|body|cut|scratch|spin|drill|hammer|whip|jab|uppercut|talon)/.test(t)) return 'phys';
  return 'mag';
}
const learnCache = new Map();
function learnset(id, d, stage){
  const key = id + '|' + stage + '|' + (d ? 1 : 0);
  if (learnCache.has(key)) return learnCache.get(key);
  const base = STAGE_MIN_LV[stage] || 1, offs = [0, 2, 4, 7, 10, 14];
  const list = (d?.skills || []).filter(s => s.skill).slice(0, 6).map((s, i) => {
    const name = (s.translation && s.translation.trim()) || s.skill;
    const kind = moveKind(name, s.description);
    const power = kind === 'heal' ? 0.3 + i * 0.03 : kind === 'buff' ? 1.25 : Math.min(2.8, 1.35 + i * 0.3 + stage * 0.05);
    return { name, kind, power: Math.round(power * 100) / 100, learn: base + offs[i], desc: s.description || '' };
  });
  // species with few listed skills get a couple of generic moves picked for them
  for (let i = 0; list.length < 3 && i < 4; i++){
    const g = GENERIC[Math.floor(Math.abs(seeded(id, 20 + i + stage)) * GENERIC.length) % GENERIC.length];
    if (!list.some(m => m.name === g.name)) list.push(Object.assign({}, g, { learn: base + 3 + i * 4 }));
  }
  list.sort((a, b) => a.learn - b.learn);
  if (d) learnCache.set(key, list);
  return list;
}
function moveCost(m, stage){
  if (m.kind === 'guard' || (m.kind === 'phys' && m.power <= 1)) return 0;
  const f = m.kind === 'heal' ? 2.2 : m.kind === 'buff' ? 1.6 : m.power;
  return Math.max(2, Math.round(f * (3 + stage * 1.6)));
}
function toBattle(m, stage){ return { name: m.name, kind: m.kind, power: m.power, cost: moveCost(m, stage), desc: m.desc }; }
function moveLabel(m){
  const c = m.cost ? m.cost + ' SP · ' : 'free · ';
  if (m.kind === 'phys') return c + 'ATK ×' + m.power;
  if (m.kind === 'mag') return c + 'INT ×' + m.power;
  if (m.kind === 'drain') return c + 'INT ×' + m.power + ', heals';
  if (m.kind === 'heal') return c + 'heals ' + Math.round(m.power * 100) + '% HP';
  if (m.kind === 'buff') return c + '+' + Math.round((m.power - 1) * 100) + '% damage';
  return 'halve damage, +SP';
}
function initMoves(p){
  if (!p.level){ p.level = STAGE_MIN_LV[p.stage] || 1; p.xp = 0; }
  if (!Array.isArray(p.moves)){ p.moves = [Object.assign({}, BASIC)]; p.equip = [BASIC.name]; }
  if (!Array.isArray(p.equip)) p.equip = [BASIC.name];
}
function partnerMoves(p){
  initMoves(p);
  const eq = p.equip.map(n => p.moves.find(m => m.name === n)).filter(Boolean);
  if (!eq.length) eq.push(BASIC);
  // the free move always comes first so walking into enemies uses it
  eq.sort((a, b) => moveCost(a, p.stage) - moveCost(b, p.stage));
  return eq.map(m => toBattle(m, p.stage)).concat([GUARD]);
}
async function syncMoves(p){
  initMoves(p);
  let d = null; try{ d = await getDetail(p.id); }catch{ return []; }
  const learned = [];
  for (const m of learnset(p.id, d, p.stage)){
    if (m.learn > p.level || p.moves.some(k => k.name === m.name)) continue;
    p.moves.push({ name: m.name, kind: m.kind, power: m.power, desc: m.desc });
    if (p.equip.length < 4) p.equip.push(m.name);
    learned.push(m.name);
  }
  if (learned.length) saveGame();
  return learned;
}
async function gainXP(p, amount){
  initMoves(p);
  p.xp += Math.max(0, Math.round(amount)); const ups = [];
  while (p.xp >= XP_NEED(p.level) && p.level < 99){
    p.xp -= XP_NEED(p.level); p.level++;
    const g = growthOf(p), gk = pick(['atk', 'int', 'def', 'spd']); g[gk] = (g[gk] || 0) + 1; g.hp += 2;
    ups.push(p.level);
  }
  saveGame();
  const learned = ups.length ? await syncMoves(p) : [];
  return { ups, learned };
}
function levelText(r){
  if (!r || !r.ups.length) return '';
  return ' Level up! Now Lv ' + r.ups[r.ups.length - 1] + '.' + (r.learned.length ? ' Learned ' + r.learned.join(', ') + '!' : '');
}
function foeMoves(id, d, stage, lvBonus){
  const lv = (STAGE_MIN_LV[stage] || 1) + Math.floor(Math.random() * 8) + (lvBonus || 0);
  const known = learnset(id, d, stage).filter(m => m.learn <= lv).sort((a, b) => b.power - a.power).slice(0, 3);
  return [toBattle(BASIC, stage)].concat(known.map(m => toBattle(m, stage))).concat([GUARD]);
}
async function movesScreen(){
  const p = P(); busy = true; initMoves(p);
  openOv('<h4>Moves · ' + esc(p.name) + '</h4><div class="status">Loading moves…</div>');
  await syncMoves(p);
  let d = null; try{ d = await getDetail(p.id); }catch{}
  const draw = () => {
    const eq = new Set(p.equip);
    const row = m => { const b = toBattle(m, p.stage), on = eq.has(m.name);
      return '<button class="mvrow' + (on ? ' on' : '') + '" data-eq="' + esc(m.name) + '"><span class="mvk ' + m.kind + '">' + KIND_LABEL[m.kind] + '</span><span class="mvt"><b>' + esc(m.name) + '</b><small>' + esc(moveLabel(b)) + (m.desc ? ' · ' + esc(m.desc) : '') + '</small></span><span class="mvc">' + (on ? '✓' : '') + '</span></button>'; };
    const next = d ? learnset(p.id, d, p.stage).filter(m => m.learn > p.level && !p.moves.some(k => k.name === m.name)) : [];
    $('#overlay .sheet').innerHTML = '<h4>Moves · ' + esc(p.name) + ' <span class="stage">Lv ' + p.level + '</span></h4>' +
      '<p style="margin:0;color:var(--muted);font-size:.85rem">Tap a move to equip or unequip it. Up to 4 equipped moves are used in battles and dungeons, and Guard is always available. Moves stay learned when your Digimon digivolves.</p>' +
      '<div class="mvlist">' + p.moves.map(row).join('') + '</div>' +
      (next.length ? '<h3 style="margin:6px 0 0">Coming up</h3><div class="mvlist">' + next.map(m => '<div class="mvrow locked"><span class="mvk ' + m.kind + '">' + KIND_LABEL[m.kind] + '</span><span class="mvt"><b>' + esc(m.name) + '</b><small>Learns at Lv ' + m.learn + '</small></span><span></span></div>').join('') + '</div>' : '') +
      '<p id="mvMsg" style="margin:0;min-height:1.2em;font-size:.85rem;color:var(--bad)"></p><button class="big" id="mvDone">Done</button>';
    $('#overlay').querySelectorAll('[data-eq]').forEach(b => b.onclick = () => {
      const n = b.dataset.eq;
      if (p.equip.includes(n)){ if (p.equip.length === 1){ $('#mvMsg').textContent = 'Keep at least one move equipped.'; return; } p.equip = p.equip.filter(x => x !== n); }
      else { if (p.equip.length >= 4){ $('#mvMsg').textContent = 'You can equip 4 moves. Unequip one first.'; return; } p.equip.push(n); }
      saveGame(); draw();
    });
    $('#mvDone').onclick = () => { closeOv(); renderPartner(); };
  };
  draw();
}

function fighter(name, image, st, attr, moves, mood){
  const m = mood === undefined ? 1 : (mood >= 70 ? 1.05 : mood < 25 ? 0.92 : 1);
  const s = {}; STAT_KEYS.forEach(k => s[k] = Math.max(1, Math.round(st[k] * (k === 'hp' || k === 'sp' ? 1 : m))));
  return { name, image, st: s, hp: s.hp, sp: s.sp, attr, moves, guard: false };
}
function doMove(att, def, mv){
  if (mv.kind === 'heal'){ att.sp -= mv.cost || 0; const h = Math.max(1, Math.round(att.st.hp * mv.power)); att.hp = Math.min(att.st.hp, att.hp + h); return { text: att.name + ' used ' + mv.name + ' and restored ' + h + ' HP.' }; }
  if (mv.kind === 'buff'){ att.sp -= mv.cost || 0; att.buff = Math.min(1.9, (att.buff || 1) * mv.power); return { text: att.name + ' used ' + mv.name + '! Its attacks grew stronger.' }; }
  if (mv.kind === 'guard'){ att.guard = true; const g = Math.max(2, Math.ceil(att.st.sp * 0.2)); att.sp = Math.min(att.st.sp, att.sp + g); return { text: `${att.name} guards and recovers ${g} SP.` }; }
  att.sp -= mv.cost || 0;
  const evade = Math.max(0.03, Math.min(0.3, 0.05 + (def.st.spd - att.st.spd) * 0.012));
  if (Math.random() < evade) return { text: `${att.name} used ${mv.name}… but ${def.name} dodged!`, miss: true };
  const crit = Math.random() < Math.max(0.04, Math.min(0.25, 0.06 + (att.st.spd - def.st.spd) * 0.01));
  const am = attrMult(att.attr, def.attr);
  const base = (mv.kind === 'phys' || mv.kind === 'atk' ? att.st.atk : att.st.int) * (mv.power || 1) * (att.buff || 1);
  // DEF softens both physical (ATK) and SP-powered attacks; equal attack and defense keeps damage about where it was
  const aStat = mv.kind === 'phys' || mv.kind === 'atk' ? att.st.atk : att.st.int, dStat = def.st.def || 0;
  const defFactor = 1.35 * (2 * aStat) / (2 * aStat + dStat);
  const dmg = Math.max(1, Math.round(base * defFactor * rand(0.85, 1.15) * am * (crit ? 1.6 : 1) * (def.guard ? 0.5 : 1)));
  def.hp = Math.max(0, def.hp - dmg);
  let text = `${att.name} used ${mv.name}! ${dmg} damage.`;
  if (mv.kind === 'drain'){ const h = Math.max(1, Math.round(dmg / 2)); att.hp = Math.min(att.st.hp, att.hp + h); text += ' Drained ' + h + ' HP.'; }
  if (crit) text += ' Critical hit!';
  if (am > 1) text += ' Super effective!'; else if (am < 1) text += ' Not very effective…';
  if (def.guard) text += ' (guarded)';
  return { text, dmg };
}
function foeChoice(f, me){
  const usable = f.moves.filter(m => m.kind !== 'guard' && (m.cost || 0) <= f.sp);
  const guard = f.moves.find(m => m.kind === 'guard') || GUARD;
  const heal = usable.find(m => m.kind === 'heal');
  if (heal && f.hp < f.st.hp * 0.35 && Math.random() < 0.6) return heal;
  const buff = usable.find(m => m.kind === 'buff');
  if (buff && (f.buff || 1) < 1.3 && f.hp > f.st.hp * 0.6 && Math.random() < 0.3) return buff;
  const dmg = usable.filter(m => m.kind === 'phys' || m.kind === 'mag' || m.kind === 'drain');
  if (!dmg.length || (f.hp < f.st.hp * 0.3 && Math.random() < 0.15)) return guard;
  const score = m => (m.kind === 'phys' ? f.st.atk : f.st.int) * m.power * (0.7 + Math.random() * 0.6);
  return dmg.sort((a, b) => score(b) - score(a))[0];
}

// ----- difficulty: tougher foes, bigger rewards -----
const DIFFS = [
  { key: 'easy', name: 'Easy', foe: 0.85, reward: 0.7, floors: 3, lv: 0, egg: 0.1, battleEgg: 0, desc: 'Weaker foes' },
  { key: 'normal', name: 'Normal', foe: 1, reward: 1, floors: 5, lv: 0, egg: 0.25, battleEgg: 0, desc: 'A fair fight' },
  { key: 'hard', name: 'Hard', foe: 1.22, reward: 1.8, floors: 6, lv: 4, egg: 0.45, battleEgg: 0.05, desc: 'Tougher foes that know more moves' },
  { key: 'nightmare', name: 'Nightmare', foe: 1.45, reward: 2.8, floors: 8, lv: 8, egg: 0.7, battleEgg: 0.1, rare: true, desc: 'Brutal foes, with a shot at Rare eggs' },
];
function pickDifficulty(kind){
  const p = P(); busy = true;
  const last = store.get('dx_diff_' + kind, 'normal');
  const card = d => {
    const rw = kind === 'battle'
      ? 'Win: +' + Math.max(1, Math.round(3 * d.reward)) + ' evo · +' + Math.round((4 + 3 * p.stage) * d.reward) + ' DigiData · +' + Math.round((10 + p.stage * 6) * d.reward) + ' XP' + (d.battleEgg ? ' · ' + Math.round(d.battleEgg * 100) + '% egg' : '')
      : d.floors + ' floors · clear bonus ~' + Math.round((30 * (p.stage + 1) + 10 * d.floors) * d.reward) + ' DigiData · ' + Math.round(d.egg * 100) + '% egg' + (d.rare ? ' (can be Rare)' : '');
    return '<button class="diff ' + d.key + (d.key === last ? ' on' : '') + '" data-diff="' + d.key + '"><span class="dn">' + d.name + '<small>×' + d.reward + ' rewards</small></span><span class="dd">' + d.desc + ' · foe stats ×' + d.foe + '</span><span class="dr">' + rw + '</span></button>';
  };
  openOv('<h4>' + (kind === 'battle' ? 'Battle difficulty' : 'Dungeon difficulty') + '</h4><div class="diffs">' + DIFFS.map(card).join('') + '</div><button class="ghost" id="diffCancel">Cancel</button>');
  $('#diffCancel').onclick = closeOv;
  $('#overlay').querySelectorAll('[data-diff]').forEach(b => b.onclick = () => {
    const d = DIFFS.find(x => x.key === b.dataset.diff);
    store.set('dx_diff_' + kind, d.key);
    if (kind === 'battle') battle(d); else dungeon(d);
  });
}

async function battle(diff){
  diff = diff || DIFFS[1];
  const p = P(); busy = true;
  openOv(`<h4>Searching for a wild Digimon…</h4><div class="status">Loading battle data…</div>`);
  const pool = (state.stageIds[p.stage] || []).filter(id => id !== p.id && state.byId.has(id));
  const foeBase = state.byId.get(pick(pool));
  let myD = null, foeD = null;
  try{ [myD, foeD] = await Promise.all([getDetail(p.id), getDetail(foeBase.id)]); }catch{}
  await syncMoves(p);
  const mine = partnerStats(p), myBase = baseStats(p.id, p.stage), fb = baseStats(foeBase.id, p.stage);
  const foeSt = {}; STAT_KEYS.forEach(k => foeSt[k] = Math.max(1, Math.round((fb[k] * rand(0.92, 1.1) + 0.55 * (mine[k] - myBase[k])) * diff.foe)));
  const me = fighter(p.name, p.image, mine, mainAttr(myD), partnerMoves(p), p.mood);
  const foe = fighter(foeBase.name, foeBase.image, foeSt, mainAttr(foeD), foeMoves(foeBase.id, foeD, p.stage, diff.lv));
  G.col[foeBase.id] = G.col[foeBase.id] || 'seen';
  saveGame();

  const side = (f, id) => `<div class="fighter" id="${id}"><img alt="" src="${esc(f.image)}"><b>${esc(f.name)}</b>
      <span class="attr">${esc(f.attr)}</span>
      <div class="bars"><div class="hp"><i></i></div><small class="hpt"></small><div class="hp spb"><i></i></div><small class="spt"></small></div></div>`;
  $('#overlay .sheet').innerHTML = `<h4>Wild battle! <span class="stage">${diff.name}</span></h4>
    <div class="arena">${side(me, 'fMe')}<div class="vs">VS</div>${side(foe, 'fFoe')}</div>
    <div class="row statrow"><span>You: ${statChips(me.st)}</span></div>
    <div class="blog" id="blog" aria-live="polite">A wild ${esc(foe.name)} appeared! ${me.st.spd >= foe.st.spd ? `${esc(me.name)} is faster.` : `${esc(foe.name)} is faster.`}</div>
    <div class="bact" id="bact">${me.moves.map((m, i) => `<button class="act" data-mv="${i}">${esc(m.name)}<small>${esc(moveLabel(m))}</small></button>`).join('')}
      <button class="act" data-mv="run">Run<small>Escape (SPD)</small></button></div>`;
  const draw = () => {
    for (const [f, id] of [[me, '#fMe'], [foe, '#fFoe']]){
      const el = $(id); if (!el) continue;
      const hp = f.hp / f.st.hp * 100, sp = f.sp / f.st.sp * 100;
      el.querySelector('.hp:not(.spb) i').style.width = hp + '%'; el.querySelector('.hp:not(.spb) i').style.background = meterColor(hp);
      el.querySelector('.spb i').style.width = sp + '%';
      el.querySelector('.hpt').textContent = `HP ${f.hp}/${f.st.hp}`; el.querySelector('.spt').textContent = `SP ${f.sp}/${f.st.sp}`;
    }
  };
  const log = t => { const b = $('#blog'); if (b) b.textContent = t; };
  const hitFx = id => { const el = $(id); if (!el) return; el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); };
  const setButtons = on => $('#overlay').querySelectorAll('[data-mv]').forEach(b => {
    const m = me.moves[+b.dataset.mv]; b.disabled = !on || (m && m.cost > me.sp);
  });
  const playerMove = () => new Promise(res => { setButtons(true); $('#overlay').querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { setButtons(false); res(b.dataset.mv); }); });
  draw(); setButtons(false);
  await sleep(900);

  let outcome = null;
  for (let turn = 1; turn <= 40 && !outcome; turn++){
    const order = me.st.spd > foe.st.spd || (me.st.spd === foe.st.spd && Math.random() < 0.5) ? [me, foe] : [foe, me];
    for (const actor of order){
      if (outcome) break;
      actor.guard = false;
      if (actor === me){
        log(`Your move. What should ${me.name} do?`);
        const choice = await playerMove();
        if (choice === 'run'){
          if (Math.random() < Math.max(0.2, Math.min(0.95, 0.55 + (me.st.spd - foe.st.spd) * 0.04))){ outcome = 'ran'; log(`${me.name} got away safely.`); break; }
          log(`${me.name} couldn't get away!`); await sleep(800); continue;
        }
        const r = doMove(me, foe, me.moves[+choice]);
        if (r.dmg) hitFx('#fFoe');
        log(r.text);
      } else {
        await sleep(350);
        const r = doMove(foe, me, foeChoice(foe, me));
        if (r.dmg) hitFx('#fMe');
        log(r.text);
      }
      draw();
      await sleep(1000);
      if (foe.hp <= 0) outcome = 'win'; else if (me.hp <= 0) outcome = 'lose';
    }
    // a little SP comes back every round
    if (!outcome) for (const f of [me, foe]) f.sp = Math.min(f.st.sp, f.sp + 1);
  }
  if (!outcome) outcome = me.hp / me.st.hp >= foe.hp / foe.st.hp ? 'win' : 'lose';

  p.energy = clamp(p.energy - 25); p.hunger = clamp(p.hunger - 10);
  let summary;
  if (outcome === 'win'){
    const g = growthOf(p), k = pick(['atk', 'int', 'def', 'spd', 'hp', 'sp']), v = k === 'hp' ? 3 + p.stage : k === 'sp' ? 2 : 1 + Math.floor(p.stage / 2);
    g[k] = (g[k] || 0) + v;
    const ev = Math.max(1, Math.round(3 * diff.reward)), dd = Math.round((4 + 3 * p.stage) * diff.reward);
    questProgress('win'); if (diff.key === 'hard' || diff.key === 'nightmare') questProgress('winHard');
    p.wins++; p.stageWins = (p.stageWins || 0) + 1; p.evo += ev; p.mood = clamp(p.mood + 8); G.data += dd;
    summary = p.name + ' won! +' + ev + ' digivolution points, +' + v + ' ' + STAT_LABEL[k] + ', +' + dd + ' DigiData.';
    if (diff.battleEgg && Math.random() < diff.battleEgg){ G.eggs.push(diff.rare ? 'rare' : 'mystery'); summary += ' It dropped ' + (diff.rare ? 'a Rare Mystery Egg!' : 'a Mystery Egg!'); }
    if (diff.battleEgg && Math.random() < diff.battleEgg * 0.8){ const it = randomDigimental(); giveItem(it); summary += ' Found a ' + itemName(it) + '!'; }
  } else if (outcome === 'lose'){ p.losses++; p.stageLosses = (p.stageLosses || 0) + 1; p.evo += 1; p.mood = clamp(p.mood - 10); summary = `${p.name} was defeated… Train up and try again.`; }
  else summary = `${p.name} escaped from ${foe.name}.`;
  saveGame();
  const xp = Math.round((outcome === 'win' ? 10 + p.stage * 6 : outcome === 'lose' ? 3 + p.stage * 2 : 0) * diff.reward);
  if (xp){ const lv = await gainXP(p, xp); summary += ' +' + xp + ' XP.' + levelText(lv); }
  $('#bact').innerHTML = `<button class="big" id="bDone">Continue</button>`;
  log(summary);
  $('#bDone').onclick = () => { closeOv(); say(outcome === 'win' ? `${p.name} beat ${foe.name}!` : outcome === 'lose' ? `${p.name} lost to ${foe.name}.` : `${p.name} ran from ${foe.name}.`, outcome === 'win' ? 'happy' : null); };
}

// ================= DUNGEON: turn-based, procedurally generated floors =================
const DG = { W: 34, H: 26, FLOORS: 5, VW: 11, VH: 9, SIGHT: 4 };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let dg = null;
const dgImgs = {};

function dgImage(id){
  if (dgImgs[id]) return dgImgs[id];
  const im = new Image(); dgImgs[id] = im;
  const src = state.byId.get(id)?.image;
  if (src) processArt(src, retroOn ? 40 : 96, retroOn).then(u => { if (u) im.src = u; });
  return im;
}

function genFloor(){
  for (let attempt = 0; attempt < 20; attempt++){
    const W = DG.W, H = DG.H, map = new Uint8Array(W * H), rooms = [];
    for (let t = 0; t < 80 && rooms.length < 8; t++){
      const w = 4 + (Math.random() * 5 | 0), h = 3 + (Math.random() * 4 | 0);
      const x = 1 + (Math.random() * (W - w - 2) | 0), y = 1 + (Math.random() * (H - h - 2) | 0);
      if (rooms.some(r => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
      rooms.push({ x, y, w, h });
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j * W + i] = 1;
    }
    if (rooms.length < 4) continue;
    const ctr = r => [r.x + (r.w >> 1), r.y + (r.h >> 1)];
    const carve = (x1, y1, x2, y2) => {
      let x = x1, y = y1;
      const sx = () => { while (x !== x2){ x += Math.sign(x2 - x); map[y * W + x] = 1; } };
      const sy = () => { while (y !== y2){ y += Math.sign(y2 - y); map[y * W + x] = 1; } };
      if (Math.random() < 0.5){ sx(); sy(); } else { sy(); sx(); }
    };
    rooms.sort((a, b) => a.x - b.x);
    for (let i = 1; i < rooms.length; i++){ const a = ctr(rooms[i - 1]), b = ctr(rooms[i]); carve(a[0], a[1], b[0], b[1]); }
    for (let k = 0; k < 2; k++){ const r1 = pick(rooms), r2 = pick(rooms); if (r1 !== r2){ const a = ctr(r1), b = ctr(r2); carve(a[0], a[1], b[0], b[1]); } }
    return { map, rooms };
  }
  return null;
}

const dgFloor = (x, y) => x >= 0 && y >= 0 && x < DG.W && y < DG.H && dg.map[y * DG.W + x] === 1;
const dgRoomAt = (x, y) => dg.rooms.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
function dgUnitAt(x, y){
  if (dg.me.x === x && dg.me.y === y) return dg.me;
  if (dg.ally && dg.ally.hp > 0 && dg.ally.x === x && dg.ally.y === y) return dg.ally;
  return dg.enemies.find(e => e.x === x && e.y === y) || null;
}
function dgFreeSpot(avoidRoom){
  for (let t = 0; t < 400; t++){
    const r = pick(dg.rooms); if (r === avoidRoom && dg.rooms.length > 1) continue;
    const x = r.x + (Math.random() * r.w | 0), y = r.y + (Math.random() * r.h | 0);
    if (!dgUnitAt(x, y) && !dg.items.some(i => i.x === x && i.y === y) && !(dg.stairs && dg.stairs.x === x && dg.stairs.y === y)) return { x, y };
  }
  return null;
}
// one step along the shortest path from (sx,sy) toward (tx,ty), avoiding other units
function dgStep(u, tx, ty, maxR){
  const W = DG.W, start = u.y * W + u.x, goal = ty * W + tx;
  const prev = new Map([[start, -1]]), q = [start];
  for (let qi = 0; qi < q.length && qi < 900; qi++){
    const c = q[qi]; if (c === goal) break;
    const cx = c % W, cy = (c / W) | 0;
    for (const d of Object.values(DIRS)){
      const nx = cx + d[0], ny = cy + d[1], n = ny * W + nx;
      if (prev.has(n) || !dgFloor(nx, ny) || Math.abs(nx - u.x) + Math.abs(ny - u.y) > maxR) continue;
      const occ = dgUnitAt(nx, ny); if (occ && n !== goal) continue;
      prev.set(n, c); q.push(n);
    }
  }
  if (!prev.has(goal)) return null;
  let c = goal; while (prev.get(c) !== start && prev.get(c) !== -1) c = prev.get(c);
  if (prev.get(c) === -1) return null;
  return { x: c % W, y: (c / W) | 0 };
}

function dgUnit(id, name, st, attr, moves, hpScale){
  const hp = Math.max(1, Math.round(st.hp * (hpScale || 1)));
  return { id, name, st, attr, moves, hp, max: hp, sp: st.sp, x: 0, y: 0, img: dgImage(id) };
}

async function dungeon(diff){
  diff = diff || DIFFS[1];
  const p = P(); busy = true;
  openOv('<h4>Entering the dungeon…</h4><div class="status">Generating floor 1…</div>');
  const ally = G.party.length > 1 ? G.party[(G.active + 1) % G.party.length] : null;
  let myD = null, allyD = null;
  try{ [myD, allyD] = await Promise.all([getDetail(p.id), ally ? getDetail(ally.id) : null]); }catch{}
  await syncMoves(p); if (ally) await syncMoves(ally);
  const st = partnerStats(p);
  dg = { stage: p.stage, diff, floors: diff.floors, floor: 0, data: 0, kos: 0, turn: 0, steps: 0, bag: { meat: 1, disk: 1 }, eggs: 0, over: false,
    me: dgUnit(p.id, p.name, st, mainAttr(myD), partnerMoves(p), 1), ally: null, log: [], sel: 0 };
  const firstSkill = dg.me.moves.findIndex(mv => mv.cost > 0 && mv.kind !== 'guard');
  dg.sel = firstSkill >= 0 ? firstSkill : 0;
  dg.me.face = DIRS.down;
  if (ally){ const ast = partnerStats(ally); dg.ally = dgUnit(ally.id, ally.name, ast, mainAttr(allyD), partnerMoves(ally), 1); }
  p.energy = clamp(p.energy - 30); saveGame();
  dgNextFloor();
  dgUI();
}

function dgNextFloor(){
  dg.floor++;
  const f = genFloor(); dg.map = f.map; dg.rooms = f.rooms;
  dg.seen = new Uint8Array(DG.W * DG.H); dg.enemies = []; dg.items = []; dg.stairs = null;
  const startRoom = dg.rooms[0];
  dg.me.x = startRoom.x + (startRoom.w >> 1); dg.me.y = startRoom.y + (startRoom.h >> 1);
  if (dg.ally && dg.ally.hp > 0){ const s = [[1,0],[-1,0],[0,1],[0,-1]].map(d => [dg.me.x + d[0], dg.me.y + d[1]]).find(c => dgFloor(c[0], c[1])) || [dg.me.x, dg.me.y]; dg.ally.x = s[0]; dg.ally.y = s[1]; }
  dg.stairs = dgFreeSpot(startRoom);
  // a few species per floor, from the leader's level
  const pool = (state.stageIds[dg.stage] || []).filter(id => state.byId.has(id));
  dg.species = [pick(pool), pick(pool), pick(pool)];
  const n = 3 + dg.floor;
  for (let i = 0; i < n; i++) dgSpawn(startRoom);
  const ni = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < ni; i++){
    const s = dgFreeSpot(); if (!s) continue;
    const r = Math.random();
    const type = dg.floor >= 3 && r < 0.04 * dg.diff.reward ? 'egg' : dg.floor >= 2 && r > 1 - 0.05 * dg.diff.reward ? 'relic' : r < 0.45 ? 'chip' : r < 0.75 ? 'meat' : 'disk';
    dg.items.push({ x: s.x, y: s.y, type });
  }
  dgReveal();
  dgLog('Floor ' + dg.floor + ' of ' + dg.floors + '. Find the stairs!');
}

function dgSpawn(avoidRoom){
  if (dg.enemies.length >= 9) return;
  const s = dgFreeSpot(avoidRoom); if (!s) return;
  const id = pick(dg.species), b = state.byId.get(id); if (!b) return;
  const base = baseStats(id, dg.stage), mine = partnerStats(P()), myBase = baseStats(P().id, P().stage);
  const scale = (1 + 0.07 * (dg.floor - 1)) * dg.diff.foe, st = {};
  STAT_KEYS.forEach(k => st[k] = Math.max(1, Math.round((base[k] + 0.4 * (mine[k] - myBase[k])) * scale)));
  const e = dgUnit(id, b.name, st, 'Free', foeMoves(id, null, dg.stage, dg.diff.lv), 0.45);
  e.x = s.x; e.y = s.y; e.awake = false;
  dg.enemies.push(e);
  getDetail(id).then(d => { e.attr = mainAttr(d); e.moves = foeMoves(id, d, dg.stage, dg.diff.lv); }).catch(() => {});
}

function dgVisible(x, y){
  const m = dg.me, r = dgRoomAt(m.x, m.y);
  if (r && x >= r.x - 1 && x <= r.x + r.w && y >= r.y - 1 && y <= r.y + r.h) return true;
  return Math.max(Math.abs(x - m.x), Math.abs(y - m.y)) <= 2;
}
function dgReveal(){
  const m = dg.me, r = dgRoomAt(m.x, m.y);
  const mark = (x, y) => { if (x >= 0 && y >= 0 && x < DG.W && y < DG.H) dg.seen[y * DG.W + x] = 1; };
  if (r) for (let y = r.y - 1; y <= r.y + r.h; y++) for (let x = r.x - 1; x <= r.x + r.w; x++) mark(x, y);
  for (let y = m.y - 2; y <= m.y + 2; y++) for (let x = m.x - 2; x <= m.x + 2; x++) mark(x, y);
}

function dgLog(t){ dg.log.push(t); if (dg.log.length > 3) dg.log.shift(); const el = $('#dlog'); if (el) el.innerHTML = dg.log.map(esc).join('<br>'); }

function dgHit(att, def, mv){
  const r = doMove(att, def, mv);
  dgLog(r.text);
  if (r.dmg){ def.flash = 3; if (def.hp <= 0) dgDown(def, att); }
}
function dgDown(u, by){
  if (u === dg.me){ dgLog(dg.me.name + ' fainted…'); dgEnd('faint'); return; }
  if (u === dg.ally){ dgLog(u.name + ' fainted and was carried out.'); return; }
  dg.enemies = dg.enemies.filter(e => e !== u);
  dg.kos++; const gain = Math.round((3 + dg.stage * 2) * dg.diff.reward); dg.data += gain;
  if (!G.col[u.id]) G.col[u.id] = 'seen';
  dgLog(u.name + ' was defeated! +' + gain + ' DigiData.');
}

// one player action, then everyone else moves
function dgAct(action, dir){
  if (!dg || dg.over || dg.busy) return;
  const m = dg.me;
  m.guard = false;
  if (action === 'move'){
    m.face = dir;
    const nx = m.x + dir[0], ny = m.y + dir[1], occ = dgUnitAt(nx, ny);
    if (occ && occ !== dg.ally) dgHit(m, occ, m.moves[0]);
    else if (!dgFloor(nx, ny)) { dgDraw(); return; }
    else {
      if (occ && occ === dg.ally){ dg.ally.x = m.x; dg.ally.y = m.y; }
      m.x = nx; m.y = ny; dg.steps++;
      const it = dg.items.find(i => i.x === nx && i.y === ny);
      if (it){ dg.items = dg.items.filter(i => i !== it); dgPickup(it); }
    }
  } else if (action === 'skill'){
    const mv = m.moves[dg.sel] || m.moves[0];
    if ((mv.cost || 0) > m.sp){ dgLog('Not enough SP for ' + mv.name + '.'); return; }
    if (mv.kind === 'heal' || mv.kind === 'buff' || mv.kind === 'guard') dgHit(m, m, mv);
    else {
      let target = null; const range = mv.cost ? 4 : 1;
      for (let k = 1; k <= range; k++){
        const x = m.x + m.face[0] * k, y = m.y + m.face[1] * k;
        if (!dgFloor(x, y)) break;
        const u = dgUnitAt(x, y); if (u && u !== dg.ally){ target = u; break; }
      }
      if (target) dgHit(m, target, mv); else { m.sp -= mv.cost || 0; dgLog(m.name + ' used ' + mv.name + ', but hit nothing.'); }
    }
  } else if (action === 'meat'){
    if (!dg.bag.meat) return;
    dg.bag.meat--; const h = Math.round(m.max * 0.4); m.hp = Math.min(m.max, m.hp + h); P().hunger = clamp(P().hunger + 25);
    dgLog(m.name + ' ate meat. +' + h + ' HP, belly filled.');
  } else if (action === 'disk'){
    if (!dg.bag.disk) return;
    dg.bag.disk--; const s = Math.round(m.st.sp * 0.6); m.sp = Math.min(m.st.sp, m.sp + s);
    dgLog('Used an SP Disk. +' + s + ' SP.');
  }
  if (dg.over) return;
  if (dg.stairs && m.x === dg.stairs.x && m.y === dg.stairs.y){
    if (dg.floor >= dg.floors){ dgEnd('clear'); return; }
    dgLog('Found the stairs!'); dgNextFloor(); dgDraw(); return;
  }
  dgWorld();
  dgReveal(); dgDraw();
}

function dgPickup(it){
  if (it.type === 'chip'){ const v = Math.round((6 + dg.stage * 4 + (Math.random() * 6 | 0)) * dg.diff.reward); dg.data += v; dgLog('Picked up a Data Chip: +' + v + ' DigiData.'); }
  else if (it.type === 'meat'){ dg.bag.meat++; dgLog('Picked up some meat.'); }
  else if (it.type === 'disk'){ dg.bag.disk++; dgLog('Picked up an SP Disk.'); }
  else if (it.type === 'egg'){ dg.eggs++; dgLog('Found a Mystery Egg!'); }
  else if (it.type === 'relic'){ const k = randomDigimental(); (dg.relics = dg.relics || []).push(k); dgLog('Found a ' + itemName(k) + '!'); }
}

function dgWorld(){
  dg.turn++;
  const m = dg.me, a = dg.ally;
  // ally: fight next to it, otherwise stay close to the leader
  if (a && a.hp > 0){
    const foe = dg.enemies.find(e => Math.abs(e.x - a.x) + Math.abs(e.y - a.y) === 1);
    a.guard = false;
    if (foe) dgHit(a, foe, foeChoice(a, foe));
    else if (Math.abs(a.x - m.x) + Math.abs(a.y - m.y) > 1){ const s = dgStep(a, m.x, m.y, 20); if (s){ a.x = s.x; a.y = s.y; } }
  }
  if (dg.over) return;
  for (const e of dg.enemies.slice()){
    if (dg.over) return;
    if (!dg.enemies.includes(e)) continue;
    e.guard = false;
    const targets = [m, a].filter(u => u && u.hp > 0);
    const t = targets.sort((u, v) => (Math.abs(u.x - e.x) + Math.abs(u.y - e.y)) - (Math.abs(v.x - e.x) + Math.abs(v.y - e.y)))[0];
    const dist = Math.abs(t.x - e.x) + Math.abs(t.y - e.y);
    if (dist <= 7 || dgRoomAt(e.x, e.y) && dgRoomAt(e.x, e.y) === dgRoomAt(m.x, m.y)) e.awake = true;
    if (dist === 1){ dgHit(e, t, foeChoice(e, t)); continue; }
    if (e.awake){ const s = dgStep(e, t.x, t.y, 14); if (s){ e.x = s.x; e.y = s.y; } }
    else if (Math.random() < 0.5){ const d = pick(Object.values(DIRS)); if (dgFloor(e.x + d[0], e.y + d[1]) && !dgUnitAt(e.x + d[0], e.y + d[1])){ e.x += d[0]; e.y += d[1]; } }
  }
  // regen, belly, reinforcements
  if (dg.turn % 4 === 0){ for (const u of [m, a]) if (u && u.hp > 0 && u.hp < u.max) u.hp++; }
  if (dg.turn % 6 === 0){ for (const u of [m, a]) if (u && u.hp > 0 && u.sp < u.st.sp) u.sp++; }
  const p = P(); p.hunger = clamp(p.hunger - 0.1);
  if (p.hunger <= 0){ m.hp = Math.max(0, m.hp - 1); if (dg.turn % 5 === 0) dgLog(m.name + ' is starving!'); if (m.hp <= 0) dgDown(m); }
  if (dg.turn % 30 === 0) dgSpawn(dgRoomAt(m.x, m.y));
}

function dgEnd(result){
  if (dg.over) return;
  dg.over = true;
  const p = P(), r = dg;
  let data = r.data, evo = Math.floor(r.kos / 2), eggs = r.eggs, title, note;
  if (result === 'clear'){
    data += Math.round((30 * (r.stage + 1) + 10 * r.floors) * r.diff.reward); evo += Math.round(5 * r.diff.reward);
    if (Math.random() < r.diff.egg){ if (r.diff.rare && Math.random() < 0.5) r.rareEgg = true; else eggs++; }
    p.mood = clamp(p.mood + 15); title = 'Dungeon cleared!'; p.stageWins = (p.stageWins || 0) + 1; questProgress('dungeon');
    const crestOdds = { hard: 0.2, nightmare: 0.4 }[r.diff.key] || 0;
    if (Math.random() < crestOdds){ const ck = randomCrest() || randomDigimental(); (r.relics = r.relics || []).push(ck); }
    note = 'You made it through all ' + r.floors + ' floors on ' + r.diff.name + '.' + (r.rareEgg ? ' You found a Rare Mystery Egg!' : '');
  } else if (result === 'faint'){
    data = Math.floor(data / 2); eggs = 0; p.mood = clamp(p.mood - 15); title = 'Knocked out'; p.stageLosses = (p.stageLosses || 0) + 1; r.relics = [];
    note = p.name + ' fainted on floor ' + r.floor + '. Half the DigiData and any eggs or items were lost.';
  } else { title = 'Left the dungeon'; note = 'You escaped from floor ' + r.floor + ' with everything you found.'; }
  G.data += data; p.evo += evo; for (let i = 0; i < eggs; i++) G.eggs.push('mystery');
  if (r.rareEgg && result === 'clear'){ G.eggs.push('rare'); eggs++; }
  if (r.kos) questProgress('ko', r.kos);
  const relics = r.relics || []; relics.forEach(k => giveItem(k));
  if (relics.length) note += ' Items: ' + relics.map(itemName).join(', ') + '.';
  const xp = Math.round((r.kos * (3 + 2 * r.stage) + (result === 'clear' ? 20 + 10 * r.stage : 0)) * (result === 'faint' ? 0.5 : 1) * r.diff.reward);
  if (xp) gainXP(p, xp).then(lv => { const el = $('#dgLv'); if (el) el.textContent = '+' + xp + ' XP.' + levelText(lv); });
  saveGame();
  const sheet = $('#overlay .sheet');
  if (sheet) sheet.innerHTML = '<h4>' + title + '</h4><p style="margin:0;color:var(--muted)">' + esc(note) + '</p>' +
    '<div class="wallet" style="justify-content:space-between"><span>Defeated <b>' + r.kos + '</b></span><span>DigiData <b>+' + data + '</b></span><span>Evo <b>+' + evo + '</b></span>' + (eggs ? '<span>Eggs <b>+' + eggs + '</b></span>' : '') + '</div>' +
    '<p id="dgLv" style="margin:0;font-size:.88rem"></p><button class="big" id="dgDone">Continue</button>';
  const b = $('#dgDone'); if (b) b.onclick = () => { closeOv(); dg = null; say(result === 'clear' ? p.name + ' cleared the dungeon!' : result === 'faint' ? p.name + ' needs some rest after the dungeon.' : p.name + ' came back from the dungeon.', result === 'clear' ? 'happy' : null); };
}

// ----- dungeon screen -----
function dgUI(){
  const sheet = $('#overlay .sheet'); if (!sheet) return;
  sheet.classList.add('dsheet');
  sheet.innerHTML = '<div class="dhead" id="dhead"></div><canvas id="dgc" aria-label="Dungeon map"></canvas><div class="dlog" id="dlog" aria-live="polite"></div>' +
    '<div class="dctl"><div class="dpad">' +
      '<span></span><button data-d="up" aria-label="Move up">▲</button><span></span>' +
      '<button data-d="left" aria-label="Move left">◀</button><button data-d="wait" aria-label="Wait a turn">•</button><button data-d="right" aria-label="Move right">▶</button>' +
      '<span></span><button data-d="down" aria-label="Move down">▼</button><span></span></div>' +
      '<div class="dside"><button class="act" id="dgSkill"></button><button class="act" id="dgMeat"></button><button class="act" id="dgDisk"></button><button class="ghost" id="dgNext">⇄ Switch move</button><button class="ghost" id="dgQuit">Leave</button></div></div>';
  sheet.querySelectorAll('[data-d]').forEach(b => b.onclick = () => b.dataset.d === 'wait' ? dgAct('wait') : dgAct('move', DIRS[b.dataset.d]));
  $('#dgSkill').onclick = () => dgAct('skill');
  $('#dgMeat').onclick = () => dgAct('meat');
  $('#dgDisk').onclick = () => dgAct('disk');
  $('#dgNext').onclick = () => { dg.sel = (dg.sel + 1) % dg.me.moves.length; dgDraw(); };
  $('#dgQuit').onclick = () => { const q = $('#dgQuit'); if (q.dataset.armed) dgEnd('quit'); else { q.dataset.armed = '1'; q.textContent = 'Tap to leave'; } };
  dgLog(dg.log.pop() || '');
  dgDraw();
}
const dgKeys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
document.addEventListener('keydown', e => {
  if (!dg || dg.over) return;
  if (dgKeys[e.key]){ e.preventDefault(); dgAct('move', DIRS[dgKeys[e.key]]); }

// ----- digivolution requirements: stats, items (Digimentals, Crests, X-Antibody), DNA partners and care -----
const VIRTUES = ['Courage', 'Friendship', 'Love', 'Knowledge', 'Sincerity', 'Reliability', 'Hope', 'Light', 'Kindness', 'Miracles', 'Fate'];
const CREST_VIRTUES = VIRTUES.slice(0, 9);
const VIRTUE_ALIAS = { Purity: 'Sincerity', Destiny: 'Fate', Faith: 'Reliability', Trust: 'Reliability' };
// the Adventure partners' crest forms, so the classics need the right crest
const CREST_OF = { 'Metal Greymon': ['Courage'], 'War Greymon': ['Courage'], 'Were Garurumon': ['Friendship'], 'Metal Garurumon': ['Friendship'],
  'Garudamon': ['Love'], 'Hououmon': ['Love'], 'Atlur Kabuterimon (Red)': ['Knowledge'], 'Herakle Kabuterimon': ['Knowledge'],
  'Lilimon': ['Sincerity'], 'Rosemon': ['Sincerity'], 'Zudomon': ['Reliability'], 'Vikemon': ['Reliability'], 'Holy Angemon': ['Hope'],
  'Seraphimon': ['Hope'], 'Angewomon': ['Light'], 'Ofanimon': ['Light'], 'Omegamon': ['Courage', 'Friendship'] };
const DIGIMENTAL_OF = { Fladramon: 'Courage', Lighdramon: 'Friendship', Nefertimon: 'Light', Pegasmon: 'Hope', Digmon: 'Knowledge', Submarimon: 'Sincerity',
  Shurimon: 'Sincerity', Holsmon: 'Love', Magnamon: 'Miracles', 'Gold V-dramon': 'Fate', 'Rapidmon Armor': 'Miracles' };
const JUNK_RE = /^(Numemon|Sukamon|Raremon|Geremon|Nanimon|Platinum Sukamon|Gold Numemon|Platinum Numemon|Etemon)$/;
const DARK_RE = /Skull|Black|Chaos|Death|Dark|Devi|Venom|Evil|Vamdemon|Piemon|Lilithmon|Belial|Falldown|Daemon|Demon|Zombie|Undead|Bakemon|Phantomon|Mummymon|Ogudomon/;
const HOLY_RE = /Ange|Holy|Seraph|Ofani|Saint|Magnamon|Cherubi|Kerubi|Dominimon|Clavis|Darcmon|Pidmon|Sleipmon|Hououmon|Unimon|Pegasmon|Nefertimon/;
const ITEM_PRICE = { dm: 120, crest: 450, xab: 200, clean: 150, vit: 90, all: 400 };
const CHIP_KEYS = ['atk', 'int', 'def', 'spd', 'hp', 'sp'];
// how much a stat chip adds, scaled to the Digimon's stage
function chipGain(k, stage){ return { atk: 2 + stage, int: 2 + stage, def: 2 + stage, spd: 1 + stage, hp: 10 + 5 * stage, sp: 3 + stage }[k]; }
const itemPrice = k => k === 'vit:all' ? ITEM_PRICE.all : ITEM_PRICE[itemType(k)];
const randomChip = () => Math.random() < 0.08 ? 'vit:all' : 'vit:' + pick(CHIP_KEYS);
const virtue = w => { w = String(w || '').replace(/[^A-Za-z]/g, ''); w = w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); return VIRTUE_ALIAS[w] || (VIRTUES.includes(w) ? w : 'Miracles'); };
const itemType = k => k.split(':')[0];
const itemName = k => k === 'xab' ? 'X-Antibody' : k === 'clean' ? 'Clean Slate' : k === 'vit:all' ? 'Ultimate Chip' : itemType(k) === 'vit' ? STAT_LABEL[k.split(':')[1]] + ' Chip' : (itemType(k) === 'dm' ? 'Digimental of ' : 'Crest of ') + k.split(':')[1];
const itemIcon = k => k === 'xab' ? '🧬' : k === 'clean' ? '🕊️' : k === 'vit:all' ? '🌟' : itemType(k) === 'vit' ? '💾' : itemType(k) === 'dm' ? '🥚' : '🔰';
const itemUsable = k => k === 'clean' || itemType(k) === 'vit';
const itemKept = k => itemType(k) === 'crest';
const hasItem = k => (G.items[k] || 0) > 0;
function giveItem(k, n){ G.items[k] = (G.items[k] || 0) + (n || 1); }
const randomDigimental = () => 'dm:' + pick(VIRTUES);
function randomCrest(){ const left = CREST_VIRTUES.filter(v => !hasItem('crest:' + v)); return left.length ? 'crest:' + pick(left) : null; }
function nameId(n){
  if (!state.nameMap || state.nameMap.size === 0) state.nameMap = new Map((state.all || []).map(d => [d.name.toLowerCase(), d.id]));
  return state.nameMap.get(String(n).trim().replace(/^(the|a|an) /i, '').toLowerCase());
}
// a stat goal that matches what the next form is good at
function statReq(to, s){
  const r = Math.abs(seeded(to, 47));
  const k = r < 0.15 ? 'atk' : r < 0.3 ? 'int' : r < 0.5 ? 'def' : r < 0.67 ? 'spd' : r < 0.84 ? 'hp' : 'sp';
  const extra = { atk: 3 + 3 * s, int: 3 + 3 * s, def: 3 + 3 * s, spd: 2 + 2 * s, hp: 15 + 10 * s, sp: 4 + 2 * s }[k];
  return { t: 'stat', k, v: STAT_BASE[k][s] + extra };
}
// requirements for evolving into `to` from stage `s`, built from the API's evolution conditions plus a fixed per-species roll
function reqsFor(to, cond, s){
  const name = state.byId.get(to)?.name || '', c = String(cond || ''), q = [];
  if (s < 2) return q;                       // Fresh and In-Training digivolve freely
  if (state.armor.has(to) && s === 2){
    const m = c.match(/Digimentals? of (\w+)/i);
    q.push({ t: 'item', key: 'dm:' + (m ? virtue(m[1]) : DIGIMENTAL_OF[name] || VIRTUES[Math.floor(Math.abs(seeded(to, 31)) * VIRTUES.length)]) });
    return q;                                // Armor forms just need their Digimental
  }
  const bad = /Dark Evolution|Death Evolution/i.test(c);
  if (CREST_OF[name]) CREST_OF[name].forEach(v => q.push({ t: 'item', key: 'crest:' + v }));
  else { const m = !bad && c.match(/Crest of (\w+)/i); if (m) q.push({ t: 'item', key: 'crest:' + virtue(m[1]) }); }
  if (/\(X-Antibody\)/.test(name)) q.push({ t: 'item', key: 'xab' });
  // DNA digivolution: "with Tailmon" means a Tailmon has to be with you
  if (/^with (?!or without)/i.test(c) && !/Digimental|Crest|Spirit|X-Antibody|Card Game|Vital Bracelet|Pendulum|Every Digimon|Evolution|certain/i.test(c)){
    const ids = [...new Set(c.replace(/^with /i, '').split(/,\s*(?:or |and )?|\s+or\s+|\s+and\s+/).map(nameId).filter(id => id && id !== to))];
    if (ids.length) q.push({ t: 'dna', ids: ids.slice(0, 4) });
  }
  const r = Math.abs(seeded(to, 41));
  if (JUNK_RE.test(name) || bad) q.push({ t: 'bad', n: 3 });
  else if (DARK_RE.test(name)) q.push({ t: 'bad', n: 2 });
  else if (HOLY_RE.test(name)) q.push({ t: 'clean' });
  else if (r < 0.36) q.push(statReq(to, s));
  else if (r < 0.48) q.push({ t: 'wins', n: [0, 0, 3, 5, 7, 10][s] });
  else if (r < 0.56) q.push({ t: 'clean' });
  else if (r < 0.6) q.push({ t: 'bad', n: 2 });
  if (s >= 4 && !q.some(x => x.t === 'stat')) q.push(statReq(to, s));   // Megas always need real strength
  return q;
}
// the forms a Digimon can reach next (Rookies can also armor-digivolve)
function nextCands(d, stage){
  const seen = new Set();
  const all = (d.nextEvolutions || []).map(e => ({ id: evoId(e), name: e.digimon, image: e.image, cond: e.condition || '' }))
    .filter(e => e.id && state.byId.has(e.id) && !seen.has(e.id) && seen.add(e.id));
  let c = all.filter(e => inStage(e.id, stage + 1) || (stage === 2 && state.armor.has(e.id)));
  if (!c.length) c = all.filter(e => higherStage(e.id, stage) !== undefined);
  return c;
}
// every line keeps at least one open path so a partner can never get stuck
function pathReqs(fromId, s, cands){
  const m = new Map();
  for (const c of cands) m.set(c.id, reqsFor(c.id, c.cond, s));
  if (cands.length && !cands.some(c => !m.get(c.id).length)){
    const pool = cands.filter(c => !(state.armor.has(c.id) && s === 2)).sort((a, b) => seeded(a.id, 43) - seeded(b.id, 43));
    if (pool[0]) m.set(pool[0].id, []);
  }
  return m;
}
function failures(p){ return (p.stageMistakes || 0) + (p.stageLosses || 0); }
function reqMet(q, p){
  if (q.t === 'item') return hasItem(q.key);
  if (!p) return null;
  if (q.t === 'stat') return partnerStats(p)[q.k] >= q.v;
  if (q.t === 'dna') return [...G.party, ...G.box].some(m => m !== p && q.ids.includes(m.id));
  if (q.t === 'wins') return (p.stageWins || 0) >= q.n;
  if (q.t === 'clean') return failures(p) === 0;
  if (q.t === 'bad') return failures(p) >= q.n;
  return true;
}
function reqText(q, p){
  if (q.t === 'stat') return STAT_LABEL[q.k] + ' ' + q.v + '+' + (p ? ' (' + partnerStats(p)[q.k] + ')' : '');
  if (q.t === 'item') return itemIcon(q.key) + ' ' + itemName(q.key) + (!itemKept(q.key) && G.items[q.key] ? ' ×' + G.items[q.key] : '');
  if (q.t === 'dna') return '🤝 ' + q.ids.map(id => shown(id, state.byId.get(id)?.name || '?')).join(' or ') + ' in party/Box';
  if (q.t === 'wins') return '🏆 ' + q.n + ' wins this stage' + (p ? ' (' + (p.stageWins || 0) + ')' : '');
  if (q.t === 'clean') return '✨ No failures this stage' + (p && failures(p) ? ' (' + failures(p) + ')' : '');
  if (q.t === 'bad') return '💀 ' + q.n + '+ failures this stage' + (p ? ' (' + failures(p) + ')' : '');
  return '';
}
function reqChips(list, p){
  if (!list || !list.length) return '';
  return '<span class="reqs">' + list.map(q => { const ok = reqMet(q, p); return '<span class="rq' + (ok === true ? ' ok' : ok === false ? ' no' : '') + '">' + esc(reqText(q, p)) + '</span>'; }).join('') + '</span>';
}
function pathRows(p, cands, reqMap){
  return cands.map(c => { const rq = reqMap.get(c.id) || []; return { c, rq, miss: rq.filter(q => !reqMet(q, p)).length }; });
}
function pathImg(c){ return '<img class="' + (known(c.id) ? '' : 'sil') + '" alt="" src="' + esc(c.image || state.byId.get(c.id)?.image || '') + '">'; }
function pathRow(x, p, planner){
  const k = known(x.c.id), tag = !planner ? '' : x.miss ? '' : x.rq.length ? '<small class="okt">✓ Unlocked</small>' : '<small class="okt free">Open path</small>';
  return '<div class="lrow' + (planner && !x.miss ? ' open' : '') + '">' + pathImg(x.c) + '<div><b>' + (k ? esc(x.c.name) : '???') + '</b>' +
    (raised(x.c.id) ? ' <small class="okt">raised</small>' : '') + tag + reqChips(x.rq, p) + '</div></div>';
}
function ownedItemsLine(){
  const owned = Object.keys(G.items).filter(hasItem);
  return owned.length ? '<p class="ownline">Your items: ' + owned.map(k => esc(itemIcon(k) + ' ' + itemName(k) + (itemKept(k) ? '' : ' ×' + G.items[k]))).join(' · ') + '</p>'

// bag: use care and training items on the active partner

    '<p id="bagMsg" style="margin:0;min-height:1.3em;font-size:.88rem">' + esc(msg || '') + '</p>' +

  $('#overlay').querySelectorAll('[data-use]').forEach(b => b.onclick = () => {

    else {

      note = p.name + ' used the ' + itemName(k) + ': ' + parts.join(', ') + '.';
    }

  { t: 'exp', min: 1, max: 3, per: 50, text: n => 'Finish ' + n + ' expedition' + (n === 1 ? '' : 's') },
  { t: 'evolve', min: 1, max: 1, per: 130, text: () => 'Digivolve a Digimon' },
  { t: 'care', min: 4, max: 8, per: 9, text: n => 'Feed or play with your partners ' + n + ' times' },
  { t: 'hatch', min: 1, max: 1, per: 70, text: () => 'Hatch an egg' },
  { t: 'discover', min: 2, max: 5, per: 35, text: n => 'Discover ' + n + ' new Digimon' },

const foundCount = () => Object.keys(G.col).length;
const questSlots = () => 3 + QUEST_UNLOCKS.filter(n => foundCount() >= n).length;
const hourKey = () => Math.floor(Date.now() / 3600000);
const questRefreshCost = () => 50 + 50 * (G.quests.paid || 0);
function makeQuest(avoid){
  const pool = QUEST_TYPES.filter(q => !avoid.includes(q.t));
  const T = pick(pool.length ? pool : QUEST_TYPES), n = T.min + Math.floor(Math.random() * (T.max - T.min + 1));
  const r = Math.random(), item = r < 0.12 ? 'egg' : r < 0.3 ? 'clean' : r < 0.55 ? randomChip() : r < 0.65 ? randomDigimental() : null;
  return { t: T.t, n, prog: 0, base: T.t === 'discover' ? foundCount() : 0, data: Math.round(T.per * n * (0.9 + Math.random() * 0.3) / 5) * 5, item };
}
function questInit(){
  if (!G.quests || !Array.isArray(G.quests.list)) G.quests = { list: [], hour: hourKey(), freeUsed: false, paid: 0 };
  const Q = G.quests;
  if (Q.hour !== hourKey()){ Q.hour = hourKey(); Q.freeUsed = false; Q.paid = 0; }   // new hour: free refresh back, price resets
  while (Q.list.length < questSlots()) Q.list.push(makeQuest(Q.list.filter(Boolean).map(q => q.t)));

}
function updateQuestBadge(){
  const t = $('#tabQuests'); if (!t || !G.quests) return;

  t.textContent = n ? 'Quests · ' + n : 'Quests';
}
function rewardText(q){ return '+' + q.data + ' DigiData' + (q.item ? ' · ' + (q.item === 'egg' ? '🥚 Mystery Egg' : itemIcon(q.item) + ' ' + itemName(q.item)) : ''); }
// replaces every quest except finished ones you haven't claimed yet
function rerollQuests(){
  const Q = G.quests, keep = Q.list.map(q => questDone(q) || (q && q.locked) ? q : null);

function renderQuests(msg){
  questInit(); updateQuestBadge();

      '<div class="evotrack"><i style="width:' + (p / q.n * 100) + '%"></i></div>' +
      '<div class="qbot"><small>' + esc(rewardText(q)) + '</small>' + (done ? '<button class="act" data-claim="' + i + '">Claim</button>' : '') + '</div></div>';
  };

// ----- digivolution along the real evo lines -----
async function digivolve(){
  const p = P(); if (busy || !canEvolve(p)) return;
  busy = true;
  openOv('<h4>' + esc(p.name) + ' is digivolving…</h4><div class="status">Reading its evolution line…</div>');
  let d;
  try{ d = await getDetail(p.id); }
  catch(e){ $('#overlay .sheet').innerHTML = '<h4>Connection problem</h4><p>Couldn\'t load ' + esc(p.name) + '\'s evolutions (' + esc(e.message) + ').</p><button class="big" id="ovClose">Close</button>'; $('#ovClose').onclick = closeOv; return; }
  const cands = nextCands(d, p.stage);
  if (!cands.length){
    p.final = true; saveGame();
    $('#overlay .sheet').innerHTML = '<h4>No further forms</h4><p>' + esc(p.name) + ' has no recorded evolution to the next stage, so this is its final form.</p><button class="big" id="ovClose">OK</button>';
    $('#ovClose').onclick = () => { closeOv(); renderPartner(); };
    return;
  }
  const reqMap = pathReqs(p.id, p.stage, cands);
  const rows = pathRows(p, cands, reqMap);
  // every path whose requirements are met can be chosen: unlocked special paths first, then new forms, then ones you've raised
  const free = rows.filter(x => !x.rq.length);
  const special = rows.filter(x => x.rq.length && !x.miss);
  const rank = x => (known(x.c.id) ? 0 : 1) + (raised(x.c.id) ? 2 : 0);
  const options = [...special, ...free.sort((a, b) => rank(a) - rank(b) || a.c.name.localeCompare(b.c.name))];
  const locked = rows.filter(x => x.miss).sort((a, b) => a.miss - b.miss);
  const careNote = options.length + ' path' + (options.length === 1 ? '' : 's') + ' open. Choose its form!';
  const choice = x => { const r = raised(x.c.id), k = known(x.c.id);
    return '<button class="choice' + (x.rq.length ? ' special' : '') + '" data-pick="' + x.c.id + '">' + pathImg(x.c) + '<b>' + (k ? esc(x.c.name) : '???') + '</b>' +
      (r ? '<small>✓ raised before</small>' : k ? '<small>seen in battle</small>' : '') + reqChips(x.rq, p) + '</button>'; };
  $('#overlay .sheet').innerHTML = '<h4>' + esc(p.name) + ' is ready!</h4>' +
    '<p style="margin:0;color:var(--muted)">' + careNote + (special.length ? ' ' + special.length + ' special path' + (special.length === 1 ? '' : 's') + ' unlocked (highlighted).' : '') + ' ' + cands.length + ' possible forms in total.</p>' +
    (options.length ? '<div class="choices">' + options.map(choice).join('') + '</div>' : '<p style="margin:0">No path is open yet. Meet one of the requirements below, then try again.</p>') +
    (locked.length ? '<h5 class="lockh">🔒 Locked paths · ' + locked.length + '</h5><div class="lrows">' + locked.slice(0, 6).map(x => pathRow(x, p)).join('') + '</div>' +
      (locked.length > 6 ? '<p class="ownline">See all ' + locked.length + ' in 🧬 Evolution paths.</p>' : '') : '') +
    '<button class="ghost" id="evoLater">Not yet</button>';
  $('#evoLater').onclick = () => { closeOv(); renderPartner(); };
  $('#overlay').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => evolveTo(+b.dataset.pick, reqMap.get(+b.dataset.pick)));
}

async function evolveTo(id, reqs){
  const p = P(); const b = state.byId.get(id);
  const used = [];
  for (const q of reqs || []) if (q.t === 'item' && !itemKept(q.key) && hasItem(q.key)){ G.items[q.key]--; used.push(itemName(q.key)); }

// ---------- image processing: cut out the white background, optional retro pixel look ----------
// Done on this device from the official art; silhouettes need the cutout so they show a shape, not a square.
const IMG_SEL = '.lrow img, .bcell img, .bhead img, .slot img, .pic, .evo img, #sprite, .art, .lineage img, .choice img, .fighter img, .reveal img';
let retroOn = false;   // retro pixel mode was removed; always show the official art
const imgCache = new Map();
function processArt(src, res, retro){
  const key = src + '|' + res + '|' + retro;
  if (imgCache.has(key)) return imgCache.get(key);
  const job = new Promise(done => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onerror = () => done(null);
    im.onload = () => {
      try{ done(retro ? pixelSprite(im, res) : cutout(im, res)); }catch{ done(null); }
    };
    im.src = src;
  });
  imgCache.set(key, job);
  return job;
}
// background = near-white pixels connected to the edges (inner whites like eyes and wings stay)
function findBackground(p, S){
  const N = S * S, bg = new Uint8Array(N), q = [];
  const light = i => p[i*4+3] < 40 || (p[i*4] >= 250 && p[i*4+1] >= 250 && p[i*4+2] >= 250);
  for (let i = 0; i < S; i++) for (const j of [i, (S-1)*S + i, i*S, i*S + S - 1]) if (!bg[j] && light(j)){ bg[j] = 1; q.push(j); }
  while (q.length){ const i = q.pop(), xx = i % S; for (const j of [i-1, i+1, i-S, i+S]){ if (j < 0 || j >= N || bg[j] || Math.abs((j % S) - xx) > 1) continue; if (light(j)){ bg[j] = 1; q.push(j); } } }
  return bg;
}
function cutout(im, res){
  const c = document.createElement('canvas'); c.width = c.height = res;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, res, res);
  const d = x.getImageData(0, 0, res, res), bg = findBackground(d.data, res);
  for (let i = 0; i < res * res; i++) if (bg[i]) d.data[i*4+3] = 0;
  x.putImageData(d, 0, 0);
  return c.toDataURL();
}
// pixel sprite: perceptual palette from the art, majority colour per block, line art kept,
// light shading on region edges and a soft outline
function pixelSprite(im, res){
  const S = 320, k = 14;
  const c0 = document.createElement('canvas'); c0.width = c0.height = S;
  const x0 = c0.getContext('2d'); x0.drawImage(im, 0, 0, S, S);
  const p = x0.getImageData(0, 0, S, S).data, N = S * S, bg = findBackground(p, S);
  let x1 = S, y1 = S, x2 = 0, y2 = 0;
  for (let i = 0; i < N; i++) if (!bg[i]){ const xx = i % S, yy = (i / S) | 0; if (xx < x1) x1 = xx; if (xx > x2) x2 = xx; if (yy < y1) y1 = yy; if (yy > y2) y2 = yy; }
  if (x2 < x1) return null;
  const side = (Math.max(x2 - x1, y2 - y1) + 1) * res / (res - 2), ox = (x1 + x2 + 1 - side) / 2, oy = (y1 + y2 + 1 - side) / 2;

  const lin = v => { v /= 255; return v > .04045 ? ((v + .055) / 1.055) ** 2.4 : v / 12.92; };
  const fl = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16/116;
  const toLab = (r, g, b) => { const R = lin(r), G = lin(g), B = lin(b);
    const X = fl((R*.4124 + G*.3576 + B*.1805) / .9505), Y = fl(R*.2126 + G*.7152 + B*.0722), Z = fl((R*.0193 + G*.1192 + B*.9505) / 1.089);

  for (let i = 0; i < N; i++){ if (bg[i]) continue; const q = toLab(p[i*4], p[i*4+1], p[i*4+2]); pc[i*3] = q[0]; pc[i*3+1] = q[1]; pc[i*3+2] = q[2]; }
  const samp = []; for (let i = 0; i < N; i += 3) if (!bg[i]) samp.push(i);
  samp.sort((a, b) => pc[a*3] - pc[b*3]);
  const sortedL = samp.map(i => lum([p[i*4], p[i*4+1], p[i*4+2]])).sort((a, b) => a - b);
  const darkLum = Math.min(45, sortedL[sortedL.length >> 1] * 0.38), darkMin = 5;

  const near = i => { let b = 0, bd = 1e12; for (let ci = 0; ci < cents.length; ci++){ const c = cents[ci]; const dd = (pc[i*3]-c[0])**2 + (pc[i*3+1]-c[1])**2 + (pc[i*3+2]-c[2])**2; if (dd < bd){ bd = dd; b = ci; } } return b; };

    const sum = cents.map(() => [0,0,0,0,0,0,0]);
    for (const i of samp){ const s = sum[near(i)]; s[0] += pc[i*3]; s[1] += pc[i*3+1]; s[2] += pc[i*3+2]; s[3] += p[i*4]; s[4] += p[i*4+1]; s[5] += p[i*4+2]; s[6]++; }

  const cl = cents.map((c, ci) => lum(rgbOf(ci)));

  for (let by = 0; by < res; by++) for (let bx = 0; bx < res; bx++){
    const votes = new Map(); let total = 0, fg = 0, dark = 0, darkIdx = -1, dl = 999;
    for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++){
      const X = Math.floor(ox + (bx + (sx + .5) / 3) * step), Y = Math.floor(oy + (by + (sy + .5) / 3) * step);
      total++; if (X < 0 || Y < 0 || X >= S || Y >= S) continue; const i = Y * S + X; if (bg[i]) continue; fg++;
      const ci = near(i); votes.set(ci, (votes.get(ci) || 0) + 1);
      if (cl[ci] < darkLum){ dark++; if (cl[ci] < dl){ dl = cl[ci]; darkIdx = ci; } }
    }
    if (fg < total * 0.45) continue;
    let best = -1, bv = -1; for (const [ci, v] of votes) if (v > bv){ bv = v; best = ci; }
    if (dark >= darkMin) best = darkIdx;
    idx[by * res + bx] = best;
  }
  const id2 = Int16Array.from(idx);
  for (let q = 0; q < R; q++){
    if (idx[q] < 0) continue; const xx = q % res;
    const nb = [q-1, q+1, q-res, q+res].filter(j => j >= 0 && j < R && Math.abs((j % res) - xx) <= 1).map(j => idx[j]);
    if (nb.length === 4 && nb.every(v => v >= 0 && v !== idx[q])){
      const cnt = {}; nb.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
      const top = +Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
      if (cnt[top] >= 3 && cl[idx[q]] >= 45) id2[q] = top;
    }
  }
  const out = new Uint8ClampedArray(R * 4);
  for (let q = 0; q < R; q++){ if (id2[q] < 0) continue; const c = rgbOf(id2[q]); out[q*4] = c[0]; out[q*4+1] = c[1]; out[q*4+2] = c[2]; out[q*4+3] = 255; }
  for (let q = 0; q < R; q++){
    if (id2[q] < 0 || cl[id2[q]] < 45) continue; const xx = q % res;
    const dn = q + res < R ? id2[q + res] : -1, rt = xx < res - 1 ? id2[q + 1] : -1, up = q - res >= 0 ? id2[q - res] : -1, lf = xx > 0 ? id2[q - 1] : -1;

  }
  for (let q = 0; q < R; q++){
    if (id2[q] >= 0) continue; const xx = q % res;
    const nb = [q-1, q+1, q-res, q+res].find(j => j >= 0 && j < R && id2[j] >= 0 && Math.abs((j % res) - xx) <= 1);
    if (nb !== undefined){ const c = rgbOf(id2[nb]); out[q*4] = c[0]*.45 + 16; out[q*4+1] = c[1]*.45 + 16; out[q*4+2] = c[2]*.45 + 28; out[q*4+3] = 255; }
  }
  const c = document.createElement('canvas'); c.width = c.height = res;
  c.getContext('2d').putImageData(new ImageData(out, res, res), 0, 0);
  return c.toDataURL();
}
async function processImg(img){
  const orig = img.dataset.orig || img.getAttribute('src');
  if (!orig || orig.startsWith('data:')) return;
  const sil = img.classList.contains('sil');
  if (!retroOn && !sil && !isDark()){ if (img.dataset.orig){ img.src = orig; img.style.imageRendering = ''; delete img.dataset.orig; delete img.dataset.mode; } return; }
  const mode = retroOn ? 'retro' : 'cut';
  if (img.dataset.mode === mode) return;
  img.dataset.orig = orig; img.dataset.mode = mode;
  const big = img.matches('#sprite, .art, .reveal img');
  const url = await processArt(orig, retroOn ? (big ? 56 : 44) : (big ? 320 : 128), retroOn);
  if (url && img.dataset.orig === orig && img.dataset.mode === mode){ img.src = url; img.style.imageRendering = retroOn ? 'pixelated' : ''; }
}
const imgIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ imgIO.unobserve(e.target); processImg(e.target); } }), {rootMargin: '300px'});
function scanImgs(root = document){
  if (root.matches?.(IMG_SEL)) imgIO.observe(root);
  root.querySelectorAll?.(IMG_SEL).forEach(img => imgIO.observe(img));
}
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) scanImgs(n); })
  .observe(document.body, {childList: true, subtree: true});
function setRetro(on){
  retroOn = on; store.set('dx_retro', on);
  document.querySelectorAll(IMG_SEL).forEach(img => { delete img.dataset.mode; imgIO.observe(img); });
}

// ---------- events ----------
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  state.scroll = window.scrollY;
  state.trail = [];
  history.pushState(null, '', '#' + c.dataset.id);
  openDetail(c.dataset.id, false);
});
$('#detailView').addEventListener('click', e => {
  const ev = e.target.closest('[data-evo]');
  if (ev){ history.pushState(null, '', '#' + ev.dataset.evo); openDetail(ev.dataset.evo, true); return; }
  const more = e.target.closest('[data-more]');
  if (more){ document.querySelectorAll(`[data-extra="${more.dataset.more}"]`).forEach(x => x.hidden = false); more.remove(); return; }
  const t = e.target.closest('[data-trail]');
  if (t){ const i = +t.dataset.trail; const tgt = state.trail[i]; state.trail = state.trail.slice(0, i); history.pushState(null, '', '#' + tgt.id); openDetail(tgt.id, true); }
});
$('#rail').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) setLevel(c.dataset.level); });
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; renderGrid(); }, 120); });
$('#favOnly').addEventListener('click', e => { state.favOnly = !state.favOnly; e.currentTarget.setAttribute('aria-pressed', state.favOnly); renderGrid(); });
$('#raisedOnly').addEventListener('click', e => { state.raisedOnly = !state.raisedOnly; e.currentTarget.setAttribute('aria-pressed', state.raisedOnly); renderGrid(); });
window.addEventListener('popstate', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy){ tick(); renderPartner(); } });
setInterval(() => { if (!busy && !document.hidden && state.tab === 'partner' && P()){ tick(); renderPartner(); } }, 60000);
setInterval(() => { updateBoxBadge(); if (!busy && !document.hidden && state.tab === 'box') renderBox(); }, 15000);
setInterval(() => { if (!busy && !document.hidden && state.tab === 'quests') renderQuests(); else { questInit(); updateQuestBadge(); } }, 30000);

renderRail();
setRetro(false);
// light / dark mode: follows the phone until you pick one, then remembers it
function isDark(){ return document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function paintThemeBtn(){ $('#themeBtn').textContent = isDark() ? '☀️ Light' : '🌙 Dark'; $('#themeBtn').setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode'); }
$('#themeBtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('dx_theme', next); }catch{}
  paintThemeBtn(); setRetro(false);   // re-process art: cut out white backgrounds in dark mode
  if (typeof dg !== 'undefined' && dg && !dg.over) dgDraw();
};
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintThemeBtn(); setRetro(false); }); }catch{}
paintThemeBtn();
questInit(); updateQuestBadge();
setTab(location.hash && +location.hash.slice(1) ? 'index' : state.tab);
loadAll();
</script>
