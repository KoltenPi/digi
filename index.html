          if (!G.col[f.id]) G.col[f.id] = 'seen';
          bump('modes'); saveGame();
          const im = $('#fMe img'); if (im){ delete im.dataset.orig; delete im.dataset.mode; im.src = f.image; }
          hitFx('#fMe'); log(p.name + ' changed into ' + f.name + '! ATK, INT, DEF and SPD rose.'); draw(); await sleep(1100); continue;
        }
        const r = doMove(me, foe, me.moves[+choice]);
        if (r.dmg) hitFx('#fFoe');
        log(r.text);
      } else {
        await sleep(350);
        const r = doMove(foe, me, foeChoice(foe, me));
        if (r.dmg) hitFx('#fMe');
        log(r.text);
      }
      draw();
      await sleep(autoOn ? 650 : 1000);
      if (foe.hp <= 0) outcome = 'win'; else if (me.hp <= 0) outcome = 'lose';
    }
    // a little SP comes back every round
    if (!outcome) for (const f of [me, foe]) f.sp = Math.min(f.st.sp, f.sp + 1);
  }
  if (!outcome) outcome = me.hp / me.st.hp >= foe.hp / foe.st.hp ? 'win' : 'lose';
  if (opts.onDone){
    if (opts.carry){ opts.carry.hp = me.hp; opts.carry.sp = me.sp; opts.carry.max = me.st.hp; }
    if (outcome === 'win'){ bump('wins'); questProgress('win'); addBond(p, 1); }
    saveGame();
    log(outcome === 'win' ? me.name + ' defeated ' + foe.name + '!' : me.name + ' was defeated by ' + foe.name + '…');
    $('#bact').innerHTML = '<button class="big" id="bDone">Continue</button>';
    $('#bDone').onclick = () => opts.onDone(outcome, { dealt: foe.st.hp - Math.max(0, foe.hp), max: foe.st.hp });
    return;
  }

  p.energy = clamp(p.energy - 25 * (1 - 0.15 * perk('stamina'))); p.hunger = clamp(p.hunger - 10);
  let summary;
  if (outcome === 'win'){
    const g = growthOf(p), k = pick(['atk', 'int', 'def', 'spd', 'hp', 'sp']), v = k === 'hp' ? 3 + p.stage : k === 'sp' ? 2 : 1 + Math.floor(p.stage / 2);
    g[k] = (g[k] || 0) + v;
    const ev = evoWin(p, diff), dd = Math.round((1 + 0.05 * Math.min(p.streak || 0, 10)) * (4 + 3 * p.stage) * diff.reward * (heldOf(p) === 'h:charm' ? 1.3 : 1) * R.reward * (evOn('data') ? 2 : 1) * (rareUp ? 3 : 1) * (1 + 0.1 * perk('scav')));
    bump('wins'); addBond(p, 2);
    questProgress('win'); if (diff.key === 'hard' || diff.key === 'nightmare') questProgress('winHard');
    p.wins++; p.stageWins = (p.stageWins || 0) + 1; p.evo += ev + perk('evo'); p.mood = clamp(p.mood + 8); G.data += dd;
    p.streak = (p.streak || 0) + 1; G.stats = G.stats || {}; G.stats.bestStreak = Math.max(G.stats.bestStreak || 0, p.streak);
    summary = p.name + ' won! +' + ev + ' digivolution points, +' + v + ' ' + STAT_LABEL[k] + ', +' + dd + ' DigiData.';
    if (p.streak >= 2) summary += ' 🔥 ' + p.streak + '-win streak! Next win: +' + Math.round((streakMul(p.streak) - 1) * 100) + '% evo points.';
    if (STREAK_GIFTS[p.streak]){ G.data += STREAK_GIFTS[p.streak]; summary += ' Streak bonus: +' + STREAK_GIFTS[p.streak] + ' DigiData!'; }
    if (diff.battleEgg && Math.random() < diff.battleEgg * (1 + 0.15 * perk('eggs'))){ G.eggs.push(diff.rare ? 'rare' : 'mystery'); summary += ' It dropped ' + (diff.rare ? 'a Rare Mystery Egg!' : 'a Mystery Egg!'); }
    if (diff.battleEgg && Math.random() < diff.battleEgg * 0.8){ const it = randomDigimental(); giveItem(it); summary += ' Found a ' + itemName(it) + '!'; }
    const rd = regionDrop(); if (rd){ grantItem(rd); summary += ' Found ' + itemIcon(rd) + ' ' + itemName(rd) + '!'; }
    if (evOn('eggs') && Math.random() < 0.12){ G.eggs.push('mystery'); summary += ' Egg Hunt: found a Mystery Egg!'; }
  } else if (outcome === 'lose'){ const lost = p.streak || 0; p.streak = 0; p.losses++; p.stageLosses = (p.stageLosses || 0) + 1; p.evo += 1; p.mood = clamp(p.mood - 10); summary = `${p.name} was defeated… Train up and try again.` + (lost >= 2 ? ` Its ${lost}-win streak ended.` : ''); }
  else summary = `${p.name} escaped from ${foe.name}.`;
  saveGame();
  const xp = Math.round((outcome === 'win' ? 10 + p.stage * 6 : outcome === 'lose' ? 3 + p.stage * 2 : 0) * diff.reward * (rareUp && outcome === 'win' ? 3 : 1) * (curWeather().xp || 1));
  if (xp){ const lv = await gainXP(p, xp); summary += ' +' + xp + ' XP.' + levelText(lv); }
  $('#bact').innerHTML = `<button class="big" id="bDone">Continue</button>`;
  log(summary);
  $('#bDone').onclick = () => { closeOv(); say(outcome === 'win' ? `${p.name} beat ${foe.name}!` : outcome === 'lose' ? `${p.name} lost to ${foe.name}.` : `${p.name} ran from ${foe.name}.`, outcome === 'win' ? 'happy' : null); };
}

// ================= DUNGEON: turn-based, procedurally generated floors =================
const DG = { W: 34, H: 26, FLOORS: 5, VW: 11, VH: 9, SIGHT: 4 };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let dg = null;
const dgImgs = {};

function dgImage(id){
  if (dgImgs[id]) return dgImgs[id];
  const im = new Image(); dgImgs[id] = im;
  const src = state.byId.get(id)?.image;
  if (src) processArt(src, retroOn ? 40 : 96, retroOn).then(u => { if (u) im.src = u; });
  return im;
}

function genFloor(){
  for (let attempt = 0; attempt < 20; attempt++){
    const W = DG.W, H = DG.H, map = new Uint8Array(W * H), rooms = [];
    for (let t = 0; t < 80 && rooms.length < 8; t++){
      const w = 4 + (Math.random() * 5 | 0), h = 3 + (Math.random() * 4 | 0);
      const x = 1 + (Math.random() * (W - w - 2) | 0), y = 1 + (Math.random() * (H - h - 2) | 0);
      if (rooms.some(r => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
      rooms.push({ x, y, w, h });
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j * W + i] = 1;
    }
    if (rooms.length < 4) continue;
    const ctr = r => [r.x + (r.w >> 1), r.y + (r.h >> 1)];
    const carve = (x1, y1, x2, y2) => {
      let x = x1, y = y1;
      const sx = () => { while (x !== x2){ x += Math.sign(x2 - x); map[y * W + x] = 1; } };
      const sy = () => { while (y !== y2){ y += Math.sign(y2 - y); map[y * W + x] = 1; } };
      if (Math.random() < 0.5){ sx(); sy(); } else { sy(); sx(); }
    };
    rooms.sort((a, b) => a.x - b.x);
    for (let i = 1; i < rooms.length; i++){ const a = ctr(rooms[i - 1]), b = ctr(rooms[i]); carve(a[0], a[1], b[0], b[1]); }
    for (let k = 0; k < 2; k++){ const r1 = pick(rooms), r2 = pick(rooms); if (r1 !== r2){ const a = ctr(r1), b = ctr(r2); carve(a[0], a[1], b[0], b[1]); } }
    return { map, rooms };
  }
  return null;
}

const dgFloor = (x, y) => x >= 0 && y >= 0 && x < DG.W && y < DG.H && dg.map[y * DG.W + x] === 1;
const dgRoomAt = (x, y) => dg.rooms.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
// the whole party explores together; you control one (dg.me) and the rest follow and fight
const dgAlive = () => dg.team.filter(u => u.hp > 0);
const dgMates = () => dg.team.filter(u => u.hp > 0 && u !== dg.me);
const dgIsMate = u => dg.team.includes(u);
function dgUnitAt(x, y){
  for (const u of dg.team) if (u.hp > 0 && u.x === x && u.y === y) return u;
  return dg.enemies.find(e => e.x === x && e.y === y) || null;
}
// nearest open floor tiles around the leader (for placing teammates)
function dgNearFree(n){
  const W = DG.W, q = [[dg.me.x, dg.me.y]], seen = new Set([dg.me.y * W + dg.me.x]), out = [];
  for (let qi = 0; qi < q.length && out.length < n && qi < 600; qi++){
    const [cx, cy] = q[qi];
    for (const d of Object.values(DIRS)){
      const nx = cx + d[0], ny = cy + d[1], k = ny * W + nx;
      if (seen.has(k) || !dgFloor(nx, ny)) continue;
      seen.add(k); q.push([nx, ny]);
      if (!dgUnitAt(nx, ny)) out.push([nx, ny]);
    }
  }
  return out;
}
function dgPlaceMates(){
  const mates = dgMates(); mates.forEach(u => { u.x = -9; u.y = -9; });
  const spots = dgNearFree(mates.length);
  mates.forEach((u, i) => { const p = spots[i] || [dg.me.x, dg.me.y]; u.x = p[0]; u.y = p[1]; });
}
function dgBestMove(u){ const i = u.moves.findIndex(mv => mv.cost > 0 && mv.kind !== 'guard'); return i >= 0 ? i : 0; }
// take control of another teammate (free action)
function dgLead(u, forced){
  if (!u || u.hp <= 0 || u === dg.me) return;
  dg.me = u; dg.sel = dgBestMove(u); if (!u.face) u.face = DIRS.down;
  dgLog(forced ? u.name + ' takes the lead!' : 'You switched to ' + u.name + '.');
  dgReveal(); dgDraw();
}
function dgCampfire(){
  dg.fire.used = true;
  for (const u of dgAlive()){ u.hp = Math.min(u.max, u.hp + Math.round(u.max * 0.3)); u.sp = Math.min(u.st.sp, u.sp + Math.round(u.st.sp * 0.3)); }
  let msg = '🔥 The team rested at the campfire and recovered some HP and SP.';
  const down = dg.team.find(u => u.hp <= 0);
  if (down){
    const spot = dgNearFree(1)[0];
    if (spot){ down.hp = Math.round(down.max * 0.4); down.sp = Math.round(down.st.sp * 0.5); down.x = spot[0]; down.y = spot[1]; msg += ' ' + down.name + ' was revived!'; }
  }
  dgLog(msg);
}
function dgFreeSpot(avoidRoom){
  for (let t = 0; t < 400; t++){
    const r = pick(dg.rooms); if (r === avoidRoom && dg.rooms.length > 1) continue;
    const x = r.x + (Math.random() * r.w | 0), y = r.y + (Math.random() * r.h | 0);
    if (!dgUnitAt(x, y) && !dg.items.some(i => i.x === x && i.y === y) && !(dg.stairs && dg.stairs.x === x && dg.stairs.y === y) && !(dg.fire && dg.fire.x === x && dg.fire.y === y)) return { x, y };
  }
  return null;
}
// one step along the shortest path from (sx,sy) toward (tx,ty), avoiding other units
function dgStep(u, tx, ty, maxR){
  const W = DG.W, start = u.y * W + u.x, goal = ty * W + tx;
  const prev = new Map([[start, -1]]), q = [start];
  for (let qi = 0; qi < q.length && qi < 900; qi++){
    const c = q[qi]; if (c === goal) break;
    const cx = c % W, cy = (c / W) | 0;
    for (const d of Object.values(DIRS)){
      const nx = cx + d[0], ny = cy + d[1], n = ny * W + nx;
      if (prev.has(n) || !dgFloor(nx, ny) || Math.abs(nx - u.x) + Math.abs(ny - u.y) > maxR) continue;
      const occ = dgUnitAt(nx, ny); if (occ && n !== goal) continue;
      prev.set(n, c); q.push(n);
    }
  }
  if (!prev.has(goal)) return null;
  let c = goal; while (prev.get(c) !== start && prev.get(c) !== -1) c = prev.get(c);
  if (prev.get(c) === -1) return null;
  return { x: c % W, y: (c / W) | 0 };
}

function dgUnit(id, name, st, attr, moves, hpScale){
  const hp = Math.max(1, Math.round(st.hp * (hpScale || 1)));
  return { id, name, st, attr, moves, hp, max: hp, sp: st.sp, x: 0, y: 0, img: dgImage(id) };
}

async function dungeon(diff){
  diff = diff || DIFFS[1];
  const p = P(); busy = true;
  openOv('<h4>Entering the dungeon…</h4><div class="status">Generating floor 1…</div>');
  const party = [p, ...G.party.filter(m => m !== p)];   // your active partner leads, everyone else comes along
  const details = await Promise.all(party.map(m => getDetail(m.id).catch(() => null)));
  for (const m of party) await syncMoves(m);
  dg = { stage: p.stage, diff, floors: diff.floors, floor: 0, data: 0, kos: 0, turn: 0, steps: 0, bag: { meat: 1, disk: 1 }, eggs: 0, over: false,
    team: party.map((m, i) => { const u = dgUnit(m.id, m.name, partnerStats(m), mainAttr(details[i]), partnerMoves(m), 1); u.ref = m; u.face = DIRS.down; u.elem = elemOf(details[i]); return applyPerks(u, m); }),
    me: null, log: [], sel: 0, fire: null, region: curRegion().key };
  dg.me = dg.team[0]; dg.sel = dgBestMove(dg.me);
  p.energy = clamp(p.energy - 30); saveGame();
  dgNextFloor();
  dgUI();
}

function dgNextFloor(){
  dg.floor++;
  const f = genFloor(); dg.map = f.map; dg.rooms = f.rooms;
  dg.seen = new Uint8Array(DG.W * DG.H); dg.enemies = []; dg.items = []; dg.stairs = null;
  const startRoom = dg.rooms[0];
  dg.me.x = startRoom.x + (startRoom.w >> 1); dg.me.y = startRoom.y + (startRoom.h >> 1);
  dg.fire = null; dgPlaceMates();
  dg.stairs = dgFreeSpot(startRoom);
  const fs = dgFreeSpot(); dg.fire = fs ? { x: fs.x, y: fs.y, used: false } : null;   // one campfire per floor
  // a few species per floor, from the leader's level
  const pool = regionPool(dg.stage);
  dg.species = [pick(pool), pick(pool), pick(pool)];
  const n = 3 + dg.floor;
  for (let i = 0; i < n; i++) dgSpawn(startRoom);
  dg.boss = null;
  if (evOn('boss') || dg.floor === dg.floors || (dg.floors >= 6 && dg.floor === Math.ceil(dg.floors / 2))) dgSpawnBoss(startRoom);
  const ni = 3 + (Math.random() * 3 | 0);
  for (let i = 0; i < ni; i++){
    const s = dgFreeSpot(); if (!s) continue;
    const r = Math.random();
    const type = dg.floor >= 3 && r < 0.04 * dg.diff.reward * (evOn('eggs') ? 3 : 1) * (1 + 0.15 * perk('eggs')) ? 'egg' : dg.floor >= 2 && r > 1 - 0.05 * dg.diff.reward * (dgTheme().relic || 1) ? 'relic' : r < 0.45 ? 'chip' : r < 0.75 ? 'meat' : 'disk';
    dg.items.push({ x: s.x, y: s.y, type });
  }
  dgSpecialRooms(startRoom);
  dgDecorate(startRoom);
  dgReveal();
  dgLog('Floor ' + dg.floor + ' of ' + dg.floors + '. Find the stairs!');
  if (dg.floor === 1 && dgTheme().note) dgLog(dgTheme().name + ': ' + dgTheme().note);
}

function dgSpawn(avoidRoom, at, house){
  if (!at && dg.enemies.length >= 9) return;
  const s = at || dgFreeSpot(avoidRoom); if (!s) return;
  const id = pick(dg.species), b = state.byId.get(id); if (!b) return;
  const base = baseStats(id, dg.stage), mine = partnerStats(P()), myBase = baseStats(P().id, P().stage);
  const scale = (1 + 0.07 * (dg.floor - 1)) * dg.diff.foe * curRegion().foe, st = {};
  STAT_KEYS.forEach(k => st[k] = Math.max(1, Math.round((base[k] + 0.25 * (mine[k] - myBase[k])) * scale)));
  const e = dgUnit(id, b.name, st, 'Free', foeMoves(id, null, dg.stage, dg.diff.lv), 0.45);
  e.x = s.x; e.y = s.y; e.awake = false; if (house) e.house = true;
  dg.enemies.push(e);
  getDetail(id).then(d => { e.attr = mainAttr(d); e.elem = elemOf(d); e.moves = foeMoves(id, d, dg.stage, dg.diff.lv); }).catch(() => {});
}

// optional boss: sleeps until you attack it or stand next to it; never chases you otherwise
function dgSpawnBoss(avoid){
  const s = dgFreeSpot(avoid); if (!s) return;
  const bs = Math.min(5, dg.stage + 1), pool = (state.stageIds[bs] || []).filter(id => state.byId.has(id)); if (!pool.length) return;
  const id = pick(pool), b = state.byId.get(id), base = baseStats(id, dg.stage), mine = partnerStats(P()), myBase = baseStats(P().id, P().stage);
  const scale = (1.2 + 0.07 * (dg.floor - 1)) * dg.diff.foe, st = {};
  STAT_KEYS.forEach(k => st[k] = Math.max(1, Math.round((base[k] + 0.3 * (mine[k] - myBase[k])) * scale)));
  const e = dgUnit(id, b.name, st, 'Free', foeMoves(id, null, bs, dg.diff.lv + 6), 2.2);
  e.x = s.x; e.y = s.y; e.awake = false; e.boss = true; dg.enemies.push(e); dg.boss = e;
  getDetail(id).then(d => { e.attr = mainAttr(d); e.elem = elemOf(d); e.moves = foeMoves(id, d, bs, dg.diff.lv + 6); }).catch(() => {});
  dgLog('⚠️ A boss sleeps on this floor. Wake it for a big reward, or take the stairs to skip it.');
}
function dgVisible(x, y){
  const m = dg.me, r = dgRoomAt(m.x, m.y);
  if (r && !dgTheme().dark && x >= r.x - 1 && x <= r.x + r.w && y >= r.y - 1 && y <= r.y + r.h) return true;
  return Math.max(Math.abs(x - m.x), Math.abs(y - m.y)) <= 2;
}
function dgReveal(){
  const m = dg.me, r = dgRoomAt(m.x, m.y);
  const mark = (x, y) => { if (x >= 0 && y >= 0 && x < DG.W && y < DG.H) dg.seen[y * DG.W + x] = 1; };
  if (r && !dgTheme().dark) for (let y = r.y - 1; y <= r.y + r.h; y++) for (let x = r.x - 1; x <= r.x + r.w; x++) mark(x, y);
  for (let y = m.y - 2; y <= m.y + 2; y++) for (let x = m.x - 2; x <= m.x + 2; x++) mark(x, y);
}

function dgLog(t){ dg.log.push(t); if (dg.log.length > 3) dg.log.shift(); const el = $('#dlog'); if (el) el.innerHTML = dg.log.map(esc).join('<br>'); }

// ----- range and aiming: energy/beam moves (MAG, DRAIN) fly up to 5 tiles at any enemy in sight; physical moves hit next to you -----
const DG_RANGE = 5;
const dgRanged = mv => mv && (mv.kind === 'mag' || mv.kind === 'drain');
const dgRange = mv => !mv || mv.kind === 'heal' || mv.kind === 'buff' || mv.kind === 'guard' ? 0 : dgRanged(mv) ? DG_RANGE : 1;
// a clear straight line between two tiles: no walls and nobody standing in between
function dgLine(ax, ay, bx, by){
  const n = Math.max(Math.abs(bx - ax), Math.abs(by - ay));
  for (let i = 1; i < n; i++){
    const x = Math.round(ax + (bx - ax) * i / n), y = Math.round(ay + (by - ay) * i / n);
    if (!dgFloor(x, y) || dgUnitAt(x, y)) return false;
  }
  return true;
}
const dgDist = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
// enemies a unit could hit with a move, nearest first
function dgTargets(u, mv, seenOnly){
  const r = dgRange(mv); if (!r) return [];
  return dg.enemies.filter(e => (!seenOnly || dgVisible(e.x, e.y)) && (r === 1 ? Math.abs(e.x - u.x) + Math.abs(e.y - u.y) === 1 : dgDist(u, e) <= r && dgLine(u.x, u.y, e.x, e.y)))
    .sort((a, b) => (Math.abs(a.x - u.x) + Math.abs(a.y - u.y)) - (Math.abs(b.x - u.x) + Math.abs(b.y - u.y)));
}
// is an enemy roughly in the direction a unit faces? (the bigger of the two offsets decides)
function dgInDir(u, e, dir){ const dx = e.x - u.x, dy = e.y - u.y; return Math.abs(dx) >= Math.abs(dy) ? dir[1] === 0 && Math.sign(dx) === dir[0] : dir[0] === 0 && Math.sign(dy) === dir[1]; }
// face toward a tile (the bigger of the two directions wins)
function dgFaceTo(u, t){ const dx = t.x - u.x, dy = t.y - u.y; u.face = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up); }
// the target the next attack will go for: the one you picked if it's still in reach, else whatever you're facing, else the nearest
function dgAim(m, mv){
  const ts = dgTargets(m, mv, true); if (!ts.length) return null;
  if (dg.tgt && ts.includes(dg.tgt)) return dg.tgt;
  const ahead = ts.find(e => dgInDir(m, e, m.face));
  return ahead || ts[0];
}
function dgHit(att, def, mv){
  const r = doMove(att, def, mv);
  dgLog(r.text);
  if (def.boss && !def.awake){ def.awake = true; dgLog('👑 ' + def.name + ' woke up!'); }
  if (def.house) def.awake = true;
  if (r.dmg){ def.flash = 3; if (def.hp <= 0) dgDown(def, att); }
}
function dgDown(u, by){
  if (dgIsMate(u)){
    u.hp = 0;
    dgLog(u.name + ' fainted and is out for the rest of this run' + (dg.fire && !dg.fire.used ? ' (a campfire can revive it).' : '.'));
    if (u === dg.me){ const next = dgMates()[0]; if (!next){ dgEnd('faint'); return; } dgLead(next, true); }
    return;
  }
  dg.enemies = dg.enemies.filter(e => e !== u);
  dg.kos++; const gain = Math.round((3 + dg.stage * 2) * dg.diff.reward); dg.data += gain;
  if (!G.col[u.id]) G.col[u.id] = 'seen';
  dgLog(u.name + ' was defeated! +' + gain + ' DigiData.');
  if (u.house && dg.mroomHit && !dg.enemies.some(e => e.house)){ const bonus = Math.round(25 * (dg.stage + 1) * dg.diff.reward); dg.data += bonus; dgLog('🏆 Monster House cleared! +' + bonus + ' DigiData.'); }
  if (u.boss){
    bump('bosses'); const bonus = Math.round(60 * (dg.stage + 1) * dg.diff.reward * (evOn('boss') ? 1.5 : 1)); dg.data += bonus;
    const drop = pick([randomCrest() || randomHeld(), randomHeld(), pick(['egg:rare', 'egg:champion', 'egg:golden', 'egg:xegg'])]); (dg.relics = dg.relics || []).push(drop);
    dgLog('👑 Boss defeated! +' + bonus + ' DigiData and a ' + itemName(drop) + '!'); dg.boss = null;
  }
}

// one player action, then everyone else moves
function dgAct(action, dir){
  if (!dg || dg.over || dg.busy) return;
  const m = dg.me;
  if (action === 'move' && dg.turnMode){ m.face = dir; dg.tgt = dgTargets(m, m.moves[dg.sel] || m.moves[0], true).find(e => dgInDir(m, e, dir)) || null; dgDraw(); return; }
  m.guard = false;
  if (m.status){
    const stt = statusTurn(m); if (stt.text) dgLog(stt.text);
    if (m.hp <= 0){ dgDown(m); if (!dg.over) dgDraw(); return; }
    if (stt.skip){ dgWorld(); dgReveal(); dgDraw(); return; }
  }
  if (action === 'move'){
    m.face = dir;
    const nx = m.x + dir[0], ny = m.y + dir[1], occ = dgUnitAt(nx, ny);
    if (occ && !dgIsMate(occ)) dgHit(m, occ, m.moves[0]);
    else if (!dgFloor(nx, ny)) { dgDraw(); return; }
    else {
      if (occ){ occ.x = m.x; occ.y = m.y; }   // swap places with a teammate
      m.x = nx; m.y = ny; dg.steps++;
      const it = dg.items.find(i => i.x === nx && i.y === ny);
      if (it && it.type === 'chest' && !dg.keys) dgLog('🧰 The chest is locked. Find the 🗝️ key on this floor.');
      else if (it){ dg.items = dg.items.filter(i => i !== it); dgPickup(it); }
      if (dg.fire && !dg.fire.used && dg.fire.x === nx && dg.fire.y === ny) dgCampfire();
      dgTileStep(m); dgMonsterHouse();
    }
  } else if (action === 'skill'){
    const mv = m.moves[dg.sel] || m.moves[0];
    if ((mv.cost || 0) > m.sp){ dgLog('Not enough SP for ' + mv.name + '.'); return; }
    if (mv.kind === 'heal' || mv.kind === 'buff' || mv.kind === 'guard') dgHit(m, m, mv);
    else {
      const target = dgAim(m, mv);
      if (!target){ dgLog(dgRanged(mv) ? 'No enemy in sight within ' + DG_RANGE + ' tiles for ' + mv.name + '.' : 'No enemy next to ' + m.name + ' for ' + mv.name + '. Try a ranged move.'); dgDraw(); return; }
      dgFaceTo(m, target); dg.tgt = target;
      dgHit(m, target, mv);
    }
  } else if (action === 'meat'){
    if (!dg.bag.meat) return;
    dg.bag.meat--; const h = Math.round(m.max * 0.4); m.hp = Math.min(m.max, m.hp + h); P().hunger = clamp(P().hunger + 25);
    dgLog(m.name + ' ate meat. +' + h + ' HP, belly filled.');
  } else if (action === 'disk'){
    if (!dg.bag.disk) return;
    dg.bag.disk--; const s = Math.round(m.st.sp * 0.6); m.sp = Math.min(m.st.sp, m.sp + s);
    dgLog('Used an SP Disk. +' + s + ' SP.');
  }
  if (dg.over) return;
  if (dg.stairs && m.x === dg.stairs.x && m.y === dg.stairs.y){
    if (dg.floor >= dg.floors){ dgEnd('clear'); return; }
    dgLog('Found the stairs!'); dgNextFloor(); dgDraw(); return;
  }
  dgWorld();
  dgReveal(); dgDraw();
}

function dgPickup(it){
  if (it.type === 'chip'){ const v = Math.round((6 + dg.stage * 4 + (Math.random() * 6 | 0)) * dg.diff.reward * (dgTheme().chip || 1)); dg.data += v; dgLog('Picked up a Data Chip: +' + v + ' DigiData.'); }
  else if (it.type === 'meat'){ dg.bag.meat++; dgLog('Picked up some meat.'); }
  else if (it.type === 'disk'){ dg.bag.disk++; dgLog('Picked up an SP Disk.'); }
  else if (it.type === 'egg'){ dg.eggs++; dgLog('Found a Mystery Egg!'); }
  else if (it.type === 'relic'){ const k = randomDigimental(); (dg.relics = dg.relics || []).push(k); dgLog('Found a ' + itemName(k) + '!'); }
  else if (it.type === 'key'){ dg.keys = (dg.keys || 0) + 1; dgLog('🗝️ Found a key! Now find the treasure chest.'); }
  else if (it.type === 'chest'){
    dg.keys--; const got = [], v = Math.round((25 + dg.stage * 15) * dg.diff.reward * (dgTheme().chip || 1)); dg.data += v; got.push('+' + v + ' DigiData');
    const roll = Math.random(); let k = null;
    if (roll < 0.15){ dg.eggs++; got.push('a Mystery Egg'); } else if (roll < 0.35) k = randomHeld(); else if (roll < 0.75) k = randomDigimental(); else k = randomChip();
    if (k){ (dg.relics = dg.relics || []).push(k); got.push(itemName(k)); }
    dg.bag.meat++; got.push('some meat');
    dgLog('🧰 Opened the chest: ' + got.join(', ') + '!');
  }
}

function dgWorld(){
  dg.turn++;
  const m = dg.me;
  // teammates: fight whatever is next to them, otherwise follow the leader
  for (const a of dgMates()){
    if (dg.over) return;
    if (a.status){ const stt = statusTurn(a); if (stt.text) dgLog(stt.text); if (a.hp <= 0){ dgDown(a); continue; } if (stt.skip) continue; }
    const foe = dg.enemies.find(e => Math.abs(e.x - a.x) + Math.abs(e.y - a.y) === 1);
    a.guard = false;
    const shot = !foe && a.moves.filter(mv => dgRanged(mv) && (mv.cost || 0) <= a.sp).sort((x, y) => y.power - x.power)[0];
    const far = shot && dgTargets(a, shot, true)[0];
    if (foe) dgHit(a, foe, foeChoice(a, foe));
    else if (far){ dgFaceTo(a, far); dgHit(a, far, shot); }
    else if (Math.abs(a.x - m.x) + Math.abs(a.y - m.y) > 1){ const s = dgStep(a, m.x, m.y, 20); if (s){ a.x = s.x; a.y = s.y; } }
  }
  if (dg.over) return;
  for (const e of dg.enemies.slice()){
    if (dg.over) return;
    if (!dg.enemies.includes(e)) continue;
    e.guard = false;
    if (e.status){ const stt = statusTurn(e); if (stt.text && dgVisible(e.x, e.y)) dgLog(stt.text); if (e.hp <= 0){ dgDown(e, null); continue; } if (stt.skip) continue; }
    const targets = dgAlive(); if (!targets.length) return;
    if (e.house && !e.awake) continue;
    if (e.boss && !e.awake){ if (targets.some(u => Math.abs(u.x - e.x) + Math.abs(u.y - e.y) === 1)){ e.awake = true; dgLog('👑 ' + e.name + ' woke up!'); } continue; }
    const t = targets.sort((u, v) => (Math.abs(u.x - e.x) + Math.abs(u.y - e.y)) - (Math.abs(v.x - e.x) + Math.abs(v.y - e.y)))[0];
    const dist = Math.abs(t.x - e.x) + Math.abs(t.y - e.y);
    if (dist <= 7 || dgRoomAt(e.x, e.y) && dgRoomAt(e.x, e.y) === dgRoomAt(m.x, m.y)) e.awake = true;
    if (dist === 1){ dgHit(e, t, foeChoice(e, t)); continue; }
    if (e.awake){ const s = dgStep(e, t.x, t.y, 14); if (s){ e.x = s.x; e.y = s.y; } }
    else if (Math.random() < 0.5){ const d = pick(Object.values(DIRS)); if (dgFloor(e.x + d[0], e.y + d[1]) && !dgUnitAt(e.x + d[0], e.y + d[1])){ e.x += d[0]; e.y += d[1]; } }
  }
  // regen, belly, reinforcements
  if (dg.turn % 4 === 0){ for (const u of dgAlive()) if (u.hp < u.max) u.hp++; }
  if (dg.turn % 6 === 0){ for (const u of dgAlive()) if (u.sp < u.st.sp) u.sp++; }
  const p = P(); p.hunger = clamp(p.hunger - 0.1);
  if (p.hunger <= 0 && dg.me.hp > 0){ const lead = dg.me; lead.hp = Math.max(0, lead.hp - 1); if (dg.turn % 5 === 0) dgLog('The team is starving!'); if (lead.hp <= 0) dgDown(lead); }
  if (dg.turn % 30 === 0) dgSpawn(dgRoomAt(m.x, m.y));
}

function dgEnd(result){
  if (dg.over) return;
  dg.over = true;
  const p = P(), r = dg;
  let data = r.data, evo = Math.floor(r.kos / 2), eggs = r.eggs, title, note;
  if (result === 'clear'){
    data += Math.round((30 * (r.stage + 1) + 10 * r.floors) * r.diff.reward); evo += Math.round(5 * r.diff.reward);
    if (Math.random() < r.diff.egg * (evOn('eggs') ? 1.5 : 1) * (1 + 0.15 * perk('eggs'))){ if (r.diff.rare && Math.random() < 0.5) r.rareEgg = true; else eggs++; }
    p.mood = clamp(p.mood + 15); title = 'Dungeon cleared!'; p.stageWins = (p.stageWins || 0) + 1; questProgress('dungeon');
    bump('dungeons'); if (r.diff.key === 'nightmare') bump('nightmare'); r.team.forEach(u => addBond(u.ref, 2));
    const crestOdds = { hard: 0.2, nightmare: 0.4 }[r.diff.key] || 0;
    if (Math.random() < crestOdds){ const ck = randomCrest() || randomDigimental(); (r.relics = r.relics || []).push(ck); }
    note = 'You made it through all ' + r.floors + ' floors on ' + r.diff.name + '.' + (r.rareEgg ? ' You found a Rare Mystery Egg!' : '');
  } else if (result === 'faint'){
    data = Math.floor(data / 2); eggs = 0; p.mood = clamp(p.mood - 15); title = 'Knocked out'; r.relics = [];
    note = 'Your whole team fainted on floor ' + r.floor + '. Half the DigiData and any eggs or items were lost.';
  } else { title = 'Left the dungeon'; note = 'You escaped from floor ' + r.floor + ' with everything you found.'; }
  if (r.team.some(u => heldOf(u.ref) === 'h:charm')) data = Math.round(data * 1.3);
  data = Math.round(data * curRegion().reward * (evOn('data') ? 2 : 1) * (1 + 0.1 * perk('scav')));
  G.data += data; p.evo += evo; for (let i = 0; i < eggs; i++) G.eggs.push('mystery');
  if (r.rareEgg && result === 'clear'){ G.eggs.push('rare'); eggs++; }
  if (r.kos) questProgress('ko', r.kos);
  const relics = r.relics || []; relics.forEach(k => grantItem(k));
  if (relics.length) note += ' Items: ' + relics.map(itemName).join(', ') + '.';
  const xp = Math.round((r.kos * (3 + 2 * r.stage) + (result === 'clear' ? 20 + 10 * r.stage : 0)) * (result === 'faint' ? 0.5 : 1) * r.diff.reward);
  // every teammate who fainted along the way takes a loss; teammates still standing get full XP, fainted ones half
  for (const u of r.team) if (u.hp <= 0) u.ref.stageLosses = (u.ref.stageLosses || 0) + 1;
  const downs = r.team.filter(u => u.hp <= 0 && result !== 'faint').map(u => u.name);
  if (downs.length) note += ' Fainted along the way: ' + downs.join(', ') + '.';
  for (const u of r.team){
    const gx = u.hp > 0 || result === 'faint' ? xp : Math.round(xp / 2);
    if (!gx) continue;
    const pr = gainXP(u.ref, gx);
    if (u.ref === p) pr.then(lv => { const el = $('#dgLv'); if (el) el.textContent = '+' + gx + ' XP' + (r.team.length > 1 ? ' each (half for fainted teammates).' : '.') + levelText(lv); });
  }
  saveGame();
  const sheet = $('#overlay .sheet');
  if (sheet) sheet.innerHTML = '<h4>' + title + '</h4><p style="margin:0;color:var(--muted)">' + esc(note) + '</p>' +
    '<div class="wallet" style="justify-content:space-between"><span>Defeated <b>' + r.kos + '</b></span><span>DigiData <b>+' + data + '</b></span><span>Evo <b>+' + evo + '</b></span>' + (eggs ? '<span>Eggs <b>+' + eggs + '</b></span>' : '') + '</div>' +
    '<p id="dgLv" style="margin:0;font-size:.88rem"></p><button class="big" id="dgDone">Continue</button>';
  const b = $('#dgDone'); if (b) b.onclick = () => { closeOv(); dg = null; say(result === 'clear' ? p.name + ' cleared the dungeon!' : result === 'faint' ? p.name + ' needs some rest after the dungeon.' : p.name + ' came back from the dungeon.', result === 'clear' ? 'happy' : null); };
}

const dgKeys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
document.addEventListener('keydown', e => {

  else if (dgKeys[e.key]){ e.preventDefault(); dgAct('move', DIRS[dgKeys[e.key]]); }

});

  if (!ts.length){ dgLog('No enemy in reach of ' + mv.name + '.'); return; }
  const cur = dgAim(dg.me, mv); dg.tgt = ts[(ts.indexOf(cur) + 1) % ts.length]; dgFaceTo(dg.me, dg.tgt); dgDraw();

  const ox = Math.max(0, Math.min(DG.W - DG.VW, m.x - (DG.VW >> 1))), oy = Math.max(0, Math.min(DG.H - DG.VH, m.y - (DG.VH >> 1)));

// ----- digivolution requirements: stats, items (Digimentals, Crests, X-Antibody), DNA partners and care -----

const HOLY_RE = /Ange|Holy|Seraph|Ofani|Saint|Magnamon|Cherubi|Kerubi|Dominimon|Clavis|Darcmon|Pidmon|Sleipmon|Hououmon|Unimon|Pegasmon|Nefertimon/;
const ITEM_PRICE = { dm: 120, crest: 450, xab: 200, clean: 150, vit: 90, all: 400 };
const CHIP_KEYS = ['atk', 'int', 'def', 'spd', 'hp', 'sp'];
// how much a stat chip adds, scaled to the Digimon's stage
function chipGain(k, stage){ return { atk: 2 + stage, int: 2 + stage, def: 2 + stage, spd: 1 + stage, hp: 10 + 5 * stage, sp: 3 + stage }[k]; }
const itemPrice = k => salePrice(itemBasePrice(k));
const itemBasePrice = k => k === 'pers:?' ? 150 : k.startsWith('pers:') ? 350 : k.startsWith('h:') ? (HELD[k].price || 600) : k === 'vit:all' ? ITEM_PRICE.all : ITEM_PRICE[itemType(k)];
const randomChip = () => Math.random() < 0.08 ? 'vit:all' : 'vit:' + pick(CHIP_KEYS);
const virtue = w => { w = String(w || '').replace(/[^A-Za-z]/g, ''); w = w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); return VIRTUE_ALIAS[w] || (VIRTUES.includes(w) ? w : 'Miracles'); };
const itemType = k => k.split(':')[0];
const itemName = k => k.startsWith('egg:') ? eggName(k.slice(4)) : k === 'pers:?' ? 'Mystery Mint' : k.startsWith('pers:') ? (PERS[k.slice(5)] ? PERS[k.slice(5)].name + ' Mint' : 'Mint') : k.startsWith('h:') ? (HELD[k] ? HELD[k].name : 'Held item') : k === 'egg:rare' ? 'Rare Mystery Egg' : k === 'xab' ? 'X-Antibody' : k === 'clean' ? 'Clean Slate' : k === 'vit:all' ? 'Ultimate Chip' : itemType(k) === 'vit' ? STAT_LABEL[k.split(':')[1]] + ' Chip' : (itemType(k) === 'dm' ? 'Digimental of ' : 'Crest of ') + k.split(':')[1];
const itemIcon = k => k.startsWith('egg:') ? '🥚' : k === 'pers:?' ? '🎲' : k.startsWith('pers:') ? '🌿' : k.startsWith('h:') ? (HELD[k] ? HELD[k].icon : '🎒') : k === 'egg:rare' ? '🥚' : k === 'xab' ? '🧬' : k === 'clean' ? '🕊️' : k === 'vit:all' ? '🌟' : itemType(k) === 'vit' ? '💾' : itemType(k) === 'dm' ? '🥚' : '🔰';
const itemUsable = k => k === 'clean' || itemType(k) === 'vit' || itemType(k) === 'pers';

function nameId(n){
  if (!state.nameMap || state.nameMap.size === 0) state.nameMap = new Map((state.all || []).map(d => [d.name.toLowerCase(), d.id]));
  return state.nameMap.get(String(n).trim().replace(/^(the|a|an) /i, '').toLowerCase());

// a stat goal that matches what the next form is good at
function statReq(to, s){
  const r = Math.abs(seeded(to, 47));
  const k = r < 0.15 ? 'atk' : r < 0.3 ? 'int' : r < 0.5 ? 'def' : r < 0.67 ? 'spd' : r < 0.84 ? 'hp' : 'sp';
  const extra = { atk: 3 + 3 * s, int: 3 + 3 * s, def: 3 + 3 * s, spd: 2 + 2 * s, hp: 15 + 10 * s, sp: 4 + 2 * s }[k];
  return { t: 'stat', k, v: STAT_BASE[k][s] + extra };

// requirements for evolving into `to` from stage `s`, built from the API's evolution conditions plus a fixed per-species roll
function reqsFor(to, cond, s){
  const name = state.byId.get(to)?.name || '', c = String(cond || ''), q = [];
  if (s < 2) return q;                       // Fresh and In-Training digivolve freely
  if (state.armor.has(to) && s === 2){
    const m = c.match(/Digimentals? of (\w+)/i);
    q.push({ t: 'item', key: 'dm:' + (m ? virtue(m[1]) : DIGIMENTAL_OF[name] || VIRTUES[Math.floor(Math.abs(seeded(to, 31)) * VIRTUES.length)]) });
    return q;                                // Armor forms just need their Digimental
  }
  const bad = /Dark Evolution|Death Evolution/i.test(c);
  if (CREST_OF[name]) CREST_OF[name].forEach(v => q.push({ t: 'item', key: 'crest:' + v }));
  else { const m = !bad && c.match(/Crest of (\w+)/i); if (m) q.push({ t: 'item', key: 'crest:' + virtue(m[1]) }); }
  if (/\(X-Antibody\)/.test(name)) q.push({ t: 'item', key: 'xab' });
  // DNA digivolution: "with Tailmon" means a Tailmon has to be with you
  if (/^with (?!or without)/i.test(c) && !/Digimental|Crest|Spirit|X-Antibody|Card Game|Vital Bracelet|Pendulum|Every Digimon|Evolution|certain/i.test(c)){
    const ids = [...new Set(c.replace(/^with /i, '').split(/,\s*(?:or |and )?|\s+or\s+|\s+and\s+/).map(nameId).filter(id => id && id !== to))];
    if (ids.length) q.push({ t: 'dna', ids: ids.slice(0, 4) });
  }
  const r = Math.abs(seeded(to, 41));
  if (JUNK_RE.test(name) || bad) q.push({ t: 'bad', n: 3 });
  else if (DARK_RE.test(name)) q.push({ t: 'bad', n: 2 });
  else if (HOLY_RE.test(name)) q.push({ t: 'clean' });
  else if (r < 0.36) q.push(statReq(to, s));
  else if (r < 0.48) q.push({ t: 'wins', n: [0, 0, 3, 5, 7, 10][s] });
  else if (r < 0.56) q.push({ t: 'clean' });
  else if (r < 0.6) q.push({ t: 'bad', n: 2 });
  if (s >= 4 && !q.some(x => x.t === 'stat')) q.push(statReq(to, s));   // Megas always need real strength
  const rb = Math.abs(seeded(to, 53)); if ((s >= 4 && rb < 0.3) || (s === 3 && rb < 0.12)) q.push({ t: 'bond', n: s >= 4 ? 70 : 40 });
  return q;
}
// the forms a Digimon can reach next (Rookies can also armor-digivolve)
function nextCands(d, stage){
  const seen = new Set();
  const all = (d.nextEvolutions || []).map(e => ({ id: evoId(e), name: e.digimon, image: e.image, cond: e.condition || '' }))
    .filter(e => e.id && state.byId.has(e.id) && !seen.has(e.id) && seen.add(e.id));
  let c = all.filter(e => inStage(e.id, stage + 1) || (stage === 2 && state.armor.has(e.id)));
  if (!c.length) c = all.filter(e => higherStage(e.id, stage) !== undefined);
  return c;
}
// every line keeps at least one open path so a partner can never get stuck
function pathReqs(fromId, s, cands){
  const m = new Map();
  for (const c of cands) m.set(c.id, reqsFor(c.id, c.cond, s));
  if (cands.length && !cands.some(c => !m.get(c.id).length)){
    const pool = cands.filter(c => !(state.armor.has(c.id) && s === 2)).sort((a, b) => seeded(a.id, 43) - seeded(b.id, 43));
    if (pool[0]) m.set(pool[0].id, []);

}
function failures(p){ return (p.stageMistakes || 0) + (p.stageLosses || 0); }

  if (q.t === 'item') return hasItem(q.key);

  if (q.t === 'dna') return [...G.party, ...G.box].some(m => m !== p && q.ids.includes(m.id));
  if (q.t === 'wins') return (p.stageWins || 0) >= q.n;
  if (q.t === 'clean') return failures(p) === 0;
  if (q.t === 'bad') return failures(p) >= q.n;

}

      p.pers = nk; note = p.name + ' went from ' + PERS[old].name + ' to ' + PERS[nk].name + '! (' + PERS[nk].desc + ')';
    }
    else if (k === 'clean'){ if (!failures(p)) return; const n = failures(p); p.stageMistakes = 0; p.stageLosses = 0; note = 'Cleared ' + n + ' failure' + (n === 1 ? '' : 's') + '. ' + p.name + ' gets a fresh start this stage.'; }
    else {
      const g = growthOf(p), keys = k === 'vit:all' ? CHIP_KEYS : [k.split(':')[1]], parts = [];
      for (const s of keys){ const v = k === 'vit:all' ? Math.ceil(chipGain(s, p.stage) / 2) : chipGain(s, p.stage); g[s] = (g[s] || 0) + v; parts.push('+' + v + ' ' + STAT_LABEL[s]); }
      note = p.name + ' used the ' + itemName(k) + ': ' + parts.join(', ') + '.';
    }
    G.items[k]--; saveGame();
    bagScreen(note);
  });
}

// ----- quests: 3 slots, +1 each at 50 / 100 / 200 Digimon found; free refresh every hour, paid refreshes cost more each time -----
const QUEST_UNLOCKS = [50, 100, 200];
const QUEST_TYPES = [
  { t: 'win', min: 3, max: 6, per: 22, text: n => 'Win ' + n + ' battles' },
  { t: 'winHard', min: 1, max: 3, per: 65, text: n => 'Win ' + n + ' battle' + (n === 1 ? '' : 's') + ' on Hard or Nightmare' },
  { t: 'dungeon', min: 1, max: 2, per: 95, text: n => 'Clear ' + n + ' dungeon' + (n === 1 ? '' : 's') },
  { t: 'ko', min: 8, max: 20, per: 6, text: n => 'Defeat ' + n + ' foes in dungeons' },
  { t: 'train', min: 3, max: 6, per: 16, text: n => 'Train ' + n + ' times' },
  { t: 'perfect', min: 1, max: 3, per: 45, text: n => 'Get ' + n + ' perfect training' + (n === 1 ? '' : 's') + ' (3 of 3 hits)' },
  { t: 'exp', min: 1, max: 3, per: 50, text: n => 'Finish ' + n + ' expedition' + (n === 1 ? '' : 's') },
  { t: 'evolve', min: 1, max: 1, per: 130, text: () => 'Digivolve a Digimon' },
  { t: 'care', min: 4, max: 8, per: 9, text: n => 'Feed or play with your partners ' + n + ' times' },
  { t: 'hatch', min: 1, max: 1, per: 70, text: () => 'Hatch an egg' },
  { t: 'discover', min: 2, max: 5, per: 35, text: n => 'Discover ' + n + ' new Digimon' },
];
const foundCount = () => Object.keys(G.col).length;
const questSlots = () => 3 + QUEST_UNLOCKS.filter(n => foundCount() >= n).length;
const hourKey = () => Math.floor(Date.now() / 3600000);
const questRefreshCost = () => 50 + 50 * (G.quests.paid || 0);
function makeQuest(avoid){
  const pool = QUEST_TYPES.filter(q => !avoid.includes(q.t));
  const T = pick(pool.length ? pool : QUEST_TYPES), n = T.min + Math.floor(Math.random() * (T.max - T.min + 1));
  const r = Math.random(), item = r < 0.12 ? 'egg' : r < 0.3 ? 'clean' : r < 0.55 ? randomChip() : r < 0.65 ? randomDigimental() : null;
  return { t: T.t, n, prog: 0, base: T.t === 'discover' ? foundCount() : 0, data: Math.round(T.per * n * (0.9 + Math.random() * 0.3) / 5) * 5, item };
}
function questInit(){
  if (!G.quests || !Array.isArray(G.quests.list)) G.quests = { list: [], hour: hourKey(), freeUsed: false, paid: 0 };
  const Q = G.quests;
  if (Q.hour !== hourKey()){ Q.hour = hourKey(); Q.freeUsed = false; Q.paid = 0; }   // new hour: free refresh back, price resets
  while (Q.list.length < questSlots()) Q.list.push(makeQuest(Q.list.filter(Boolean).map(q => q.t)));
}
const questProg = q => q.t === 'discover' ? Math.max(0, foundCount() - q.base) : q.prog;
const questDone = q => q && !q.claimed && questProg(q) >= q.n;
function questProgress(t, amount){
  if (!G.quests) return;
  let hit = false;
  for (const q of G.quests.list) if (q && q.t === t && !q.claimed && q.prog < q.n){ q.prog = Math.min(q.n, q.prog + (amount || 1)); hit = true; }
  if (hit){ saveGame(); updateQuestBadge(); }
}
function updateQuestBadge(){
  const t = $('#tabQuests'); if (!t || !G.quests) return;
  const n = G.quests.list.filter(questDone).length;
  t.textContent = n ? 'Quests · ' + n : 'Quests';
}
function rewardText(q){ return '+' + q.data + ' DigiData' + (q.item ? ' · ' + (q.item === 'egg' ? '🥚 Mystery Egg' : itemIcon(q.item) + ' ' + itemName(q.item)) : ''); }
// replaces every quest except finished ones you haven't claimed yet
function rerollQuests(){
  const Q = G.quests, keep = Q.list.map(q => questDone(q) || (q && q.locked) ? q : null);
  Q.list = keep.map(q => q || null);
  for (let i = 0; i < Q.list.length; i++) if (!Q.list[i]) Q.list[i] = makeQuest(Q.list.filter(Boolean).map(x => x.t));
}
function renderQuests(msg){
  questInit(); updateQuestBadge();
  if (state.tab !== 'quests') return;
  const Q = G.quests, slots = questSlots(), cost = questRefreshCost(), found = foundCount();
  const nextHour = (hourKey() + 1) * 3600000 - Date.now();
  const card = (q, i) => {
    if (!q) return '<div class="quest empty"><b>Quest complete</b><small>A new quest arrives when you refresh.</small></div>';
    const T = QUEST_TYPES.find(x => x.t === q.t), p = Math.min(q.n, questProg(q)), done = questDone(q);
    return '<div class="quest' + (q.claimed ? ' claimed' : done ? ' done' : '') + (q.locked ? ' kept' : '') + '"><div class="qtop"><b>' + esc(T.text(q.n)) + '</b><span>' + p + ' / ' + q.n + '</span>' +
      '<button class="qlock" data-lock="' + i + '" aria-pressed="' + !!q.locked + '" aria-label="' + (q.locked ? 'Unlock quest' : 'Lock quest') + '">' + (q.locked ? '🔒' : '🔓') + '</button></div>' +
      '<div class="evotrack"><i style="width:' + (p / q.n * 100) + '%"></i></div>' +
      '<div class="qbot"><small>' + esc(rewardText(q)) + '</small>' + (done ? '<button class="act" data-claim="' + i + '">Claim</button>' : '') + '</div></div>';
  };
  const locked = QUEST_UNLOCKS.filter(n => found < n).map(n => '<div class="quest locked"><b>🔒 Locked slot</b><small>Unlocks at ' + n + ' Digimon found (' + found + ' / ' + n + ')</small><div class="evotrack"><i style="width:' + Math.min(100, found / n * 100) + '%"></i></div></div>');
  $('#questsView').innerHTML = '<div class="ptop"><h2>Quests</h2></div>' +
    '<div class="wallet"><span>Slots <b>' + slots + ' / 6</b></span><span>Found <b>' + found + '</b></span><span>DigiData <b>' + G.data.toLocaleString() + '</b></span></div>' +
    '<div class="quests">' + Q.list.map(card).join('') + locked.join('') + '</div>' +
    '<div class="qrefresh">' + (Q.freeUsed

    '<p class="ownline">Refreshing replaces every quest except locked ones (🔒) and finished ones waiting to be claimed. Tap 🔓 on a quest to lock it. The refresh price goes back to ' + 50 + ' at the top of every hour. Unlock more quest slots by finding Digimon (battles, hatching, digivolving and expeditions all count).</p>' +
    '<p id="qMsg" style="margin:0;min-height:1.3em;font-size:.88rem">' + esc(msg || '') + '</p>';
  $('#questsView').querySelectorAll('[data-claim]').forEach(b => b.onclick = () => {
    const q = Q.list[+b.dataset.claim]; if (!questDone(q)) return;

  });
  $('#questsView').querySelectorAll('[data-lock]').forEach(b => b.onclick = () => {

  });
  const f = $('#qFree'); if (f) f.onclick = () => { if (Q.freeUsed) return; Q.freeUsed = true; rerollQuests(); saveGame(); renderQuests('New quests are in!'); };
  const pd = $('#qPaid'); if (pd) pd.onclick = () => { const c = questRefreshCost(); if (G.data < c) return; G.data -= c; Q.paid = (Q.paid || 0) + 1; rerollQuests(); saveGame(); updateCount(); renderQuests('Refreshed for ' + c + ' DigiData.'); };
}

// ----- digivolution along the real evo lines -----
async function digivolve(){
  const p = P(); if (busy || !canEvolve(p)) return;
  busy = true;
  openOv('<h4>' + esc(p.name) + ' is digivolving…</h4><div class="status">Reading its evolution line…</div>');
  let d;
  try{ d = await getDetail(p.id); }
  catch(e){ $('#overlay .sheet').innerHTML = '<h4>Connection problem</h4><p>Couldn\'t load ' + esc(p.name) + '\'s evolutions (' + esc(e.message) + ').</p><button class="big" id="ovClose">Close</button>'; $('#ovClose').onclick = closeOv; return; }
  const cands = nextCands(d, p.stage);
  if (!cands.length){
    p.final = true; saveGame();
    $('#overlay .sheet').innerHTML = '<h4>No further forms</h4><p>' + esc(p.name) + ' has no recorded evolution to the next stage, so this is its final form.</p><button class="big" id="ovClose">OK</button>';
    $('#ovClose').onclick = () => { closeOv(); renderPartner(); };

  }
  const reqMap = pathReqs(p.id, p.stage, cands);

  // every path whose requirements are met can be chosen: unlocked special paths first, then new forms, then ones you've raised
  const free = rows.filter(x => !x.rq.length);

  const rank = x => (known(x.c.id) ? 0 : 1) + (raised(x.c.id) ? 2 : 0);
  const options = [...special, ...free.sort((a, b) => rank(a) - rank(b) || a.c.name.localeCompare(b.c.name))];
  const locked = rows.filter(x => x.miss).sort((a, b) => a.miss - b.miss);
  const careNote = options.length + ' path' + (options.length === 1 ? '' : 's') + ' open. Choose its form!';
  const choice = x => { const r = raised(x.c.id), k = known(x.c.id);
    return '<button class="choice' + (x.rq.length ? ' special' : '') + '" data-pick="' + x.c.id + '">' + pathImg(x.c) + '<b>' + (k ? esc(x.c.name) : '???') + '</b>' +
      (r ? '<small>✓ raised before</small>' : k ? '<small>seen in battle</small>' : '') + reqChips(x.rq, p) + '</button>'; };
  $('#overlay .sheet').innerHTML = '<h4>' + esc(p.name) + ' is ready!</h4>' +
    '<p style="margin:0;color:var(--muted)">' + careNote + (special.length ? ' ' + special.length + ' special path' + (special.length === 1 ? '' : 's') + ' unlocked (highlighted).' : '') + ' ' + cands.length + ' possible forms in total.</p>' +
    (options.length ? '<div class="choices">' + options.map(choice).join('') + '</div>' : '<p style="margin:0">No path is open yet. Meet one of the requirements below, then try again.</p>') +
    (locked.length ? '<h5 class="lockh">🔒 Locked paths · ' + locked.length + '</h5><div class="lrows">' + locked.slice(0, 6).map(x => pathRow(x, p)).join('') + '</div>' +
      (locked.length > 6 ? '<p class="ownline">See all ' + locked.length + ' in 🧬 Evolution paths.</p>' : '') : '') +
    '<button class="ghost" id="evoLater">Not yet</button>';
  $('#evoLater').onclick = () => { closeOv(); renderPartner(); };
  $('#overlay').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => evolveTo(+b.dataset.pick, reqMap.get(+b.dataset.pick)));
}

// ---------- image processing: cut out the white background, optional retro pixel look ----------
// Done on this device from the official art; silhouettes need the cutout so they show a shape, not a square.
const IMG_SEL = '.tthumb img, .thead img, .lrow img, .bcell img, .bhead img, .slot img, .pic, .evo img, #sprite, .art, .lineage img, .choice img, .fighter img, .reveal img';
let retroOn = false;   // retro pixel mode was removed; always show the official art
const imgCache = new Map();
function processArt(src, res, retro){
  const key = src + '|' + res + '|' + retro;
  if (imgCache.has(key)) return imgCache.get(key);
  const job = new Promise(done => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onerror = () => done(/digimon\.net\//.test(src) ? src : null);   // the official site doesn't allow editing its pictures, so show them as they are
    im.onload = () => {
      try{ done(retro ? pixelSprite(im, res) : cutout(im, res)); }catch{ done(null); }
    };
    im.src = src;
  });
  imgCache.set(key, job);
  return job;
}
// background = near-white pixels connected to the edges (inner whites like eyes and wings stay)
function findBackground(p, S){
  const N = S * S, bg = new Uint8Array(N), q = [];
  const light = i => p[i*4+3] < 40 || (p[i*4] >= 250 && p[i*4+1] >= 250 && p[i*4+2] >= 250);
  for (let i = 0; i < S; i++) for (const j of [i, (S-1)*S + i, i*S, i*S + S - 1]) if (!bg[j] && light(j)){ bg[j] = 1; q.push(j); }
  while (q.length){ const i = q.pop(), xx = i % S; for (const j of [i-1, i+1, i-S, i+S]){ if (j < 0 || j >= N || bg[j] || Math.abs((j % S) - xx) > 1) continue; if (light(j)){ bg[j] = 1; q.push(j); } } }
  return bg;
}
function cutout(im, res){
  const c = document.createElement('canvas'); c.width = c.height = res;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, res, res);
  const d = x.getImageData(0, 0, res, res), bg = findBackground(d.data, res);
  for (let i = 0; i < res * res; i++) if (bg[i]) d.data[i*4+3] = 0;
  x.putImageData(d, 0, 0);
  return c.toDataURL();
}
// pixel sprite: perceptual palette from the art, majority colour per block, line art kept,
// light shading on region edges and a soft outline
function pixelSprite(im, res){
  const S = 320, k = 14;
  const c0 = document.createElement('canvas'); c0.width = c0.height = S;
  const x0 = c0.getContext('2d'); x0.drawImage(im, 0, 0, S, S);
  const p = x0.getImageData(0, 0, S, S).data, N = S * S, bg = findBackground(p, S);
  let x1 = S, y1 = S, x2 = 0, y2 = 0;
  for (let i = 0; i < N; i++) if (!bg[i]){ const xx = i % S, yy = (i / S) | 0; if (xx < x1) x1 = xx; if (xx > x2) x2 = xx; if (yy < y1) y1 = yy; if (yy > y2) y2 = yy; }
  if (x2 < x1) return null;
  const side = (Math.max(x2 - x1, y2 - y1) + 1) * res / (res - 2), ox = (x1 + x2 + 1 - side) / 2, oy = (y1 + y2 + 1 - side) / 2;
  const lum = c => c[0]*.3 + c[1]*.59 + c[2]*.11;
  const lin = v => { v /= 255; return v > .04045 ? ((v + .055) / 1.055) ** 2.4 : v / 12.92; };
  const fl = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16/116;
  const toLab = (r, g, b) => { const R = lin(r), G = lin(g), B = lin(b);
    const X = fl((R*.4124 + G*.3576 + B*.1805) / .9505), Y = fl(R*.2126 + G*.7152 + B*.0722), Z = fl((R*.0193 + G*.1192 + B*.9505) / 1.089);
    return [116*Y - 16, 500*(X - Y), 200*(Y - Z)]; };
  const pc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){ if (bg[i]) continue; const q = toLab(p[i*4], p[i*4+1], p[i*4+2]); pc[i*3] = q[0]; pc[i*3+1] = q[1]; pc[i*3+2] = q[2]; }
  const samp = []; for (let i = 0; i < N; i += 3) if (!bg[i]) samp.push(i);
  samp.sort((a, b) => pc[a*3] - pc[b*3]);
  const sortedL = samp.map(i => lum([p[i*4], p[i*4+1], p[i*4+2]])).sort((a, b) => a - b);
  const darkLum = Math.min(45, sortedL[sortedL.length >> 1] * 0.38), darkMin = 5;
  let cents = []; for (let j = 0; j < k; j++){ const i = samp[Math.floor((j + .5) / k * samp.length)]; cents.push([pc[i*3], pc[i*3+1], pc[i*3+2], p[i*4], p[i*4+1], p[i*4+2]]); }
  const near = i => { let b = 0, bd = 1e12; for (let ci = 0; ci < cents.length; ci++){ const c = cents[ci]; const dd = (pc[i*3]-c[0])**2 + (pc[i*3+1]-c[1])**2 + (pc[i*3+2]-c[2])**2; if (dd < bd){ bd = dd; b = ci; } } return b; };
  for (let it = 0; it < 10; it++){
    const sum = cents.map(() => [0,0,0,0,0,0,0]);
    for (const i of samp){ const s = sum[near(i)]; s[0] += pc[i*3]; s[1] += pc[i*3+1]; s[2] += pc[i*3+2]; s[3] += p[i*4]; s[4] += p[i*4+1]; s[5] += p[i*4+2]; s[6]++; }
    cents = cents.map((cc, ci) => sum[ci][6] ? sum[ci].slice(0, 6).map(t => t / sum[ci][6]) : cc);
  }
  const rgbOf = ci => [cents[ci][3], cents[ci][4], cents[ci][5]];
  const cl = cents.map((c, ci) => lum(rgbOf(ci)));
  const R = res * res, idx = new Int16Array(R).fill(-1), step = side / res;
  for (let by = 0; by < res; by++) for (let bx = 0; bx < res; bx++){
    const votes = new Map(); let total = 0, fg = 0, dark = 0, darkIdx = -1, dl = 999;
    for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++){
      const X = Math.floor(ox + (bx + (sx + .5) / 3) * step), Y = Math.floor(oy + (by + (sy + .5) / 3) * step);
      total++; if (X < 0 || Y < 0 || X >= S || Y >= S) continue; const i = Y * S + X; if (bg[i]) continue; fg++;
      const ci = near(i); votes.set(ci, (votes.get(ci) || 0) + 1);
      if (cl[ci] < darkLum){ dark++; if (cl[ci] < dl){ dl = cl[ci]; darkIdx = ci; } }
    }

const SAVE_KEYS = ['dx_game_v1', 'dx_favs', 'dx_tab', 'dx_diff_battle', 'dx_diff_dungeon', 'dx_theme'];
function makeBackup(){
  const keys = {}; for (const k of SAVE_KEYS){ try{ const v = localStorage.getItem(k); if (v !== null) keys[k] = v; }catch{} }
  const json = JSON.stringify({ v: 1, t: Date.now(), keys });
  return 'DXSAVE1:' + btoa(unescape(encodeURIComponent(json)));
}
function readBackup(code){
  const s = String(code || '').trim().replace(/\s+/g, '');
  if (!s.startsWith('DXSAVE1:')) throw new Error('That doesn\'t look like a Digimon save code.');
  const o = JSON.parse(decodeURIComponent(escape(atob(s.slice(8)))));
  if (!o || !o.keys || !o.keys.dx_game_v1) throw new Error('The code is missing game data.');
  const g = JSON.parse(o.keys.dx_game_v1);
  if (!g || !Array.isArray(g.party)) throw new Error('The game data in this code is damaged.');
  return o;
}

const ELEMS = { fire: { icon: '🔥', name: 'Fire' }, water: { icon: '💧', name: 'Water' }, plant: { icon: '🌿', name: 'Plant' }, wind: { icon: '🌪️', name: 'Wind' },

const FIELD_ELEM = [[/dragon'?s roar/i, 'fire'], [/deep savers/i, 'water'], [/jungle troopers/i, 'plant'], [/wind guardians/i, 'wind'], [/metal empire/i, 'machine'], [/nature spirits/i, 'beast'], [/virus busters/i, 'holy'], [/nightmare soldiers|dark area/i, 'dark']];
const TYPE_ELEM = [[/holy|angel|cherub|seraph|god|goddess|throne/, 'holy'], [/demon|undead|ghost|evil|fallen|vampire|devil|skeleton|zombie/, 'dark'], [/machine|cyborg|android|mech|artificial|robot/, 'machine'],
  [/aquatic|sea|fish|mollusk|amphibian|ice|water|crustacean|whale|marine/, 'water'], [/dragon|reptile|flame|fire|dinosaur|lava|magma/, 'fire'], [/plant|vegetation|insect|tree|flower|mushroom|fairy/, 'plant'],
  [/bird|avian|wind|sky|feather/, 'wind'], [/beast|mammal|animal|canine|feline|lion|wolf/, 'beast']];
// strong against → 1.3× damage; the defender's strength against the attacker → 0.8×
const ELEM_STRONG = { fire: ['plant', 'machine'], water: ['fire'], plant: ['water', 'beast'], wind: ['plant'], machine: ['wind', 'water'], beast: ['wind'], holy: ['dark'], dark: ['holy'] };
function elemOf(d){ const e = elemOfRaw(d); if (d && d.id) noteElem(d.id, e); return e; }
function elemOfRaw(d){
  if (!d) return 'beast';
  const fields = (d.fields || []).map(f => f.field).join(' ');
  for (const [re, e] of FIELD_ELEM) if (re.test(fields)) return e;
  const t = (d.types || []).map(x => x.type).join(' ').toLowerCase();
  for (const [re, e] of TYPE_ELEM) if (re.test(t)) return e;
  return 'beast';
}
function elemMult(a, d){ if (!a || !d) return 1; if ((ELEM_STRONG[a] || []).includes(d)) return 1.3; if ((ELEM_STRONG[d] || []).includes(a)) return 0.8; return 1; }
const elemTag = e => e && ELEMS[e] ? ELEMS[e].icon + ' ' + ELEMS[e].name : '';
// remember every element we've looked up, so element eggs get faster over time
const ELEM_CACHE = store.get('dx_elem_v1', {}) || {};
let elemSaveT = 0;
function noteElem(id, e){ if (!id || ELEM_CACHE[id] === e) return; ELEM_CACHE[id] = e; clearTimeout(elemSaveT); elemSaveT = setTimeout(() => store.set('dx_elem_v1', ELEM_CACHE), 1500); }
// find a Digimon of an element at a stage: known matches first, otherwise look Digimon up until one fits
async function elemPick(elem, stage){
  const pool = shuffle((state.stageIds[stage] || []).filter(id => state.byId.has(id) && !state.armor.has(id)));
  const fresh = id => !raised(id) && !G.party.some(m => m.id === id);
  const cached = pool.filter(id => ELEM_CACHE[id] === elem);
  if (cached.some(fresh) && Math.random() < 0.6) return cached.filter(fresh)[0];
  const todo = pool.filter(id => !(id in ELEM_CACHE));
  for (let i = 0; i < todo.length && i < 72; i += 8){
    const batch = todo.slice(i, i + 8), ds = await Promise.all(batch.map(id => getDetail(id).catch(() => null)));
    const hits = batch.filter((id, j) => ds[j] && elemOf(ds[j]) === elem);
    if (hits.length) return hits.find(fresh) || hits[0];
  }
  return cached.find(fresh) || cached[0] || null;

function evCheck(){
  const now = Date.now(), E = G.ev = G.ev || { key: null, end: 0, next: now + 20 * 60000, last: null };
  if (E.key && now >= E.end){ E.last = E.key; E.key = null; E.next = now + (2 + Math.random() * 8) * 3600000; saveGame(); }
  if (!E.key && now >= E.next){
    const pool = EVENTS.filter(e => e.key !== E.last), ev = pick(pool);
    E.key = ev.key; E.start = now; E.end = now + (3 + Math.random() * 9) * 3600000; saveGame();
  }
  return E.key ? EVENTS.find(e => e.key === E.key) : null;
}
const evOn = k => !!(G.ev && G.ev.key === k && Date.now() < G.ev.end);
function eventBanner(){
  const ev = evCheck(); if (!ev) return '';
  return '<div class="evbanner"><b>' + ev.icon + ' ' + esc(ev.name) + '</b><span>' + esc(ev.desc) + '</span><small>Ends in ' + fmtLeft(G.ev.end - Date.now()) + '</small></div>';
}

// ----- Colosseum: 10 ranks, 3 rounds each, HP carries over between rounds -----
const COLO = [
  { name: 'Bronze I', mult: 0.95 }, { name: 'Bronze II', mult: 1 }, { name: 'Bronze III', mult: 1.06, item: 'egg:lucky' },
  { name: 'Silver I', mult: 1.12 }, { name: 'Silver II', mult: 1.18, item: 'vit:all' }, { name: 'Silver III', mult: 1.25, item: 'h:band' },
  { name: 'Gold I', mult: 1.33 }, { name: 'Gold II', mult: 1.42, item: 'egg:champion' }, { name: 'Gold III', mult: 1.52, item: 'h:amulet' },
  { name: 'Legend', mult: 1.65, item: 'egg:golden' },
];
const coloData = i => 80 + 60 * i;
const weekNo = () => Math.floor((Date.now() / 864e5 + 3) / 7);
function coloFoes(i, stage){
  const pool = (state.stageIds[stage] || []).filter(id => state.byId.has(id) && !state.armor.has(id));
  const out = [];
  for (let k = 0; out.length < 3 && k < 12; k++){ const id = pool[Math.floor(Math.abs(seeded(i * 97 + weekNo(), 300 + k)) * pool.length) % pool.length]; if (id && !out.includes(id)) out.push(id); }
  return out;
}
function coloMatch(i){
  const p = P(); if (!p || busy) return;
  if (asleep(p) || careInit(p).sick){ renderWorld('colo', p.name + (asleep(p) ? ' is asleep. Wake it up on the Partner tab first.' : ' is sick. Give it medicine on the Partner tab first.')); return; }
  const rank = COLO[i], foes = coloFoes(i, p.stage), carry = { hp: null, sp: null };
  p.energy = clamp(p.energy - 30); saveGame();
  let round = 0;
  const next = () => battle(DIFFS[1], { foeId: foes[round], mult: rank.mult * (round === 2 ? 1.08 : 1), title: '🏟️ ' + rank.name + ' · Round ' + (round + 1) + ' of 3', carry, noRun: true, onDone: outcome => {
    if (outcome !== 'win'){ coloEnd(i, false, round); return; }
    round++;
    if (round >= 3){ coloEnd(i, true, round); return; }
    carry.hp = Math.min(Math.round(carry.hp + (carry.max || 0) * 0.2), carry.max || carry.hp);   // a short breather between rounds
    $('#overlay .sheet').innerHTML = '<h4>🏟️ Round ' + round + ' cleared!</h4><p style="margin:0;color:var(--muted)">' + esc(p.name) + ' catches its breath (+20% HP). Next up: ' + esc(shown(foes[round], state.byId.get(foes[round]).name)) + '.</p><button class="big" id="coNext">Round ' + (round + 1) + '</button>';
    $('#coNext').onclick = next;
  } });
  next();
}
function coloEnd(i, won, rounds){
  const p = P(), rank = COLO[i], first = won && (G.colo.best || 0) <= i;
  let html;
  if (won){
    const data = Math.round(coloData(i) * (first ? 1 : 0.3) * (evOn('data') ? 2 : 1));
    G.data += data; if (first){ G.colo.best = i + 1; grantItem(rank.item); }
    bump('coloWins'); addBond(p, 3); p.mood = clamp(p.mood + 12);
    html = '<h4>🏆 ' + esc(rank.name) + ' cleared!</h4><p style="margin:0">' + esc(p.name) + ' won all three rounds. +' + data + ' DigiData' + (first && rank.item ? ' and ' + esc(itemIcon(rank.item) + ' ' + itemName(rank.item)) : '') + (first ? '. New rank unlocked!' : ' (replay reward).') + '</p>';
  } else {
    p.mood = clamp(p.mood - 6);
    html = '<h4>Knocked out in round ' + (rounds + 1) + '</h4><p style="margin:0;color:var(--muted)">' + esc(p.name) + ' couldn\'t finish ' + esc(rank.name) + '. Train up and try again.</p>';
  }
  saveGame();
  $('#overlay .sheet').innerHTML = html + '<button class="big" id="coDone">Continue</button>';
  $('#coDone').onclick = () => { closeOv(); setTab('world'); };
}

function farmInit(){ if (!G.farm) G.farm = { plots: [null, null], gym: 0, gymLast: Date.now() }; return G.farm; }
const cropMs = c => c.mins * 60000 * (evOn('harvest') ? 0.5 : 1) * (weatherAt('file').farm || 1) * (1 - 0.1 * perk('thumb'));

// ================= TAMER LEVEL, DIGIMON CARE, WEATHER, DAY / NIGHT =================

// ----- day and night follow the phone's clock -----
var PHASES = { dawn: { icon: '🌅', name: 'Dawn' }, day: { icon: '☀️', name: 'Day' }, dusk: { icon: '🌇', name: 'Dusk' }, night: { icon: '🌙', name: 'Night' } };
function dayPhase(d){ const h = (d || new Date()).getHours(); return h >= 6 && h < 8 ? 'dawn' : h >= 8 && h < 18 ? 'day' : h >= 18 && h < 20 ? 'dusk' : 'night'; }
// Digimon sleep from 10pm to 7am unless you wake them
function sleepHour(){ const h = new Date().getHours(); return h >= 22 || h < 7; }
function asleep(p){ return !!p && sleepHour() && !(p.wokeUntil > Date.now()); }
function lightsOff(){ return sleepHour() && !!G.lightsOff && Date.now() - G.lightsOff < 12 * 3600000; }
// Holy Digimon are a little stronger by day, Dark ones at night
function timeMult(e){ const ph = dayPhase(); if (ph === 'night') return e === 'dark' ? 1.15 : e === 'holy' ? 0.9 : 1; if (ph === 'day') return e === 'holy' ? 1.1 : e === 'dark' ? 0.95 : 1; return 1; }

// ----- Digimon care: messes, sickness and sleep -----
function careInit(p){ if (p.poop == null){ p.poop = 0; p.poopAcc = 0; p.sick = 0; } p.flags = p.flags || {}; return p; }

function careTick(p, mins){

  while (p.poopAcc >= 110){ p.poopAcc -= 110; if (p.poop < 4) p.poop++; }
  if (p.poop >= 4 && !p.flags.poop){ p.flags.poop = true; careMistake(p, p.name + ' was stuck in a mess for too long. That\'s a care mistake.'); }
  const risk = ((p.poop >= 3 ? 0.0025 : p.poop >= 2 ? 0.0008 : 0) + (p.hunger <= 5 ? 0.002 : 0)) * (1 - 0.2 * perk('tidy'));
  if (!p.sick && risk > 0 && Math.random() < 1 - Math.pow(1 - risk, mins)){ p.sick = Date.now(); p.msg = p.name + ' caught a bug and feels sick. Give it medicine!'; }
  if (p.sick && Date.now() - p.sick > 6 * 3600000 && !p.flags.sick){ p.flags.sick = true; careMistake(p, p.name + ' was left sick for hours. That\'s a care mistake.'); }
  if (p.poop) p.mood = clamp(p.mood - mins / 40 * p.poop);

}

// ----- auto-battle: predicts each move's real damage (DEF, attribute, element, weather, accuracy, crits) and reads the danger -----
function estHit(att, def, m){
  if (!m || !['phys', 'mag', 'drain', 'atk'].includes(m.kind)) return { avg: 0, low: 0, hit: 1 };
  const phys = m.kind === 'phys' || m.kind === 'atk', a = phys ? att.st.atk : att.st.int, dS = def.st.def || 0;
  const defF = 1.35 * (2 * a) / (2 * a + dS);
  const mult = attrMult(att.attr, def.attr) * elemMult(att.elem, def.elem) * skyMult(att) * (att.tdm || 1) * (def.ttk || 1) * (def.guard ? 0.5 : 1);
  const ev = Math.max(0.03, Math.min(0.3, 0.05 + (def.st.spd - att.st.spd) * 0.012)) + (curWeather().evade || 0);
  const cr = Math.max(0.04, Math.min(0.33, 0.06 + (att.critBonus || 0) + (att.st.spd - def.st.spd) * 0.01));
  const raw = a * (m.power || 1) * (att.buff || 1) * defF * mult;
  return { avg: raw * (1 - ev) * (1 + 0.6 * cr), low: raw * 0.85, hit: 1 - ev };
}
function autoHeur(me, foe, modes, modeCost){
  const moves = me.moves.map((m, i) => ({ m, i, cost: m.cost || 0 }));
  const can = moves.filter(x => x.cost <= me.sp);
  const atk = can.filter(x => ['phys', 'mag', 'drain', 'atk'].includes(x.m.kind)).map(x => {
    const e = estHit(me, foe, x.m), st = moveStatus(x.m);
    const statusBonus = st && !foe.status && !foe.noStatus ? e.avg * (st === 'slp' ? 0.35 : st === 'par' ? 0.25 : 0.2) * 0.3 : 0;
    return Object.assign(x, { e, val: e.avg + statusBonus + (x.m.kind === 'drain' && me.hp < me.st.hp * 0.7 ? e.avg * 0.3 : 0) });
  });
  const heal = can.find(x => x.m.kind === 'heal'), buff = can.find(x => x.m.kind === 'buff'), guard = moves.find(x => x.m.kind === 'guard');
  // how hard can the foe hit back next turn?
  const foeMoves = (foe.moves || []).filter(m => (m.cost || 0) <= foe.sp + 1);
  const threat = Math.max(1, ...foeMoves.map(m => estHit(foe, Object.assign({}, me, { guard: false }), m).avg)) * 1.15;
  const poison = me.status && me.status.k === 'psn' ? Math.max(1, Math.round(me.st.hp / 12)) : 0;
  const foeAsleep = foe.status && foe.status.k === 'slp';
  const best = atk.slice().sort((a, b) => b.val - a.val)[0];
  const bestDmg = best ? best.e.avg : 1, turnsToKill = foe.hp / Math.max(1, bestDmg);
  // 1. finish it: the cheapest move whose weak roll still knocks the foe out
  const kos = atk.filter(x => x.e.low >= foe.hp).sort((a, b) => a.cost - b.cost || b.e.hit - a.e.hit);
  if (kos.length) return String(kos[0].i);
  // 2. about to go down: heal, or drain, if that keeps us alive; otherwise swing for the fences
  const danger = !foeAsleep && me.hp <= threat + poison;
  if (danger && heal && me.st.hp * heal.m.power > threat * 0.7 && turnsToKill > 1) return String(heal.i);
  if (me.hp < me.st.hp * 0.4 && heal && !danger && turnsToKill > 2) return String(heal.i);
  // 3. set-up moves when the fight will be long and it's safe
  const safe = foeAsleep || me.hp > threat * 2.5;
  if (modes && modes.length && !me.moded && me.sp >= modeCost && turnsToKill >= 2.5 && safe) return 'mode';
  if (buff && (me.buff || 1) < 1.5 && turnsToKill >= 3.5 && safe) return String(buff.i);
  if (!best) return String(guard ? guard.i : 0);
  // 4. prefer a cheaper move when it's nearly as good, to save SP
  const pickCheap = atk.filter(x => x.cost < best.cost && x.val >= best.val * 0.88).sort((a, b) => a.cost - b.cost)[0];
  const choice = pickCheap || best;

  if (choice.cost === 0 && guard && !danger && turnsToKill > 2) {
    const gain = Math.max(2, Math.ceil(me.st.sp * 0.2)) + 1;
    const big = moves.filter(x => ['phys', 'mag', 'drain'].includes(x.m.kind) && x.cost > me.sp && x.cost <= me.sp + gain)
      .map(x => estHit(me, foe, x.m).avg).sort((a, b) => b - a)[0] || 0;
    if (big > choice.e.avg * 2.2) return String(guard.i);

}
// look ahead: try every option in many quick imaginary fights (both sides played sensibly) and pick the one that wins most
function autoChoice(me, foe, modes, modeCost){
  const opts = me.moves.map((m, i) => i).filter(i => (me.moves[i].cost || 0) <= me.sp).map(String);
  if (modes && modes.length && !me.moded && me.sp >= modeCost) opts.push('mode');
  if (opts.length <= 1) return opts[0] || autoHeur(me, foe, modes, modeCost);
  const clone = u => Object.assign({}, u, { st: Object.assign({}, u.st), status: u.status ? Object.assign({}, u.status) : null });
  const act = (a, d, c) => { if (c === 'mode'){ a.sp -= modeCost; a.moded = true; ['atk', 'int', 'def', 'spd'].forEach(k => a.st[k] = Math.round(a.st[k] * 1.25)); } else doMove(a, d, a.moves[+c]); };
  const meFirst = me.st.spd >= foe.st.spd;
  const play = first => {
    const m = clone(me), f = clone(foe);
    const done = () => f.hp <= 0 ? 1 : m.hp <= 0 ? 0 : null;
    act(m, f, first); let r = done(); if (r !== null) return r;
    if (meFirst){ f.guard = false; const s = statusTurn(f); if ((r = done()) !== null) return r; if (!s.skip) doMove(f, m, foeChoice(f, m)); if ((r = done()) !== null) return r; }
    for (const u of [m, f]) u.sp = Math.min(u.st.sp, u.sp + 1);
    for (let t = 0; t < 14; t++){
      const order = m.st.spd > f.st.spd || (m.st.spd === f.st.spd && Math.random() < 0.5) ? [m, f] : [f, m];
      for (const u of order){
        u.guard = false; const s = statusTurn(u); if ((r = done()) !== null) return r; if (s.skip) continue;
        if (u === m) act(m, f, autoHeur(m, f, modes, modeCost)); else doMove(f, m, foeChoice(f, m));
        if ((r = done()) !== null) return r;
      }
      for (const u of [m, f]) u.sp = Math.min(u.st.sp, u.sp + 1);
    }
    return m.hp / m.st.hp >= f.hp / f.st.hp ? 0.6 : 0.2;
  };
  // up to 120 imaginary fights per option, in rounds, stopping early if a slow phone runs out of time
  const sums = opts.map(() => 0), t0 = performance.now(); let n = 0;
  while (n < 120 && (n < 16 || performance.now() - t0 < 180)){ opts.forEach((o, i) => { for (let k = 0; k < 8; k++) sums[i] += play(o); }); n += 8; }
  const heur = autoHeur(me, foe, modes, modeCost);
  let best = opts[0], bestScore = -1;
  opts.forEach((o, i) => { const sc = sums[i] / n + (o === heur ? 0.02 : 0); if (sc > bestScore){ bestScore = sc; best = o; } });   // small nudge toward the sensible pick on ties
  return best;
}
function expMs(ex){ return Math.round(ex.mins * 60000 * (1 - 0.1 * perk('path'))); }

function dgRoomSpot(r){
  for (let t = 0; t < 60; t++){
    const x = r.x + (Math.random() * r.w | 0), y = r.y + (Math.random() * r.h | 0);
    if (!dgUnitAt(x, y) && !dg.items.some(i => i.x === x && i.y === y) && !(dg.stairs && dg.stairs.x === x && dg.stairs.y === y) && !(dg.fire && dg.fire.x === x && dg.fire.y === y)) return { x, y };
  }

// lava or tide pools scattered in the rooms (never in the room you start in)
function dgDecorate(startRoom){
  const th = dgTheme(); dg.tiles = new Map();
  const frac = th.lava || th.pools || 0; if (!frac) return;
  for (const r of dg.rooms){
    if (r === startRoom) continue;
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++){
      if (Math.random() >= frac) continue;
      if (dgUnitAt(x, y) || dg.items.some(i => i.x === x && i.y === y) || (dg.stairs && dg.stairs.x === x && dg.stairs.y === y) || (dg.fire && dg.fire.x === x && dg.fire.y === y)) continue;

    }
  }
}
