<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digimon Index">
<title>Digimon Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Silkscreen&family=VT323&display=swap">
<script>try{var d=document.documentElement,s=localStorage.getItem('dx_skin')||'card',t=localStorage.getItem('dx_theme');d.dataset.skin=s;d.dataset.device=localStorage.getItem('dx_device')||'v1';if(s==='card')d.dataset.theme='light';else if(s==='retro')d.dataset.theme='dark';else if(t==='dark'||t==='light')d.dataset.theme=t;}catch(e){}</script>
<style>
/* Layout: bottom tab bar switches between the Partner habitat (one-screen raising game) and the Index (search grid + detail with evo branches) */
:root{
  --bg:#eef1f7; --panel:#ffffff; --sunk:#e1e6f0; --fg:#141a2b; --muted:#5a6480; --line:#cfd6e4;
  --accent:#e0640f; --accent-ink:#ffffff; --link:#2346c7; --star:#d9a400;
  --good:#1f9d55; --warn:#d48a00; --bad:#d23c3c; --grid:rgba(35,70,199,.07); --silf:brightness(0) opacity(.5);
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1120; --panel:#161c30; --sunk:#1e263f; --fg:#e6eaf5; --muted:#8f9ab8; --line:#2a3452;
  --accent:#ff8a3d; --accent-ink:#1a0d02; --link:#8fa8ff; --star:#ffd04d;
  --good:#3ccf7a; --warn:#ffb534; --bad:#ff6b6b; --grid:rgba(143,168,255,.08); --silf:brightness(0) invert(1) opacity(.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1120; --panel:#161c30; --sunk:#1e263f; --fg:#e6eaf5; --muted:#8f9ab8; --line:#2a3452;
  --accent:#ff8a3d; --accent-ink:#1a0d02; --link:#8fa8ff; --star:#ffd04d;
  --good:#3ccf7a; --warn:#ffb534; --bad:#ff6b6b; --grid:rgba(143,168,255,.08); --silf:brightness(0) invert(1) opacity(.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{background:var(--bg)}
/* Only main scrolls: the header and tabs occupy their own viewport rows. */
body{background:transparent;color:var(--fg);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%;
  height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
main.wrap{width:100%;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding-bottom:16px}

header{position:relative;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{font:700 1.35rem/1 var(--display);letter-spacing:.02em;margin:0}
.brand small{display:block;font:400 .72rem/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:4px}
.count{margin-left:auto;font:600 .8rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.search{display:flex;gap:6px;padding-bottom:10px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;font:inherit;color:var(--fg)}
.favbtn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0 10px;white-space:nowrap;font-size:.85rem}
.favbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;
  font:600 .78rem var(--mono);letter-spacing:.03em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.status{padding:28px 0;color:var(--muted);text-align:center}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;max-width:280px;margin:12px auto 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.err{color:var(--fg)}
.retry{margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:9px 16px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-block:14px 24px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r);padding:8px 6px 10px;text-align:center;min-width:0}
.card:active{transform:scale(.97)}
.card .pic{width:72px;height:72px;object-fit:contain}
.card .nm{font-weight:700;font-size:.82rem;line-height:1.2;overflow-wrap:anywhere}
.card .no{font:.68rem var(--mono);color:var(--muted)}
.card.raised{border-color:var(--good)}
.tick{position:absolute;top:5px;right:6px;font:700 .7rem var(--mono);color:var(--good)}

/* detail */
.detail{padding-block:12px 24px}
.back{border:0;background:none;color:var(--link);padding:6px 0;font-weight:700}
.trail{display:flex;flex-wrap:wrap;gap:4px 6px;font:.75rem var(--mono);color:var(--muted);margin:4px 0 10px}
.trail button{border:0;background:none;padding:0;color:var(--link);font:inherit}
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .art{margin:0 auto}}
.art{width:100%;max-width:220px;aspect-ratio:1;object-fit:contain;background:var(--sunk);border-radius:12px}
.hero h2{font:700 clamp(1.6rem,5vw,2.4rem)/1.05 var(--display);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.idline{font:.78rem var(--mono);color:var(--muted);margin-top:6px}
.raisedline{font:700 .78rem var(--mono);color:var(--good);margin-top:4px}
.star{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;margin-top:10px;font-weight:700}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
dl.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;text-align:left}
dl.stats dt{font:600 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
dl.stats dd{margin:0;font-weight:700}
.desc{max-width:65ch;margin:16px 0 0;color:var(--fg)}
h3{font:700 1rem var(--display);letter-spacing:.04em;text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3 span{font:600 .75rem var(--mono);color:var(--muted);text-transform:none;letter-spacing:0}
.evos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.evo{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);
  padding:8px;text-align:left;min-width:0}
.evo.raised{border-color:var(--good)}
.evo img{width:48px;height:48px;object-fit:contain;flex:none}
.evo .t{min-width:0}
.evo b{display:block;overflow-wrap:anywhere}
.evo small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.75rem;line-height:1.3}
.evo.nolink{cursor:default;opacity:.75}
.more{margin-top:8px;border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:8px 14px;font-weight:700}
.empty{color:var(--muted);font-style:italic}
.skills{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.skill b{display:block}
.skill p{margin:2px 0 0;color:var(--muted);font-size:.85rem}

/* tabs */
.tabs{position:relative;z-index:8;display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:12px 0 10px;font:700 .6rem var(--mono);letter-spacing:0;white-space:nowrap;overflow:hidden;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* partner */
.partner{padding-block:14px 10px;display:grid;gap:12px;max-width:560px;margin:0 auto}
.ptop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ptop h2{font:700 1.6rem/1.1 var(--display);margin:0;overflow-wrap:anywhere}
.stage{font:600 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.habitat{position:relative;height:230px;border-radius:16px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--panel);
  display:flex;align-items:flex-end;justify-content:center}
.habitat::after{content:"";position:absolute;left:18%;right:18%;bottom:22px;height:14px;border-radius:50%;background:var(--sunk)}
.sprite{position:relative;z-index:1;width:170px;height:170px;object-fit:contain;margin-bottom:26px;animation:bob 2.4s ease-in-out infinite}
.sprite.happy{animation:hop .5s ease-in-out 3}
.sprite.flash{animation:flash .35s steps(2) 8}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{50%{transform:translateY(-22px)}}
@keyframes flash{50%{filter:brightness(4) saturate(0)}}
.bubble{position:absolute;top:12px;left:12px;right:12px;z-index:2;font-size:.85rem;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;min-height:1.5em}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.meter label{display:flex;justify-content:space-between;font:600 .68rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meter label b{color:var(--fg);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:4px;transition:width .4s}
.evobox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.evobox .row{display:flex;justify-content:space-between;gap:8px;font:600 .72rem var(--mono);color:var(--muted);flex-wrap:wrap}
.evobox .row b{color:var(--fg)}
.evotrack{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.evotrack i{display:block;height:100%;background:var(--accent);transition:width .4s}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actions.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.bondtrack i{background:#e0457b}
.dailybar{width:100%;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--fg);border-radius:12px;padding:10px 12px;font-weight:700;text-align:left}
#trainerBtn.alert{border-color:var(--accent);color:var(--accent)}
.segs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.seg{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font:600 .74rem var(--mono);color:var(--muted)}
.seg.on{border-color:var(--accent);color:var(--accent)}
.achs{display:grid;gap:6px;max-height:52vh;overflow:auto}
.ach{display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.ach .qtop{display:flex;justify-content:space-between;gap:8px}.ach .qtop span{font:700 .74rem var(--mono);color:var(--muted)}
.ach small{font:.7rem/1.35 var(--mono);color:var(--muted)}
.ach.done{border-color:var(--good)}.ach.got{opacity:.7}
.ach .act{padding:7px 12px;justify-self:start}
.csteps{display:flex;flex-wrap:wrap;gap:5px}.csteps .act{padding:5px 9px;font-size:.74rem}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 8px;display:grid;gap:2px}
.day small{font:.64rem/1.3 var(--mono);color:var(--muted)}
.day.done{opacity:.55}.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.titles{display:flex;flex-wrap:wrap;gap:6px}.titles .act{padding:8px 12px}.titles .act.on{border-color:var(--accent);color:var(--accent)}
.bkbox{width:100%;min-height:84px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px;font:.68rem/1.35 var(--mono);word-break:break-all}
.bkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.jbtns .act{padding:7px 10px;font-size:.78rem}
.tree{display:grid;gap:4px;max-height:58vh;overflow:auto}
.tnode{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 10px;display:grid;gap:6px}
.tnode.cur{border-color:var(--accent)}
.thead{display:flex;gap:10px;align-items:center}.thead img{width:46px;height:46px;object-fit:contain}.thead small{display:block;font:.68rem var(--mono);color:var(--muted)}
.tstats{display:flex;flex-wrap:wrap;gap:4px 10px;font:600 .66rem var(--mono);color:var(--muted)}.tstats .g{color:var(--good)}
.tthumbs{display:flex;flex-wrap:wrap;gap:4px}
.tthumb{width:40px;height:40px;padding:2px;border:1px solid var(--line);background:var(--bg);border-radius:8px}
.tthumb.r{border-color:var(--good)}.tthumb img{width:100%;height:100%;object-fit:contain}
.tmore{font:600 .7rem var(--mono);color:var(--muted);align-self:center}
.tlink{text-align:center;color:var(--muted);font-size:.8rem;line-height:1}
.hv{color:var(--good)}.nh{color:var(--bad)}
.modebtn{border-color:var(--accent)}
.evbanner{display:grid;gap:2px;border:1px solid var(--star);background:color-mix(in srgb,var(--star) 14%,var(--panel));border-radius:12px;padding:9px 12px}
.evbanner b{font:700 .95rem var(--display)}.evbanner span{font-size:.82rem}.evbanner small{font:600 .7rem var(--mono);color:var(--muted)}
.regions{display:grid;gap:7px}
.region{display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.region .qtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.region .qtop span{font:700 .7rem var(--mono);color:var(--muted)}
.region small{font:.72rem/1.4 var(--mono);color:var(--muted)}
.region.here{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.region.done{border-color:var(--good)}.region.locked{opacity:.65}
.region .act{justify-self:start;padding:8px 14px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.plot{display:grid;gap:5px;align-content:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.plot small{font:.7rem/1.35 var(--mono);color:var(--muted)}.plot.ripe{border-color:var(--good)}.plot.empty{border-style:dashed}
.plot .act{padding:7px 10px}
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.seed{display:grid;justify-items:center;gap:1px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 3px;font-size:1.05rem}
.seed span{font:600 .62rem var(--body)}.seed small{font:.56rem var(--mono);color:var(--muted)}
.act{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.act small{font:400 .66rem var(--mono);color:var(--muted)}
.act:active:not(:disabled){transform:scale(.96)}
.big{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font:700 1.05rem var(--display);letter-spacing:.04em;width:100%}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;font-weight:700;width:100%}
.danger{color:var(--bad);border-color:var(--bad)}
.lineage{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;font:.72rem var(--mono);color:var(--muted)}
.lineage img{width:34px;height:34px;object-fit:contain}
.egg{width:130px;height:165px;margin:0 auto;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;cursor:pointer;border:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),transparent 30%),
    radial-gradient(circle at 65% 62%,var(--accent) 0 11%,transparent 12%),radial-gradient(circle at 35% 70%,var(--link) 0 8%,transparent 9%),
    radial-gradient(circle at 55% 30%,var(--good) 0 7%,transparent 8%),var(--sunk);
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.08);animation:wobble 2.6s ease-in-out infinite}
.egg.shake{animation:shake .4s}
@keyframes wobble{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.center{text-align:center}
.boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bcell{position:relative;display:grid;justify-items:center;align-content:start;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;min-width:0;text-align:center}
.bcell img{width:56px;height:56px;object-fit:contain}
.bcell b{font-size:.78rem;overflow-wrap:anywhere;line-height:1.2}
.bcell small{font:.6rem var(--mono);color:var(--muted)}
.bcell i{font:700 .62rem var(--mono);font-style:normal;color:var(--link)}
.bcell i.ok{color:var(--good)}
.bcell.pick{cursor:pointer}
.bcell.pick.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.bcell.pick.on::after{content:'✓';position:absolute;top:4px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .7rem/18px var(--mono);text-align:center}
.teamsum{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.85rem;color:var(--muted)}
.teamsum b{color:var(--fg)}
.synbar{display:flex;flex-wrap:wrap;gap:6px}
.synchip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--accent);background:var(--panel);font:600 .74rem var(--body);color:var(--fg)}
.synchip small{font:600 .66rem var(--mono);color:var(--muted)}
.synchip.off{border-style:dashed;border-color:var(--line);opacity:.75}
.synlist{display:grid;gap:6px}
.synrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.synrow.on{border-color:var(--accent)}
.synrow>span{font-size:1.3rem}
.synrow b{display:block;font-size:.9rem}
.synrow small{display:block;color:var(--muted);font-size:.76rem;line-height:1.35}
.xr-note.syn{color:var(--accent)}
/* ----- shop: one card style for everything, grouped into tabs ----- */
.shopsec{display:grid;gap:8px}
.shopsec h3{margin:8px 0 0;font:700 1rem var(--display);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.shopsec h3 small{font:600 .7rem var(--mono);color:var(--muted);font-weight:600}
.shopsec>.ownline{margin:0}
.shop{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.shopitem{background:var(--panel)}
.shopitem .info b{font-size:.92rem}
.shopitem .info .own{font:600 .68rem var(--mono);color:var(--accent)}

/* ----- battle effects ----- */
.arena{position:relative}
.fighter{position:relative}
.fx-lunge-r img{animation:fxLungeR .34s ease-out}
.fx-lunge-l img{animation:fxLungeL .34s ease-out}
@keyframes fxLungeR{40%{transform:translateX(26px) scale(1.1)}}
@keyframes fxLungeL{40%{transform:translateX(-26px) scale(1.1)}}
.fx-cast img{animation:fxCast .4s ease-out}

.fx-hurt img{animation:fxHurt .45s}
@keyframes fxHurt{0%,100%{transform:none;filter:none}12%{transform:translateX(-8px);filter:brightness(2.4) saturate(0)}32%{transform:translateX(7px);filter:brightness(1.2)}52%{transform:translateX(-4px);filter:brightness(1.8) saturate(0)}74%{transform:translateX(2px)}}
.fx-dodge img{animation:fxDodge .45s ease-out}
@keyframes fxDodge{40%{transform:translateX(var(--dodge,16px)) skewX(-10deg);opacity:.45}}
.fx-heal img{animation:fxHeal .65s}
@keyframes fxHeal{50%{filter:drop-shadow(0 0 14px #3ccf7a) brightness(1.2)}}
.fx-buff img{animation:fxBuff .65s}
@keyframes fxBuff{50%{filter:drop-shadow(0 0 14px #ff8a3d) brightness(1.25);transform:scale(1.1)}}
.fx-guard::after{content:'';position:absolute;left:50%;top:48px;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid #6fb7ff;box-shadow:0 0 16px #6fb7ff inset,0 0 10px #6fb7ff;animation:fxShield .75s ease-out forwards;pointer-events:none}
@keyframes fxShield{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:0}}
.fx-ko img{animation:fxKo .8s ease-in forwards}

/* ================= LOOKS: Trainer Card (default), Retro Digivice, and the classic light/dark ================= */
/* --- Trainer Card: cream paper, thick ink outlines, chunky drop shadows, round friendly type --- */
:root[data-skin="card"]{
  --bg:#fff4dc; --panel:#ffffff; --sunk:#fbe8bf; --fg:#1b1b1f; --muted:#5e5440; --line:#1b1b1f; --ink:#1b1b1f;
  --accent:#ff7a45; --accent-ink:#1b1b1f; --link:#1f5fc4; --star:#d99a00; --yellow:#ffd23f; --sky:#45c4ff; --pink:#ff7aa8; --leaf:#8fd16a;
  --good:#2b9a4c; --warn:#c98400; --bad:#d6453d; --grid:rgba(27,27,31,.05); --silf:brightness(0) opacity(.45);
  --display:"Fredoka",ui-rounded,system-ui,sans-serif; --body:"Nunito",ui-rounded,system-ui,sans-serif; --mono:"Nunito",ui-rounded,system-ui,sans-serif;
  --r:16px; --pop:3px 4px 0 var(--ink); color-scheme:light;
}
[data-skin="card"] body{font-weight:600}
[data-skin="card"] #scene::after{background:var(--bg) radial-gradient(#ecd6a6 1.3px,transparent 1.6px) 0 0/18px 18px;opacity:.82}
[data-skin="card"] header{border-bottom:2.5px solid var(--ink)}
[data-skin="card"] .brand{font-family:var(--display);font-weight:700;letter-spacing:0}
[data-skin="card"] :is(h1,h2,h3,h4,h5,.ptop h2){font-family:var(--display);letter-spacing:0;font-weight:700}
[data-skin="card"] :is(.act,.big,.ghost,.favbtn,.card,.meter,.evobox,.habitat,.region,.plot,.ach,.bcell,.shopitem,.diff,.mvrow,.slot,.tnode,.lrow,.seg,.stage,.dailybar,.evbanner,.synchip,.upd,.guide details,.profhead,.profcode,.pstats div,.fighter,.blog,.itile,.search input,.xr,.colomore,.quest,.qcard,.raidboss.ev,.sheet,.bubble,.skytag){border:2.5px solid var(--ink)}
[data-skin="card"] :is(.slot.empty,.plot.empty,.bcell.empty,.colomore,.synchip.off){border-style:dashed}
[data-skin="card"] :is(.act,.big,.ghost,.favbtn,.card,.meter,.evobox,.habitat,.region,.plot,.ach,.bcell,.shopitem,.diff,.dailybar,.evbanner,.profhead,.slot:not(.empty),.tnode,.fighter){box-shadow:var(--pop)}
[data-skin="card"] :is(.act,.big,.ghost,.favbtn,.card,.slot,.seg,.dailybar,.diff,.bcell):active:not(:disabled){transform:translate(2px,3px);box-shadow:0 1px 0 var(--ink)}
[data-skin="card"] :is(.act,.ghost,.favbtn,.card,.meter,.evobox,.region,.plot,.ach,.bcell,.shopitem,.diff,.mvrow,.dailybar,.evbanner,.tnode,.lrow,.xr,.upd,.profhead,.profcode){border-radius:16px}
[data-skin="card"] .act{background:#fff;font-family:var(--display);font-weight:600;font-size:1rem}
[data-skin="card"] .act small{font:700 .7rem var(--body);color:var(--muted)}
[data-skin="card"] .act:disabled{opacity:.5;box-shadow:none}
[data-skin="card"] .act[data-act="battle"]:not(:disabled){background:var(--sky)}
[data-skin="card"] .act[data-act="dungeon"]:not(:disabled){background:var(--leaf)}
[data-skin="card"] .act[data-act="feed"]:not(:disabled){background:#ffe39a}
[data-skin="card"] .act[data-act="train"]:not(:disabled){background:#ffd0ba}
[data-skin="card"] :is(.act[data-act="battle"],.act[data-act="dungeon"],.act[data-act="feed"],.act[data-act="train"]) small{color:#2a2a2e}
[data-skin="card"] .big{background:var(--accent);color:var(--ink);border-radius:18px;font-family:var(--display);font-weight:700;letter-spacing:0}
[data-skin="card"] .ghost{background:#fff;box-shadow:var(--pop)}
[data-skin="card"] .ghost.danger{color:var(--bad)}
[data-skin="card"] .favbtn{background:#fff;font-weight:800}
[data-skin="card"] .stage{background:#fff;color:var(--ink);font:800 .72rem var(--body);letter-spacing:0;text-transform:none;border-width:2px}
[data-skin="card"] .stage.ultra{background:linear-gradient(90deg,#ff7aa8,#9d7bff);color:#fff}
[data-skin="card"] .seg{background:#fff;color:var(--ink);font:800 .78rem var(--body)}
[data-skin="card"] .seg.on{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
[data-skin="card"] .dailybar{background:var(--yellow);color:var(--ink);font-family:var(--display);font-weight:600}
[data-skin="card"] .evbanner{background:#ffe7a3}
[data-skin="card"] .synchip{background:var(--yellow);color:var(--ink)}
[data-skin="card"] .synchip.off{background:#fff}
[data-skin="card"] .synchip small{color:#3a3426}
[data-skin="card"] .ptop h2{font-size:1.9rem}
/* the partner's card: an orange frame around a sky-and-grass scene */
[data-skin="card"] .habitat{background:linear-gradient(#bfe8ff,#e2f5ff 70%);border-width:3px;border-radius:18px;margin:10px;box-shadow:0 0 0 7px var(--accent),0 0 0 9.5px var(--ink),5px 7px 0 9.5px var(--ink)}
[data-skin="card"] .habitat::after{left:-10%;right:-10%;bottom:-38px;height:84px;background:var(--leaf);border-top:2.5px solid var(--ink)}
[data-skin="card"] .habitat.ph-dawn{background:linear-gradient(#ffc9a3,#fff1df 70%)}
[data-skin="card"] .habitat.ph-dusk{background:linear-gradient(#f39a6c,#b38bd6 75%)}
[data-skin="card"] .habitat.ph-night{background:radial-gradient(2px 2px at 18% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 44%,#fffc,transparent),linear-gradient(#1d2a5c,#3c4d8f 75%)}
[data-skin="card"] .habitat.ph-night::after,[data-skin="card"] .habitat.ph-dusk::after{background:#5f9a48}
[data-skin="card"] .bubble{background:#fff;border-radius:14px;font-weight:700}
[data-skin="card"] .skytag{background:#fff;color:var(--ink);font:800 .7rem var(--body);border-width:2px}
[data-skin="card"] .meter{background:#fff}
[data-skin="card"] .meter label{font:800 .78rem var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
[data-skin="card"] :is(.track,.evotrack,.xptrack){height:14px;border:2.5px solid var(--ink);border-radius:8px;background:#fff}
[data-skin="card"] .meters .meter:nth-child(1) .track i{background:var(--yellow)!important}
[data-skin="card"] .meters .meter:nth-child(2) .track i{background:var(--sky)!important}
[data-skin="card"] .meters .meter:nth-child(3) .track i{background:var(--pink)!important}
[data-skin="card"] :is(.track,.evotrack,.xptrack) i{border-right:2.5px solid var(--ink);border-radius:0}
[data-skin="card"] .evobox .row{font:800 .76rem var(--body);color:var(--muted)}
[data-skin="card"] .evobox .statrow span{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 7px;color:var(--ink)}
[data-skin="card"] .tabs{background:var(--ink);border-top:0;padding-inline:4px}
[data-skin="card"] .tabs button{color:#fff4dc;font:600 .74rem var(--display);text-transform:none;border-radius:12px;margin:6px 2px}
[data-skin="card"] .tabs button[aria-selected="true"]{color:var(--ink);background:var(--yellow);box-shadow:none}
[data-skin="card"] .sheet{background:var(--bg);border-radius:22px;box-shadow:0 -4px 0 var(--ink)}
[data-skin="card"] .card .nm{font-family:var(--display);font-weight:600}
[data-skin="card"] .card.raised{border-color:var(--good);box-shadow:3px 4px 0 var(--good)}
[data-skin="card"] .region.here,[data-skin="card"] .diff.on,[data-skin="card"] .mvrow.on,[data-skin="card"] .slot.on{background:#fff2c7;border-color:var(--ink);box-shadow:var(--pop)}
[data-skin="card"] .ownline{color:var(--muted);font-weight:700}

// Walk every page of a list endpoint
async function pageAll(base, onProgress){
  const size = 250, out = [];
  for (let page = 0; page < 40; page++){
    const sep = base.includes('?') ? '&' : '?';
    const d = await getJSON(`${base}${sep}pageSize=${size}&page=${page}`);
    const items = d.content || [];
    out.push(...items);
    const p = d.pageable || {};
    if (onProgress && p.totalElements) onProgress(out.length / p.totalElements, p.totalElements);
    // the API's page count can be one short, so keep going until a page comes back partly empty
    if (!items.length || items.length < size) break;
  }
  return out;
}

async function loadAll(){
  const cached = store.get('dx_list_v2', null);
  if (cached && cached.t > Date.now() - 7*864e5 && cached.items?.length){ setAll(cached.items); }

    showStatus('Loading the database…', true);
    $('#partnerView').innerHTML = '<div class="status">Loading the database…</div>';
    try{

}

// Time passes while you're away, for every Digimon in the party
function tick(){
  const now = Date.now(); let changed = false;
  for (const p of G.party){
    const mins = Math.min((now - p.last) / 60000, 1440);
    if (mins < 0.2) continue;
    const pr = persOf(p), sl = asleep(p), nur = 1 - 0.1 * perk('nurture');
    p.hunger = clamp(p.hunger - mins / 4 * (pr.hunger || 1) * nur * (sl ? 0.35 : 1));
    p.mood = clamp(p.mood - mins / 5 * (pr.mood || 1) * nur * (sl ? 0.3 : 1));
    p.energy = clamp(p.energy + mins / 6 * (pr.energy || 1) * (sl ? (lightsOff() ? 2.5 : 1) : 1));
    p.last = now;
    careTick(p, mins);
    checkNeglect(p); changed = true;
  }
  if (changed) saveGame();
}
function checkNeglect(p){
  for (const k of ['hunger', 'mood']){
    if (p[k] <= 0 && !p.flags[k]){ p.flags[k] = true; p.mistakes++; p.stageMistakes++; addBond(p, -5); p.msg = `${p.name} was ${k === 'hunger' ? 'starving' : 'miserable'} while you were gone. That's a care mistake.`; }
    if (p[k] > 20) p.flags[k] = false;
  }
}

function say(text, anim){

$('#partnerView').addEventListener('click', e => {
  if (busy) return;
  if (e.target.closest('#sprite')){   // tap your partner to hear what it's thinking
    const p = P(), b = $('#bubble'); if (!p || !b) return;
    b.textContent = careLine(p) || chatterLine(p); lastSayT = Date.now();
    const sp = $('#sprite'); if (sp && !asleep(p)){ sp.classList.remove('happy'); void sp.offsetWidth; sp.classList.add('happy'); }
    return;
  }
  const slot = e.target.closest('[data-slot]');
  if (slot){ G.active = +slot.dataset.slot; saveGame(); renderPartner(); $('main').scrollTo(0, 0); return; }
  if (e.target.closest('[data-hatch]')) return hatchOverlay();
  if (e.target.closest('[data-shop]')) return setTab('shop');
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'tamer') return trainerScreen('tamer');
  tick();
  const p = P(); const k = b.dataset.act;
  if (careAction(k, p)) return;
  if (k === 'feed'){
    if (p.hunger > 92){ p.mood = clamp(p.mood - 6); return say(`${p.name} is stuffed and pushes the food away.`); }
    const low = p.hunger < 50;
    p.hunger = clamp(p.hunger + 30); if (low) p.evo += 1; questProgress('care'); addBond(p, 1); bump('cares');
    return say(pick([`${p.name} gobbled it up!`, `Crunch crunch. ${p.name} looks satisfied.`, `${p.name} ate every last bite.`]), 'happy');
  }
  if (k === 'play'){
    if (p.energy < 10) return say(`${p.name} is too tired to play.`);
    const low = p.mood < 60;
    p.mood = clamp(p.mood + 25); p.energy = clamp(p.energy - 10); p.hunger = clamp(p.hunger - 4); if (low) p.evo += 1; questProgress('care'); addBond(p, 1); bump('cares');
    return say(pick([`You and ${p.name} played tag. It's having a great time!`, `${p.name} chased the ball around and around.`, `${p.name} is laughing!`]), 'happy');
  }
  if (k === 'rest'){
    if (p.energy > 90) return say(`${p.name} isn't sleepy.`);
    p.energy = clamp(p.energy + 40); p.hunger = clamp(p.hunger - 5);
    return say(`${p.name} curled up for a nap. Zzz…`);
  }
  if (k === 'train') return train();
  if (k === 'battle') return pickDifficulty('battle');
  if (k === 'dungeon') return pickDifficulty('dungeon');
  if (k === 'moves') return movesScreen();
  if (k === 'paths') return pathsScreen();
  if (k === 'bag') return bagScreen();
  if (k === 'tree') return treeScreen();
  if (k === 'jogress') return jogressScreen();
  if (k === 'syn') return synergyScreen();
  if (k === 'daily') return trainerScreen('daily');
  if (k === 'line') return openDetail(p.id, false);
});

function hatchNew(type = 'mystery', toBox, forcedId){
  const def = SHOP.find(x => x.key === type) || SHOP[0], st = def.stage || 0;
  let pool = (state.stageIds[st] || []).filter(id => state.byId.has(id) && !state.armor.has(id));
  if (EGG_RE[type]){ const f = pool.filter(id => { const n = state.byId.get(id).name; return EGG_RE[type].test(n) && !(type === 'dark' && /White/.test(n)); }); if (f.length) pool = f; }
  if (!pool.length) pool = state.stageIds[0].filter(id => state.byId.has(id));
  const inParty = new Set(G.party.map(m => m.id));
  // rare and golden eggs: a Digimon you have never discovered; otherwise favor ones you haven't raised
  const undiscovered = pool.filter(id => !known(id) && !inParty.has(id));
  const fresh = pool.filter(id => !raised(id) && !inParty.has(id));
  const from = (type === 'rare' || type === 'golden') && undiscovered.length ? undiscovered : fresh.length ? fresh : pool;
  const id = forcedId && state.byId.has(forcedId) ? forcedId : pick(from.concat(from.filter(x => EGG_ORPHANS.has(x))));
  let m;
  if (toBox){ m = makePartner(id); G.box.push(m); } else { newPartner(id); m = P(); }
  questProgress('hatch'); bump('hatches');
  if (st){ m.stage = st; m.stageLine = [st]; m.level = Math.max(m.level || 1, STAGE_MIN_LV[st]); m.xp = 0; syncMoves(m); }
  if (type === 'rare'){ const g = growthOf(m); g.hp += 6; g.sp += 2; g.atk += 2; g.int += 2; g.spd += 2; m.mood = 90; }
  if (type === 'golden'){ const g = growthOf(m); g.hp += 20; g.sp += 5; ['atk', 'int', 'def', 'spd'].forEach(k => g[k] = (g[k] || 0) + 4); m.mood = 100; m.bond = 40; m.held = randomHeld(); }
  if (type === 'lucky'){ m.bond = 25; m.held = randomHeld(); m.mood = 90; }
  saveGame();
  return m;
}

async function collectExpeditions(list){
  busy = true;
  const res = [], synOf = new Map(list.map(m => [m, expSynergies(m)]));
  const teamOf = new Map(list.map(m => [m, m.exp && m.exp.team ? list.filter(o => o.exp && o.exp.team === m.exp.team) : null]));
  for (const m of list){
    if (!expDone(m)) continue;
    const ex = EXPEDITIONS.find(x => x.key === m.exp.key) || EXPEDITIONS[0], syn = synOf.get(m) || [], sb = syn.length;
    const team = teamOf.get(m);
    const ok = Math.random() < Math.min(0.99, expOdds(m, ex, team) + SYN_EXP.odds * sb), est = expEstimate(m, ex), rough = ex.hard ? 0.3 : 0.5;
    const data = Math.round(est.data * rand(0.85, 1.15) * (ok ? 1 : rough) * (evOn('data') ? 2 : 1) * (1 + 0.1 * perk('scav')) * (1 + SYN_EXP.data * sb)), xp = Math.round(est.xp * (ok ? 1 : rough) * (1 + SYN_EXP.xp * sb));
    G.data += data;
    const loot = [], got = (icon, name, tier) => loot.push({ icon, name, tier: tier || '' });
    if (ok && ex.egg && Math.random() < Math.min(0.9, ex.egg * (evOn('eggs') ? 3 : 1) * (1 + 0.15 * perk('eggs')))){
      const rare = Math.random() < ex.rare / ex.egg, r2 = Math.random();
      const k = rare ? 'rare' : ex.eggPool && r2 < 0.75 ? pick(ex.eggPool) : ex.key === 'dark' && r2 < 0.5 ? pick(['rookie', 'dragon', 'dark', 'xegg', 'lucky', ...Object.keys(ELEMS).map(k => 'e' + k)]) : ex.key === 'ruins' && r2 < 0.3 ? pick(['lucky', 'rookie']) : 'mystery';
      G.eggs.push(k); got('🥚', eggName(k), k === 'rare' ? 'epic' : 'rare');
    }
    if (ok && ex.relic && Math.random() < ex.relic){ const k = randomDigimental(); giveItem(k); got(itemIcon(k), itemName(k), 'rare'); }
    if (ok && ex.crest && Math.random() < ex.crest){ const k = randomCrest(); if (k){ giveItem(k); got(itemIcon(k), itemName(k), 'epic'); } }
    if (ok && ex.disc && Math.random() < ex.disc){ const k = randomDisc(); giveItem(k); got('💿', itemName(k), 'epic'); }
    if (ok && ex.held && Math.random() < ex.held){ const k = randomHeld(); giveItem(k); got(itemIcon(k), itemName(k), 'epic'); }
    if (ok && ex.xab && Math.random() < ex.xab){ giveItem('xab'); got(itemIcon('xab'), itemName('xab'), 'epic'); }
    if (ex.chip && Math.random() < ex.chip * (ok ? 1 : 0.5)){ const k = randomChip(); giveItem(k); got(itemIcon(k), itemName(k)); }
    if (ex.clean && Math.random() < ex.clean * (ok ? 1 : 0.5)){ giveItem('clean'); got(itemIcon('clean'), itemName('clean')); }
    if (ok && ex.key !== 'fields' && Math.random() < (ex.key === 'dark' || ex.hard ? 0.15 : 0.06)){ giveItem('pers:?'); got(itemIcon('pers:?'), itemName('pers:?')); }
    const pool = (state.stageIds[m.stage] || []).filter(id => state.byId.has(id) && !known(id));
    const seen = [];
    for (let k = 0; k < ex.finds && pool.length; k++){ const id = pick(pool); if (!known(id)){ G.col[id] = 'seen'; const d = state.byId.get(id); seen.push({ name: d.name, image: d.image }); } }
    if (ok && ex.hard){ bump('hardExps'); if (ex.key === 'kernel') bump('kernelOk'); }
    nfCancel(nfUid(m)); m.exp = null;
    const lv = await gainXP(m, xp);
    questProgress('exp'); bump('exps');
    res.push({ m, ex, ok, data, xp: lv.gained, lv, loot, seen, syn });
  }
  saveGame();
  const XR_ICON = { fields: '🌾', ruins: '🏛️', dark: '🌑', volcano: '🌋', abyss: '🌊', storm: '🌪️', kernel: '💠' };
  const card = (r, n) => {
    const up = r.lv && r.lv.ups.length ? r.lv.ups[r.lv.ups.length - 1] : 0;
    return '<div class="xr ' + r.ex.key + (r.ok ? '' : ' rough') + '" style="--d:' + n * 140 + 'ms">' +
      '<div class="xr-top"><img class="xr-pic" alt="" src="' + esc(r.m.image) + '"><div class="xr-id"><b>' + esc(r.m.name) + '</b><span>' + XR_ICON[r.ex.key] + ' ' + esc(r.ex.name) + '</span></div>' +
      '<span class="xr-badge">' + (r.ok ? '✓ Smooth trip' : '⚠ Rough trip') + '</span></div>' +
      '<div class="xr-body">' +
      '<div class="xr-stats"><span class="xr-stat data"><b data-count="' + r.data + '">+' + r.data + '</b><small>💾 DigiData</small></span><span class="xr-stat xp"><b data-count="' + r.xp + '">+' + r.xp + '</b><small>⭐ XP</small></span>' +
      (up ? '<span class="xr-stat up"><b>Lv ' + up + '</b><small>⬆ Level up!</small></span>' : '') + '</div>' +
      (r.lv && r.lv.learned.length ? '<p class="xr-note learn">✨ Learned ' + esc(r.lv.learned.join(', ')) + '!</p>' : '') +
      (r.syn && r.syn.length ? '<p class="xr-note syn">🔗 ' + r.syn.map(a => a.g.icon + ' ' + esc(a.g.name)).join(', ') + ' synergy: +' + Math.round(SYN_EXP.data * r.syn.length * 100) + '% DigiData & XP</p>' : '') +
      (r.loot.length ? '<p class="xr-h">Found</p><div class="xr-loot">' + r.loot.map((it, i) => '<span class="xr-item ' + it.tier + '" style="--i:' + i + '"><i>' + it.icon + '</i><small>' + esc(it.name) + '</small></span>').join('') + '</div>' : '<p class="xr-none">No items this time.</p>') +
      (r.seen.length ? '<p class="xr-h">Spotted · added to your Digidex</p><div class="xr-seen">' + r.seen.map(s => '<span><img alt="" src="' + esc(s.image) + '">' + esc(s.name) + '</span>').join('') + '</div>' : '') +
      (r.ok ? '' : r.ex.need ? '<p class="xr-note">Ran into trouble, so it only brought back 30% of the rewards. Stronger stats (' + Object.keys(r.ex.need).map(k => EXP_STAT[k]).join(', ') + ') make this trip safer.</p>' : '<p class="xr-note">Ran into trouble, so rewards were halved. Higher levels make trips safer.</p>') +
      '</div></div>';
  };
  const tot = res.reduce((a, r) => (a.data += r.data, a.xp += r.xp, a.loot += r.loot.length, a), { data: 0, xp: 0, loot: 0 });
  const sum = res.length > 1 ? '<div class="xsum"><span>🧭 <b>' + res.length + '</b> teams back</span><span class="xs-data">💾 <b>+' + tot.data + '</b></span><span class="xs-xp">⭐ <b>+' + tot.xp + '</b> XP</span><span class="xs-loot">🎁 <b>' + tot.loot + '</b> item' + (tot.loot === 1 ? '' : 's') + '</span></div>' : '';
  openOv('<h4>' + (res.length ? 'Expedition results' : 'Nothing to collect yet') + '</h4>' + sum + '<div class="xrs">' + res.map(card).join('') + '</div><button class="big" id="exDone">' + (tot.loot ? 'Nice haul!' : 'Nice!') + '</button>');
  // count the numbers up as each card lands
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) $('#overlay').querySelectorAll('[data-count]').forEach((b, i) => {
    const to = +b.dataset.count, t0 = performance.now() + Math.floor(i / 2) * 140 + 200;
    b.textContent = '+0';
    const step = t => { const k = Math.min(1, Math.max(0, (t - t0) / 700)); b.textContent = '+' + Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1 && b.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  $('#exDone').onclick = () => { closeOv(); renderBox(); updateCount(); };
}

// rebirth: a Lv 40+ Mega goes back to the first Digimon of its line as a new generation: +6% to every stat per generation (up to 5),
// keeps 30% of its trained stats, half its bond, all its moves and its held item
function rebirth(m){
  const first = (m.line || []).find(id => state.byId.has(id)) || m.id, b = state.byId.get(first), st = (m.stageLine || [0])[0] || 0;
  const g = growthOf(m); Object.keys(g).forEach(k => g[k] = Math.round((g[k] || 0) * 0.3));
  const prev = m.name;
  Object.assign(m, { id: first, name: b.name, image: b.image, stage: st, level: STAGE_MIN_LV[st] || 1, xp: 0, evo: 0, mistakes: 0, stageMistakes: 0, stageLosses: 0, stageWins: 0,
    line: [first], stageLine: [st], final: false, ultra: false, gen: Math.min(5, (m.gen || 0) + 1), bond: Math.round((m.bond || 0) / 2), streak: 0, born: Date.now(), last: Date.now(), flags: {} });
  bump('rebirths'); G.col[first] = 'raised';
  say('🥚 ' + prev + ' was reborn as ' + m.name + ' (Gen ' + (m.gen + 1) + ')! Every stat is now +' + Math.round(6 * m.gen) + '% for good.', 'happy');
}
function sendToBox(){
  const p = P(); if (!p || busy) return;
  if (G.party.length < 2){ say('Keep at least one Digimon in your party.'); return; }
  if (G.box.length >= G.boxCap){ say('Your Box is full. Buy more slots in the Shop.'); return; }
  G.party.splice(G.active, 1); G.box.push(p);
  G.active = Math.max(0, Math.min(G.active, G.party.length - 1));
  saveGame(); say(p.name + ' was sent to the Box to rest.');
}

// ----- party: up to 6 Digimon, tap one to make it active -----
function partyBar(){
  const slots = [];
  for (let i = 0; i < PARTY_MAX; i++){
    const m = G.party[i];
    if (m){
      const flag = m.hunger < 25 || m.mood < 25 ? '!' : canEvolve(m) ? '▲' : '';
      slots.push(`<button class="slot${i === G.active ? ' on' : ''}" data-slot="${i}" aria-label="${esc(m.name)}${i === G.active ? ' (active)' : ''}"><img alt="" src="${esc(m.image)}"><small>${esc(m.name)}</small>${flag ? `<i title="${flag === '!' ? 'Needs care' : 'Ready to digivolve'}">${flag}</i>` : ''}</button>`);
    } else if (G.party.length < i) slots.push('<span class="slot empty ghostslot" aria-hidden="true"></span>');
    else slots.push(G.eggs.length
      ? `<button class="slot empty" data-hatch="1" aria-label="Hatch a stored egg into this slot"><span>+</span><small>Hatch</small></button>`
      : `<button class="slot empty" data-shop="1" aria-label="Get an egg in the shop"><span>+</span><small>Get egg</small></button>`);
  }
  return `<div class="party" aria-label="Your party">${slots.join('')}</div>`;
}
function hatchOverlay(type){
  if (G.party.length >= PARTY_MAX || !G.eggs.length) return;
  const kinds = SHOP.map(x => x.key).filter(k => G.eggs.includes(k));
  if (!type && kinds.length > 1){
    busy = true;
    openOv('<h4>Choose an egg to hatch</h4><div class="eggpick">' + kinds.map(k => '<button class="eggopt" data-egg="' + k + '"><span class="egg mini ' + k + '" aria-hidden="true"></span><b>' + esc(eggName(k)) + '</b><small>×' + G.eggs.filter(e => e === k).length + '</small></button>').join('') + '</div><button class="ghost" id="eggCancel">Not now</button>');
    $('#eggCancel').onclick = closeOv;
    $('#overlay').querySelectorAll('[data-egg]').forEach(b => b.onclick = () => { closeOv(); hatchOverlay(b.dataset.egg); });
    return;
  }
  type = type && G.eggs.includes(type) ? type : G.eggs[0];
  busy = true;
  const item = SHOP.find(x => x.key === type) || SHOP[0];

function retire(){
  const p = P(); if (!p) return;
  const value = releaseValue(p);
  G.history.push({ line: p.line.map(id => state.byId.get(id)?.name || '?'), wins: p.wins, date: Date.now(), data: value });
  G.party.splice(G.active, 1);
  G.data += value;
  G.active = Math.max(0, Math.min(G.active, G.party.length - 1));
  saveGame();
  if (P()) say(`${p.name} was released and left behind ${value} DigiData.`);
  else renderPartner();
}

// ----- de-digivolve: step back one form to try a different branch -----
function dedigivolve(){
  const p = P(); if (busy || p.line.length < 2) return;
  const stages = p.stageLine || p.line.map((_, i) => i);
  p.line.pop(); stages.pop();
  const id = p.line[p.line.length - 1]; const b = state.byId.get(id);
  const from = p.name;
  p.id = id; p.name = b.name; p.image = b.image;
  p.stage = stages[stages.length - 1] ?? Math.max(0, p.stage - 1);
  p.stageLine = stages; p.evo = 0; p.stageMistakes = 0; p.stageWins = 0; p.stageLosses = 0; p.final = false;
  say(`${from} de-digivolved back into ${b.name}. Raise it again to try a different path!`, 'happy');
}

}

function trainGame(kind, hard){

  const zoneW = [28, 26, 23, 20, 17, 15][p.stage] * (hard ? 0.62 : 1);
  let round = 0, hits = 0, pos = 0, dir = 1, raf = 0, zoneL = 0, waiting = false;
  const results = [];
  const speed = () => (0.9 + round * 0.35 + p.stage * 0.12) * (hard ? 1.4 : 1);
  $('#overlay .sheet').innerHTML = `<h4>${t.icon} ${t.name} training${hard ? ' <span class="stage">🔥 Hard</span>' : ''}</h4>
    <p style="margin:0;color:var(--muted)">Tap <b>Hit!</b> when the marker is inside the green zone.</p>
    <div class="tmeter"><span class="zone" id="zone"></span><span class="mark" id="mark"></span></div>
    <div class="dots" id="dots">○ ○ ○</div>
    <button class="big" id="hit">Hit!</button>`;
  const placeZone = () => { zoneL = rand(5, 95 - zoneW); const z = $('#zone'); z.style.left = zoneL + '%'; z.style.width = zoneW + '%'; };
  const dots = () => { $('#dots').textContent = [0,1,2].map(i => i < round ? (results[i] ? '●' : '✕') : '○').join(' '); };
  // move by elapsed time, not per frame, so 120/144 Hz screens aren't faster than 60 Hz phones
  let lastT = 0;
  const loop = t => { const dt = lastT ? Math.min(50, t - lastT) : 16.67; lastT = t; pos += dir * speed() * dt / 16.67; if (pos >= 100){ pos = 100; dir = -1; } if (pos <= 0){ pos = 0; dir = 1; } $('#mark').style.left = pos + '%'; raf = requestAnimationFrame(loop); };
  placeZone(); raf = requestAnimationFrame(loop);
  $('#hit').onclick = async () => {
    if (waiting) return;
    const ok = pos >= zoneL && pos <= zoneL + zoneW;
    results.push(ok); if (ok) hits++; round++; dots();
    if (round < 3){ waiting = true; cancelAnimationFrame(raf); await sleep(350); placeZone(); waiting = false; lastT = 0; raf = requestAnimationFrame(loop); return; }
    cancelAnimationFrame(raf);
    const g = growthOf(p), per = 1 + Math.floor(p.stage / 2), bonus = hits && p.mood > 60 ? 1 : 0;
    const mult = hard ? 2 : 1, boost = x => hits ? Math.max(x * mult, Math.round(x * mult * (1 + 0.15 * perk('drill')))) : 0;
    let gained;
    if (kind === 'hp'){ const h = boost(hits * per * 4 + bonus * 2); g.hp = (g.hp || 0) + h; gained = '+' + h + ' HP'; }
    else if (kind === 'sp'){ const s = boost(hits * per * 2 + bonus); g.sp = (g.sp || 0) + s; gained = '+' + s + ' SP'; }
    else { const v = boost(hits * per + bonus + (hits && evOn('xp') ? 1 : 0)); g[kind] = (g[kind] || 0) + v; gained = '+' + v + ' ' + STAT_LABEL[kind]; }
    p.evo += hits * mult + (hits ? perk('evo') : 0); p.energy = clamp(p.energy - trainCost(hard)); p.hunger = clamp(p.hunger - (hard ? 15 : 10)); bump('trains', mult);
    questProgress('train'); if (hits === 3){ questProgress('perfect'); bump('perfects'); } if (hits) addBond(p, 1);
    if (!hits) p.mood = clamp(p.mood - 6);
    saveGame();
    $('#hit').textContent = 'Done';
    const lvr = await gainXP(p, (hits * 3 + 1) * (hard ? 2 : 1));
    $('#hit').onclick = () => { closeOv(); say((hits === 3 ? `Perfect training! ${p.name} gained ${gained}.` : hits ? `Good effort! ${p.name} gained ${gained}.` : `${p.name} missed every hit and looks discouraged.`) + levelText(lvr), hits ? 'happy' : null); };
  };
}

const STAGE_MIN_LV = [1, 5, 10, 18, 26, 35];

const xpCatchUp = p => (p.level || 1) < (STAGE_MIN_LV[p.stage] || 1) + 4 ? 1.5 : 1;
// raise a Digimon to its stage's starting level; returns the new level if it went up
function stageFloor(p){ const f = STAGE_MIN_LV[p.stage] || 1; if (!p.level || p.level < f){ p.level = f; p.xp = 0; return f; } return 0; }
const BASIC = { name: 'Tackle', kind: 'phys', power: 1, desc: 'A basic body attack. Costs no SP.' };
const GUARD = { name: 'Guard', kind: 'guard', power: 0, cost: 0 };
const KIND_LABEL = { phys: 'PHY', mag: 'MAG', heal: 'HEAL', buff: 'BUFF', drain: 'DRAIN', guard: 'GRD' };
const kindLabel = m => m.kind === 'buff' && moveTrait(m) === 'shield' ? 'GUARD' : m.kind === 'buff' && moveTrait(m) === 'haste' ? 'SPD' : m.kind === 'buff' && moveTrait(m) === 'focus' ? 'FOCUS' : KIND_LABEL[m.kind];
const GENERIC = [
  { name: 'Data Shot', kind: 'mag', power: 1.3, desc: 'Fires a compact burst of data.' },
  { name: 'Quick Strike', kind: 'phys', power: 1.3, desc: 'A fast physical hit.' },
  { name: 'Patch Up', kind: 'heal', power: 0.35, desc: 'Repairs damaged data, restoring HP.' },
  { name: 'Power Charge', kind: 'buff', power: 1.25, desc: 'Boosts all damage for the rest of the battle.' },
  { name: 'Byte Drain', kind: 'drain', power: 1.2, desc: 'Steals data from the foe to restore HP.' },
  { name: 'Heavy Slam', kind: 'phys', power: 1.9, desc: 'A crushing full-body slam.' },
  { name: 'Pulse Wave', kind: 'mag', power: 1.9, desc: 'A wave of digital energy.' },
];
function moveKind(name, desc){
  const t = (name + ' ' + (desc || '')).toLowerCase();
  if (/(heals|healing|heal |recover|restores|cures|revive)/.test(t)) return 'heal';
  if (/(drain|absorb|steals|leech)/.test(t)) return 'drain';
  if (/(powers? up|boosts|strengthen|increases|raises|barrier|shield)/.test(t)) return 'buff';
  if (/(punch|kick|claw|bite|tackle|slash|strike|horn|charge|fist|blade|sword|tail|ram|crush|smash|fang|head|lance|spear|axe|knuckle|chop|slam|stomp|body|cut|scratch|spin|drill|hammer|whip|jab|uppercut|talon)/.test(t)) return 'phys';

const learnCache = new Map();
function learnset(id, d, stage){
  const key = id + '|' + stage + '|' + (d ? 1 : 0);
  if (learnCache.has(key)) return learnCache.get(key);
  const base = STAGE_MIN_LV[stage] || 1, offs = [1, 3, 5, 7, 9, 12];
  const list = (d?.skills || []).filter(s => s.skill).slice(0, 6).map((s, i) => {

    const kind = moveKind(name, s.description);
    const power = kind === 'heal' ? 0.3 + i * 0.03 : kind === 'buff' ? 1.25 : Math.min(2.8, 1.35 + i * 0.3 + stage * 0.05);
    return { name, kind, power: Math.round(power * 100) / 100, learn: base + offs[i], desc: s.description || '' };
  });

  for (let i = 0; list.length < 3 && i < 4; i++){
    const g = GENERIC[Math.floor(Math.abs(seeded(id, 20 + i + stage)) * GENERIC.length) % GENERIC.length];
    if (!list.some(m => m.name === g.name)) list.push(Object.assign({}, g, { learn: base + 2 + i * 3 }));

function moveCost(m, stage){

// what a move actually does, in plain words (matches doMove)

function initMoves(p){
  if (!p.level){ p.level = STAGE_MIN_LV[p.stage] || 1; p.xp = 0; }
  if (!Array.isArray(p.moves)){ p.moves = [Object.assign({}, BASIC)]; p.equip = [BASIC.name]; }
  if (!Array.isArray(p.equip)) p.equip = [BASIC.name];

function partnerMoves(p){
  initMoves(p);
  const eq = p.equip.map(n => p.moves.find(m => m.name === n)).filter(Boolean);
  if (!eq.length) eq.push(BASIC);
  // the free move always comes first so walking into enemies uses it
  eq.sort((a, b) => moveCost(a, p.stage) - moveCost(b, p.stage));
  return eq.map(m => toBattle(m, p.stage)).concat([GUARD]);
}
async function syncMoves(p){

    if (m.learn > p.level || p.moves.some(k => k.name === m.name)) continue;
    p.moves.push({ name: m.name, kind: m.kind, power: m.power, desc: m.desc });
    let swapNote = '';
    if (p.equip.length < 4) p.equip.push(m.name);

  const buff = usable.find(m => m.kind === 'buff' && !(moveTrait(m) === 'shield' && f.shield > 0) && !(moveTrait(m) === 'haste' && (f.hasted || 0) >= 2) && !(moveTrait(m) === 'focus' && f.focus));
  if (buff && (f.buff || 1) < 1.3 && f.hp > f.st.hp * (moveTrait(buff) === 'shield' ? 0.3 : 0.6) && Math.random() < 0.3) return buff;
  if (heal && f.status && f.status.k !== 'slp' && f.hp < f.st.hp * 0.7 && Math.random() < 0.4) return heal;
  const dmg = usable.filter(m => m.kind === 'phys' || m.kind === 'mag' || m.kind === 'drain');
  if (!dmg.length || (f.hp < f.st.hp * 0.3 && Math.random() < 0.15)) return guard;
  const score = m => (m.kind === 'phys' ? f.st.atk : f.st.int) * m.power * traitPow(moveTrait(m), me) * (0.7 + Math.random() * 0.6);
  return dmg.sort((a, b) => score(b) - score(a))[0];
}

var FX_COL = { fire: '#ff7a2f', water: '#3fa9ff', plant: '#3ccf7a', wind: '#8fe3cf', machine: '#b8c2d6', beast: '#e6a85c', holy: '#ffe36e', dark: '#a65cff' };
const fxCalm = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch{ return false; } };
function fxClass(el, c, ms){ if (!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); setTimeout(() => el.classList.remove(c), ms || 700); }
function fxFloat(el, text, cls){ if (!el) return; const s = document.createElement('span'); s.className = 'fxnum ' + (cls || ''); s.textContent = text; el.appendChild(s); setTimeout(() => s.remove(), 1150); }
function fxCenter(el, box){ const a = el.querySelector('img') || el, r = a.getBoundingClientRect(), b = box.getBoundingClientRect(); return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2]; }

async function moveFx(aSel, dSel, mv, r, elem, onHit){

      try{ await p.animate([{ transform: tf(x0, y0, .5, 0), opacity: .4 }, { transform: tf((x0 + x1) / 2, Math.min(y0, y1) - 36, 1.25, dir * 180), opacity: 1, offset: .5 }, { transform: tf(x1, y1, 1, dir * 360), opacity: 1 }], { duration: 400 / bSpeed(), easing: 'ease-in' }).finished; }catch{ await sleep(400); }
      p.remove();

  }
  if (r.miss){ D.style.setProperty('--dodge', (dir * 18) + 'px'); fxClass(D, 'fx-dodge', 500); fxFloat(D, 'MISS', 'miss'); hit(); await sleep(calm ? 200 : 480); return; }
  if (!calm){
    const [x1, y1] = fxCenter(D, box), b = document.createElement('span');

    b.style.left = x1 + 'px'; b.style.top = y1 + 'px'; box.appendChild(b); setTimeout(() => b.remove(), 650);
  }

  if (r.am > 1) setTimeout(() => fxFloat(D, 'Super effective!', 'info'), 140); else if (r.am < 1) setTimeout(() => fxFloat(D, 'Not very effective', 'info dim'), 140);
  if (mv.kind === 'drain' && r.heal) fxFloat(A, '+' + r.heal, 'heal');
  if (r.crit && !calm){ fxClass(box.closest('.sheet'), 'fx-shake', 450); const f = document.createElement('span'); f.className = 'fxflash'; box.appendChild(f); setTimeout(() => f.remove(), 320); }
  await sleep(calm ? 260 : 560);
}

const DIFFS = [

// win streaks: every win in a row adds +15% evo points (up to +150%) and +5% DigiData (up to +50%)

const ULTRA_IDS = [123, 132, 156, 170, 183, 248, 272, 274, 323, 357, 361, 374, 405, 420, 422, 430, 435, 445, 457, 468, 480, 481, 497, 536, 559, 576, 602, 620, 637, 648, 650, 658, 686, 725, 729, 739, 757,
  782, 783, 784, 819, 831, 847, 848, 854, 855, 894, 895, 904, 913, 917, 930, 961, 1019, 1036, 1043, 1049, 1061, 1063, 1098, 1103, 1110, 1118, 1127, 1147, 1171, 1176, 1189, 1190, 1196, 1197, 1209,
  1210, 1212, 1221, 1235, 1244, 1245, 1330, 1413, 1418, 1419, 1438, 1444, 1445, 1453, 1456, 1462, 1468, 1470, 1473, 1488];
const NIGHTMARE_ULTRA = 0.25, ULTRA_REWARD = 1.5;
const ultraPool = () => ULTRA_IDS.filter(id => state.byId.has(id) && inStage(id, 5) && !inStage(id, 4));
function wildLabel(diff){
  const t = WILD_STAGES[diff.key] || [], main = t.filter(([, c]) => c >= 0.3).map(([st]) => stageName(st)), rare = t.filter(([, c]) => c < 0.3).map(([st]) => stageName(st));

// the stage you'll usually face, for showing rewards
const wildMainStage = diff => (WILD_STAGES[diff.key] || [[2, 1]]).reduce((a, b) => b[1] > a[1] ? b : a)[0];

    g[k] = (g[k] || 0) + v;
    const ev = evoWin(p, diff), dd = Math.round((1 + 0.05 * Math.min(p.streak || 0, 10)) * (4 + 3 * fStage) * diff.reward * (heldOf(p) === 'h:charm' ? 1.3 : 1) * R.reward * (evOn('data') ? 2 : 1) * (rareUp ? 3 : 1) * (rareEnc ? 2 : 1) * (ultraFoe ? ULTRA_REWARD : 1) * (1 + 0.1 * perk('scav')));
    bump('wins'); addBond(p, 2);
    questProgress('win'); if (diff.key === 'hard' || diff.key === 'nightmare') questProgress('winHard');
    if (wild && diff.key === 'nightmare') bump('nmWins'); if (ultraFoe) bump('ultraWins');
    p.wins++; p.stageWins = (p.stageWins || 0) + 1; p.evo += ev + perk('evo'); p.mood = clamp(p.mood + 8); G.data += dd;
    p.streak = (p.streak || 0) + 1; G.stats = G.stats || {}; G.stats.bestStreak = Math.max(G.stats.bestStreak || 0, p.streak);
    summary = p.name + ' won! +' + ev + ' digivolution points, +' + v + ' ' + STAT_LABEL[k] + ', +' + dd + ' DigiData.';
    if (p.streak >= 2) summary += ' 🔥 ' + p.streak + '-win streak! Next win: +' + Math.round((streakMul(p.streak) - 1) * 100) + '% evo points.';
    if (STREAK_GIFTS[p.streak]){ G.data += STREAK_GIFTS[p.streak]; summary += ' Streak bonus: +' + STREAK_GIFTS[p.streak] + ' DigiData!'; }
    if (diff.battleEgg && Math.random() < diff.battleEgg * (1 + 0.15 * perk('eggs'))){ G.eggs.push(diff.rare ? 'rare' : 'mystery'); summary += ' It dropped ' + (diff.rare ? 'a Rare Mystery Egg!' : 'a Mystery Egg!'); }
    if (diff.battleEgg && Math.random() < diff.battleEgg * 0.8){ const it = randomDigimental(); giveItem(it); summary += ' Found a ' + itemName(it) + '!'; }
    const rd = regionDrop(); if (rd){ grantItem(rd); summary += ' Found ' + itemIcon(rd) + ' ' + itemName(rd) + '!'; }
    if (Math.random() < (diff.key === 'nightmare' ? 0.12 : diff.key === 'hard' ? 0.06 : 0)){ const dk = randomDisc(); giveItem(dk); summary += ' Found 💿 ' + itemName(dk) + '!'; }
    if (rareEnc){ bump('rareEnc'); if (Math.random() < 0.3){ G.eggs.push('mystery'); summary += ' ✨ The rare Digimon left a Mystery Egg!'; } }
    if (evOn('eggs') && Math.random() < 0.12){ G.eggs.push('mystery'); summary += ' Egg Hunt: found a Mystery Egg!'; }
  } else if (outcome === 'lose'){ const lost = p.streak || 0; p.streak = 0; p.losses++; p.stageLosses = (p.stageLosses || 0) + 1; p.evo += 1; p.mood = clamp(p.mood - 10); summary = `${p.name} was defeated… Train up and try again.` + (lost >= 2 ? ` Its ${lost}-win streak ended.` : ''); }
  else summary = `${p.name} escaped from ${foe.name}.`;
  saveGame();
  const xp = Math.round((outcome === 'win' ? 10 + fStage * 6 : outcome === 'lose' ? 3 + fStage * 2 : 0) * diff.reward * (rareUp && outcome === 'win' ? 3 : 1) * (rareEnc && outcome === 'win' ? 2 : 1) * (ultraFoe && outcome === 'win' ? ULTRA_REWARD : 1) * (curWeather().xp || 1));
  if (xp){ const lv = await gainXP(p, xp); summary += ' +' + lv.gained + ' XP.' + levelText(lv); }
  $('#bact').innerHTML = `<button class="big" id="bDone">Continue</button>`;
  log(summary);
  $('#bDone').onclick = () => { closeOv(); say(outcome === 'win' ? `${p.name} beat ${foe.name}!` : outcome === 'lose' ? `${p.name} lost to ${foe.name}.` : `${p.name} ran from ${foe.name}.`, outcome === 'win' ? 'happy' : null); };
}

  storm:  { label: 'thunderstorm', re: /(Elecmon|Thunder|Raijin|Volt|Kabuterimon|Sparkmon|Raidramon|Plasma|Mihiramon|Pteramon)/i },
  fog:    { label: 'foggy', re: /(Wizardmon|Witchmon|Phantomon|Soulmon|Bakemon|Myotismon|Vamdemon|Sorcerimon|Ghost|Mist)/i },
  aurora: { label: 'aurora', re: /(Angemon|Angewomon|Holy|Seraphimon|Ophanimon|Unimon|Pegasusmon|Nefertimon|Lucemon|Magnamon|Shine)/ },
  sunny:  { label: 'sunny', re: /(Piyomon|Birdramon|Garudamon|Hououmon|Flare|Sunflowmon|Coronamon|Firamon|Flaremon|Apollomon|Meramon)/ },
  wind:   { label: 'windy', re: /(Hawkmon|Aquilamon|Kazemon|Zephyrmon|Wind|Sparrowmon|Falcomon|Peckmon|Crowmon|Harpymon|Parrotmon)/ },
  night:  { label: 'midnight', re: /(Devimon|Vamdemon|Bakemon|Phantomon|Pumpkinmon|Candlemon|Fantomon|Skull|Black|Dark|Night)/ },
};
const RARE_CHANCE = 0.1;
function rareEncounter(st, pid){
  const w = curWeather().key, t = RARE_ENC[w] || (dayPhase() === 'night' ? RARE_ENC.night : null);
  if (!t || Math.random() >= RARE_CHANCE) return null;
  for (const s2 of [st, st + 1, st - 1]){
    const pool = (state.stageIds[s2] || []).filter(id => id !== pid && state.byId.has(id) && !isExtra(id) && t.re.test(state.byId.get(id).name));
    if (pool.length) return { id: pick(pool), label: t.label };
