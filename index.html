const dgKeys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
document.addEventListener('keydown', e => {
  if (!dg || dg.over) return;
  if (dgKeys[e.key]){ e.preventDefault(); dgAct('move', DIRS[dgKeys[e.key]]); }
  else if (e.key === ' '){ e.preventDefault(); dgAct('wait'); }
  else if (e.key === 'q'){ dgAct('skill'); }
});

function dgDraw(){
  const cv = $('#dgc'); if (!cv || !dg) return;
  const m = dg.me, a = dg.ally;
  const head = $('#dhead');
  const bar = (v, max, cls) => '<span class="dbar ' + cls + '"><i style="width:' + Math.max(0, v / max * 100) + '%"></i></span>';
  if (head) head.innerHTML = '<b>B' + dg.floor + 'F</b>' +
    '<span>' + esc(m.name) + ' HP ' + m.hp + '/' + m.max + bar(m.hp, m.max, 'h') + '</span>' +
    '<span>SP ' + m.sp + '/' + m.st.sp + bar(m.sp, m.st.sp, 's') + '</span>' +
    (a ? '<span>' + esc(a.name) + ' ' + (a.hp > 0 ? a.hp + '/' + a.max : 'out') + '</span>' : '') +
    '<span>Belly ' + Math.round(P().hunger) + '</span><span>Data +' + dg.data + '</span>';
  const smv = m.moves[dg.sel] || m.moves[0];
  const sk = $('#dgSkill'); if (sk){ sk.innerHTML = esc(smv.name) + '<small>' + esc(moveLabel(smv)) + (smv.kind === 'phys' || smv.kind === 'mag' || smv.kind === 'drain' ? ' · range ' + (smv.cost ? 4 : 1) : '') + '</small>'; sk.disabled = (smv.cost || 0) > m.sp; }
  const mt = $('#dgMeat'); if (mt){ mt.innerHTML = 'Meat ×' + dg.bag.meat + '<small>+40% HP</small>'; mt.disabled = !dg.bag.meat; }
  const dk = $('#dgDisk'); if (dk){ dk.innerHTML = 'SP Disk ×' + dg.bag.disk + '<small>+60% SP</small>'; dk.disabled = !dg.bag.disk; }

  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const pcs = getComputedStyle(cv.parentElement), avail = cv.parentElement.clientWidth - parseFloat(pcs.paddingLeft) - parseFloat(pcs.paddingRight);
  const W = Math.min(avail, 520), T = Math.floor(W / DG.VW);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = T * DG.VW + 'px'; cv.style.height = T * DG.VH + 'px';
  cv.width = T * DG.VW * dpr; cv.height = T * DG.VH * dpr;
  const x = cv.getContext('2d'); if (!x) return; x.setTransform(dpr, 0, 0, dpr, 0, 0); x.imageSmoothingEnabled = !retroOn;
  const ox = Math.max(0, Math.min(DG.W - DG.VW, m.x - (DG.VW >> 1))), oy = Math.max(0, Math.min(DG.H - DG.VH, m.y - (DG.VH >> 1)));
  x.fillStyle = '#05070d'; x.fillRect(0, 0, T * DG.VW, T * DG.VH);
  const room = dgRoomAt(m.x, m.y);
  for (let j = 0; j < DG.VH; j++) for (let i = 0; i < DG.VW; i++){
    const tx = ox + i, ty = oy + j, k = ty * DG.W + tx;
    if (!dg.seen[k]) continue;
    const vis = dgVisible(tx, ty);
    if (dgFloor(tx, ty)){
      x.fillStyle = col('--panel'); x.fillRect(i * T, j * T, T, T);
      x.fillStyle = col('--grid'); x.fillRect(i * T, j * T, T, 1); x.fillRect(i * T, j * T, 1, T);
    } else { x.fillStyle = col('--line'); x.fillRect(i * T, j * T, T, T); x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(i * T, j * T + T - 3, T, 3); }
    if (!vis){ x.fillStyle = 'rgba(5,7,13,.45)'; x.fillRect(i * T, j * T, T, T); }
  }
  const inView = (ux, uy) => ux >= ox && uy >= oy && ux < ox + DG.VW && uy < oy + DG.VH;
  if (dg.stairs && dg.seen[dg.stairs.y * DG.W + dg.stairs.x] && inView(dg.stairs.x, dg.stairs.y)){
    const sx = (dg.stairs.x - ox) * T, sy = (dg.stairs.y - oy) * T;
    x.fillStyle = col('--accent'); for (let s = 0; s < 4; s++) x.fillRect(sx + 3 + s * (T - 6) / 4, sy + 3 + s * (T - 6) / 4, T - 6 - s * (T - 6) / 4, (T - 6) / 4 - 1);
  }
  for (const it of dg.items){
    if (!dg.seen[it.y * DG.W + it.x] || !inView(it.x, it.y) || !dgVisible(it.x, it.y)) continue;
    const ix = (it.x - ox) * T + T / 2, iy = (it.y - oy) * T + T / 2;
    x.fillStyle = it.type === 'chip' ? col('--link') : it.type === 'meat' ? col('--bad') : it.type === 'disk' ? col('--good') : col('--star');
    x.beginPath(); if (it.type === 'egg') x.ellipse(ix, iy, T * .22, T * .3, 0, 0, 7); else if (it.type === 'chip') x.rect(ix - T * .2, iy - T * .2, T * .4, T * .4); else x.arc(ix, iy, T * .22, 0, 7); x.fill();
  }
  const drawUnit = (u, enemy) => {
    if (!inView(u.x, u.y)) return;
    const ux = (u.x - ox) * T, uy = (u.y - oy) * T;
    if (enemy){ x.fillStyle = 'rgba(210,60,60,.22)'; x.beginPath(); x.ellipse(ux + T / 2, uy + T * .85, T * .38, T * .12, 0, 0, 7); x.fill(); }
    else { x.fillStyle = 'rgba(224,100,15,.3)'; x.beginPath(); x.ellipse(ux + T / 2, uy + T * .85, T * .38, T * .12, 0, 0, 7); x.fill(); }
    if (u.img.complete && u.img.naturalWidth){ if (u.flash){ x.globalAlpha = 0.45; u.flash--; } x.drawImage(u.img, ux - T * .05, uy - T * .15, T * 1.1, T * 1.1); x.globalAlpha = 1; }
    else { x.fillStyle = enemy ? col('--bad') : col('--accent'); x.beginPath(); x.arc(ux + T / 2, uy + T / 2, T * .35, 0, 7); x.fill(); }
    if (enemy && u.hp < u.max){ x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(ux + 3, uy + 1, T - 6, 3); x.fillStyle = meterColor(u.hp / u.max * 100); x.fillRect(ux + 3, uy + 1, (T - 6) * u.hp / u.max, 3); }
  };
  for (const e of dg.enemies) if (dgVisible(e.x, e.y)) drawUnit(e, true);
  if (a && a.hp > 0) drawUnit(a, false);
  drawUnit(m, false);
  // facing marker
  const fx = (m.x - ox) * T + T / 2 + m.face[0] * T * .55, fy = (m.y - oy) * T + T / 2 + m.face[1] * T * .55;
  x.fillStyle = col('--accent'); x.beginPath(); x.arc(fx, fy, Math.max(2, T * .08), 0, 7); x.fill();
  // minimap
  const s = Math.max(2, Math.floor(T / 9)), mw = DG.W * s, mh = DG.H * s, mx = T * DG.VW - mw - 4, my = 4;
  x.fillStyle = 'rgba(5,7,13,.55)'; x.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
  for (let j = 0; j < DG.H; j++) for (let i = 0; i < DG.W; i++){ const k = j * DG.W + i; if (dg.seen[k] && dg.map[k]){ x.fillStyle = 'rgba(200,210,235,.55)'; x.fillRect(mx + i * s, my + j * s, s, s); } }
  if (dg.stairs && dg.seen[dg.stairs.y * DG.W + dg.stairs.x]){ x.fillStyle = col('--accent'); x.fillRect(mx + dg.stairs.x * s - 1, my + dg.stairs.y * s - 1, s + 2, s + 2); }
  x.fillStyle = '#ffffff'; x.fillRect(mx + m.x * s - 1, my + m.y * s - 1, s + 2, s + 2);
}

// ----- digivolution along the real evo lines -----
async function digivolve(){
  const p = P(); if (busy || !canEvolve(p)) return;
  busy = true;
  openOv(`<h4>${esc(p.name)} is digivolving…</h4><div class="status">Reading its evolution line…</div>`);
  let d;
  try{ d = await getDetail(p.id); }
  catch(e){ $('#overlay .sheet').innerHTML = `<h4>Connection problem</h4><p>Couldn't load ${esc(p.name)}'s evolutions (${esc(e.message)}).</p><button class="big" id="ovClose">Close</button>`; $('#ovClose').onclick = closeOv; return; }
  const all = (d.nextEvolutions || []).map(e => ({ id: evoId(e), name: e.digimon, image: e.image })).filter(e => e.id && state.byId.has(e.id));
  const seen = new Set();
  const uniq = all.filter(e => !seen.has(e.id) && seen.add(e.id));
  let cands = uniq.filter(e => inStage(e.id, p.stage + 1));
  if (!cands.length) cands = uniq.filter(e => higherStage(e.id, p.stage) !== undefined);
  if (!cands.length){
    p.final = true; saveGame();
    $('#overlay .sheet').innerHTML = `<h4>No further forms</h4><p>${esc(p.name)} has no recorded evolution to the next stage, so this is its final form.</p><button class="big" id="ovClose">OK</button>`;
    $('#ovClose').onclick = () => { closeOv(); renderPartner(); };
    return;
  }
  const count = p.stageMistakes === 0 ? 3 : p.stageMistakes <= 2 ? 2 : 1;
  // mix in forms you haven't raised so every line gets explored
  const unraised = shuffle(cands.filter(c => !raised(c.id)));
  const familiar = shuffle(cands.filter(c => raised(c.id)));
  const options = shuffle([...unraised.slice(0, count), ...familiar].slice(0, count));
  const careNote = count === 3 ? 'Great care! Choose its path.' : count === 2 ? 'Some care mistakes limited its paths.' : 'Neglect left only one path open.';
  $('#overlay .sheet').innerHTML = `<h4>${esc(p.name)} is ready!</h4>
    <p style="margin:0;color:var(--muted)">${careNote} ${cands.length} possible forms in total.</p>
    <div class="choices">${options.map(o => {
      const r = raised(o.id), k = known(o.id);
      return `<button class="choice" data-pick="${o.id}"><img class="${k ? '' : 'sil'}" alt="" src="${esc(o.image || state.byId.get(o.id).image)}"><b>${k ? esc(o.name) : '???'}</b>${r ? '<small>✓ raised before</small>' : k ? '<small>seen in battle</small>' : ''}</button>`;
    }).join('')}</div>`;
  $('#overlay').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => evolveTo(+b.dataset.pick));
}

async function evolveTo(id){
  const p = P(); const b = state.byId.get(id);
  const oldName = p.name;
  $('#overlay .sheet').innerHTML = `<div class="reveal"><img id="evoImg" class="sprite flash" style="animation-iteration-count:8" alt="" src="${esc(p.image)}"><h4>${esc(oldName)} digivolve to…</h4></div>`;
  await sleep(2900);
  const firstTime = !raised(id);
  p.id = id; p.name = b.name; p.image = b.image;
  p.stage = inStage(id, p.stage + 1) ? p.stage + 1 : Math.min(5, higherStage(id, p.stage) ?? p.stage + 1);
  p.evo = 0; p.stageMistakes = 0; p.line.push(id);
  p.stageLine = [...(p.stageLine || p.line.slice(0, -1).map((_, i) => i)), p.stage];
  p.mood = clamp(p.mood + 20); p.energy = clamp(p.energy + 20); p.str += 3;
  G.col[id] = 'raised';
  saveGame();
  $('#overlay .sheet').innerHTML = `<div class="reveal"><img class="sprite happy" alt="" src="${esc(b.image)}">
    <h4>${esc(b.name)}!</h4><p style="margin:0;color:var(--muted)">${LEVEL_EN[STAGES[p.stage]]} level${firstTime ? ' · new to your collection!' : ''}</p></div>
    <button class="big" id="ovClose">Awesome</button>`;
  const newMoves = await syncMoves(p);
  $('#ovClose').onclick = () => { closeOv(); say(`${oldName} digivolved into ${b.name}!` + (newMoves.length ? ' Learned ' + newMoves.join(', ') + '!' : ''), 'happy'); };
}

// ---------- image processing: cut out the white background, optional retro pixel look ----------
// Done on this device from the official art; silhouettes need the cutout so they show a shape, not a square.
const IMG_SEL = '.slot img, .pic, .evo img, #sprite, .art, .lineage img, .choice img, .fighter img, .reveal img';
let retroOn = !!store.get('dx_retro', false);
const imgCache = new Map();
function processArt(src, res, retro){
  const key = src + '|' + res + '|' + retro;
  if (imgCache.has(key)) return imgCache.get(key);
  const job = new Promise(done => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onerror = () => done(null);
    im.onload = () => {
      try{ done(retro ? pixelSprite(im, res) : cutout(im, res)); }catch{ done(null); }
    };
    im.src = src;
  });
  imgCache.set(key, job);
  return job;
}
// background = near-white pixels connected to the edges (inner whites like eyes and wings stay)
function findBackground(p, S){
  const N = S * S, bg = new Uint8Array(N), q = [];
  const light = i => p[i*4+3] < 40 || (p[i*4] >= 250 && p[i*4+1] >= 250 && p[i*4+2] >= 250);
  for (let i = 0; i < S; i++) for (const j of [i, (S-1)*S + i, i*S, i*S + S - 1]) if (!bg[j] && light(j)){ bg[j] = 1; q.push(j); }
  while (q.length){ const i = q.pop(), xx = i % S; for (const j of [i-1, i+1, i-S, i+S]){ if (j < 0 || j >= N || bg[j] || Math.abs((j % S) - xx) > 1) continue; if (light(j)){ bg[j] = 1; q.push(j); } } }
  return bg;
}
function cutout(im, res){
  const c = document.createElement('canvas'); c.width = c.height = res;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, res, res);
  const d = x.getImageData(0, 0, res, res), bg = findBackground(d.data, res);
  for (let i = 0; i < res * res; i++) if (bg[i]) d.data[i*4+3] = 0;
  x.putImageData(d, 0, 0);
  return c.toDataURL();
}
// pixel sprite: perceptual palette from the art, majority colour per block, line art kept,
// light shading on region edges and a soft outline
function pixelSprite(im, res){
  const S = 320, k = 14;
  const c0 = document.createElement('canvas'); c0.width = c0.height = S;
  const x0 = c0.getContext('2d'); x0.drawImage(im, 0, 0, S, S);
  const p = x0.getImageData(0, 0, S, S).data, N = S * S, bg = findBackground(p, S);
  let x1 = S, y1 = S, x2 = 0, y2 = 0;
  for (let i = 0; i < N; i++) if (!bg[i]){ const xx = i % S, yy = (i / S) | 0; if (xx < x1) x1 = xx; if (xx > x2) x2 = xx; if (yy < y1) y1 = yy; if (yy > y2) y2 = yy; }
  if (x2 < x1) return null;
  const side = (Math.max(x2 - x1, y2 - y1) + 1) * res / (res - 2), ox = (x1 + x2 + 1 - side) / 2, oy = (y1 + y2 + 1 - side) / 2;
  const lum = c => c[0]*.3 + c[1]*.59 + c[2]*.11;
  const lin = v => { v /= 255; return v > .04045 ? ((v + .055) / 1.055) ** 2.4 : v / 12.92; };
  const fl = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16/116;
  const toLab = (r, g, b) => { const R = lin(r), G = lin(g), B = lin(b);
    const X = fl((R*.4124 + G*.3576 + B*.1805) / .9505), Y = fl(R*.2126 + G*.7152 + B*.0722), Z = fl((R*.0193 + G*.1192 + B*.9505) / 1.089);
    return [116*Y - 16, 500*(X - Y), 200*(Y - Z)]; };
  const pc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){ if (bg[i]) continue; const q = toLab(p[i*4], p[i*4+1], p[i*4+2]); pc[i*3] = q[0]; pc[i*3+1] = q[1]; pc[i*3+2] = q[2]; }
  const samp = []; for (let i = 0; i < N; i += 3) if (!bg[i]) samp.push(i);
  samp.sort((a, b) => pc[a*3] - pc[b*3]);
  const sortedL = samp.map(i => lum([p[i*4], p[i*4+1], p[i*4+2]])).sort((a, b) => a - b);
  const darkLum = Math.min(45, sortedL[sortedL.length >> 1] * 0.38), darkMin = 5;
  let cents = []; for (let j = 0; j < k; j++){ const i = samp[Math.floor((j + .5) / k * samp.length)]; cents.push([pc[i*3], pc[i*3+1], pc[i*3+2], p[i*4], p[i*4+1], p[i*4+2]]); }
  const near = i => { let b = 0, bd = 1e12; for (let ci = 0; ci < cents.length; ci++){ const c = cents[ci]; const dd = (pc[i*3]-c[0])**2 + (pc[i*3+1]-c[1])**2 + (pc[i*3+2]-c[2])**2; if (dd < bd){ bd = dd; b = ci; } } return b; };
  for (let it = 0; it < 10; it++){
    const sum = cents.map(() => [0,0,0,0,0,0,0]);
    for (const i of samp){ const s = sum[near(i)]; s[0] += pc[i*3]; s[1] += pc[i*3+1]; s[2] += pc[i*3+2]; s[3] += p[i*4]; s[4] += p[i*4+1]; s[5] += p[i*4+2]; s[6]++; }
    cents = cents.map((cc, ci) => sum[ci][6] ? sum[ci].slice(0, 6).map(t => t / sum[ci][6]) : cc);
  }
  const rgbOf = ci => [cents[ci][3], cents[ci][4], cents[ci][5]];
  const cl = cents.map((c, ci) => lum(rgbOf(ci)));
  const R = res * res, idx = new Int16Array(R).fill(-1), step = side / res;
  for (let by = 0; by < res; by++) for (let bx = 0; bx < res; bx++){
    const votes = new Map(); let total = 0, fg = 0, dark = 0, darkIdx = -1, dl = 999;
    for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++){
      const X = Math.floor(ox + (bx + (sx + .5) / 3) * step), Y = Math.floor(oy + (by + (sy + .5) / 3) * step);
      total++; if (X < 0 || Y < 0 || X >= S || Y >= S) continue; const i = Y * S + X; if (bg[i]) continue; fg++;
      const ci = near(i); votes.set(ci, (votes.get(ci) || 0) + 1);
      if (cl[ci] < darkLum){ dark++; if (cl[ci] < dl){ dl = cl[ci]; darkIdx = ci; } }
    }
    if (fg < total * 0.45) continue;
    let best = -1, bv = -1; for (const [ci, v] of votes) if (v > bv){ bv = v; best = ci; }
    if (dark >= darkMin) best = darkIdx;
    idx[by * res + bx] = best;
  }
  const id2 = Int16Array.from(idx);
  for (let q = 0; q < R; q++){
    if (idx[q] < 0) continue; const xx = q % res;
    const nb = [q-1, q+1, q-res, q+res].filter(j => j >= 0 && j < R && Math.abs((j % res) - xx) <= 1).map(j => idx[j]);
    if (nb.length === 4 && nb.every(v => v >= 0 && v !== idx[q])){
      const cnt = {}; nb.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
      const top = +Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
      if (cnt[top] >= 3 && cl[idx[q]] >= 45) id2[q] = top;
    }
  }
  const out = new Uint8ClampedArray(R * 4);
  for (let q = 0; q < R; q++){ if (id2[q] < 0) continue; const c = rgbOf(id2[q]); out[q*4] = c[0]; out[q*4+1] = c[1]; out[q*4+2] = c[2]; out[q*4+3] = 255; }
  for (let q = 0; q < R; q++){
    if (id2[q] < 0 || cl[id2[q]] < 45) continue; const xx = q % res;
    const dn = q + res < R ? id2[q + res] : -1, rt = xx < res - 1 ? id2[q + 1] : -1, up = q - res >= 0 ? id2[q - res] : -1, lf = xx > 0 ? id2[q - 1] : -1;
    if (dn !== id2[q] || rt !== id2[q]){ out[q*4] *= .82; out[q*4+1] *= .82; out[q*4+2] *= .86; }
    else if (up < 0 || lf < 0){ out[q*4] = Math.min(255, out[q*4] * 1.1 + 8); out[q*4+1] = Math.min(255, out[q*4+1] * 1.1 + 8); out[q*4+2] = Math.min(255, out[q*4+2] * 1.1 + 8); }
  }
  for (let q = 0; q < R; q++){
    if (id2[q] >= 0) continue; const xx = q % res;
    const nb = [q-1, q+1, q-res, q+res].find(j => j >= 0 && j < R && id2[j] >= 0 && Math.abs((j % res) - xx) <= 1);
    if (nb !== undefined){ const c = rgbOf(id2[nb]); out[q*4] = c[0]*.45 + 16; out[q*4+1] = c[1]*.45 + 16; out[q*4+2] = c[2]*.45 + 28; out[q*4+3] = 255; }
  }
  const c = document.createElement('canvas'); c.width = c.height = res;
  c.getContext('2d').putImageData(new ImageData(out, res, res), 0, 0);
  return c.toDataURL();
}
async function processImg(img){
  const orig = img.dataset.orig || img.getAttribute('src');
  if (!orig || orig.startsWith('data:')) return;
  const sil = img.classList.contains('sil');
  if (!retroOn && !sil){ if (img.dataset.orig){ img.src = orig; img.style.imageRendering = ''; delete img.dataset.orig; delete img.dataset.mode; } return; }
  const mode = retroOn ? 'retro' : 'cut';
  if (img.dataset.mode === mode) return;
  img.dataset.orig = orig; img.dataset.mode = mode;
  const big = img.matches('#sprite, .art, .reveal img');
  const url = await processArt(orig, retroOn ? (big ? 56 : 44) : (big ? 160 : 96), retroOn);
  if (url && img.dataset.orig === orig && img.dataset.mode === mode){ img.src = url; img.style.imageRendering = retroOn ? 'pixelated' : ''; }
}
const imgIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ imgIO.unobserve(e.target); processImg(e.target); } }), {rootMargin: '300px'});
function scanImgs(root = document){
  if (root.matches?.(IMG_SEL)) imgIO.observe(root);
  root.querySelectorAll?.(IMG_SEL).forEach(img => imgIO.observe(img));
}
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) scanImgs(n); })
  .observe(document.body, {childList: true, subtree: true});
function setRetro(on){
  retroOn = on; store.set('dx_retro', on);
  $('#retroBtn').setAttribute('aria-pressed', on);
  document.querySelectorAll(IMG_SEL).forEach(img => { delete img.dataset.mode; imgIO.observe(img); });
}
$('#retroBtn').onclick = () => setRetro(!retroOn);

// ---------- events ----------
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  state.scroll = window.scrollY;
  state.trail = [];
  history.pushState(null, '', '#' + c.dataset.id);
  openDetail(c.dataset.id, false);
});
$('#detailView').addEventListener('click', e => {
  const ev = e.target.closest('[data-evo]');
  if (ev){ history.pushState(null, '', '#' + ev.dataset.evo); openDetail(ev.dataset.evo, true); return; }
  const more = e.target.closest('[data-more]');
  if (more){ document.querySelectorAll(`[data-extra="${more.dataset.more}"]`).forEach(x => x.hidden = false); more.remove(); return; }
  const t = e.target.closest('[data-trail]');
  if (t){ const i = +t.dataset.trail; const tgt = state.trail[i]; state.trail = state.trail.slice(0, i); history.pushState(null, '', '#' + tgt.id); openDetail(tgt.id, true); }
});
$('#rail').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) setLevel(c.dataset.level); });
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; renderGrid(); }, 120); });
$('#favOnly').addEventListener('click', e => { state.favOnly = !state.favOnly; e.currentTarget.setAttribute('aria-pressed', state.favOnly); renderGrid(); });
$('#raisedOnly').addEventListener('click', e => { state.raisedOnly = !state.raisedOnly; e.currentTarget.setAttribute('aria-pressed', state.raisedOnly); renderGrid(); });
window.addEventListener('popstate', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy){ tick(); renderPartner(); } });
setInterval(() => { if (!busy && !document.hidden && state.tab === 'partner' && P()){ tick(); renderPartner(); } }, 60000);

renderRail();
setRetro(retroOn);
setTab(location.hash && +location.hash.slice(1) ? 'index' : state.tab);
loadAll();
</script>
