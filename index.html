// ----- AI Tamers: computer players who level up, climb the boards, hit the raid boss and use the trade board.
// Everything about them comes from the clock and a seed, so every player sees the same AI Tamers doing the same things.
// every AI Tamer started from nothing on this date and plays like a person: a short session most days, some days off
const BOT_EPOCH = Date.UTC(2026, 9, 13, 23, 0);
const BOT_TAMERS = [
  ['ByteRunner', 1.25], ['NeonKoi', 1.1], ['PixelRook', 1.3], ['MossTamer', .85], ['Kitsu_7', 1.05], ['LunaGlitch', 1.15], ['ZeroDrift', 1.2],
  ['SolarPup', .8], ['HexaQuill', .95], ['Tidecaller', 1], ['Juno.exe', 1.1], ['Brambleby', .75], ['CircuitFox', 1.2], ['RetroRio', .9]
];
const BOT_NOTES = ['Good home only!', 'Raised with care', 'Strong one', 'Duplicate, needs a Tamer', 'Loves to battle', 'Hatched last night', 'Swap me something cool', ''];
const sd = (a, b) => Math.abs(seeded(a, b));
const botR = (i, salt) => sd(i * 977 + 31, salt);
function strSeed(str){ let h = 7; for (const c of String(str)) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return h % 100000; }
function botPool(st){ return (state.stageIds[st] || []).filter(id => state.byId.has(id) && !isExtra(id) && !state.armor.has(id)); }
function botMon(st, a, b){ const pool = botPool(st); return pool.length ? state.byId.get(pool[Math.floor(sd(a, b) * pool.length) % pool.length]) : null; }
const botStart = i => BOT_EPOCH + botR(i, 1) * 3 * 864e5;     // each one joins within the first 3 days
// Tamer XP earned up to time t: one play session a day (1–4 hours, at the bot's usual time), skipping some days
function botXP(i, t){
  const start = botStart(i), D = 864e5; if (t <= start) return 0;
  const s = BOT_TAMERS[i][1], hour = 13 + Math.floor(botR(i, 9) * 11), len = 1 + botR(i, 10) * 3, plays = 0.6 + botR(i, 11) * 0.35;
  let xp = 0;
  for (let d = Math.floor(start / D) - 1, end = Math.floor(t / D); d <= end; d++){
    if (sd(i * 31 + d, 41) > plays) continue;
    const ws = d * D + hour * 36e5, from = Math.max(ws, start), to = Math.min(ws + len * 36e5, t);
    if (to > from) xp += (to - from) / 36e5 * 130 * s * (0.6 + sd(i * 31 + d, 42) * 0.8);
  }
  return xp;
}
function botLv(xp){ let lv = 1; while (lv < 60 && xp >= 60 + lv * 40){ xp -= 60 + lv * 40; lv++; } return lv; }
function botStats(i, t = Date.now()){
  const [name, s] = BOT_TAMERS[i], xp = botXP(i, t), started = t > botStart(i), lv = botLv(xp);
  const st = lv >= 26 ? 5 : lv >= 17 ? 4 : lv >= 9 ? 3 : lv >= 3 ? 2 : 1;
  const pm = started ? botMon(st, i * 13 + st, 77) : null, total = (state.all || []).length || 1200;
  return { uid: 'bot' + i, bot: true, name, started, xp, tamerLv: started ? lv : 0, stage: st,
    found: started ? Math.min(total, Math.floor(1 + xp * (0.015 + botR(i, 2) * 0.015))) : 0,
    bestStreak: Math.floor(Math.sqrt(xp) / 4 * (0.5 + botR(i, 3))),
    colo: lv >= 5 ? Math.min(COLO.length, Math.floor((lv - 3) / (4 + botR(i, 4) * 3))) : 0,
    pvp: Math.floor(xp / (700 + botR(i, 5) * 900)),
    title: lv >= 10 && botR(i, 6) < .7 ? ACH[Math.floor(botR(i, 7) * ACH.length) % ACH.length].name : '',
    [towerKey()]: started ? Math.min(50, Math.floor(Math.min(1, Math.max(0, (t - Math.max((7 * weekNo() - 3) * 864e5, botStart(i))) / 864e5) / 4) * lv * 1.6 * (0.6 + botR(i, 13) * 0.6))) : 0,
    partner: pm ? { id: pm.id, name: pm.name, image: pm.image, level: Math.min(99, Math.max(1, Math.round(lv * 1.4 + botR(i, 8) * 4))) } : null };
}
function fmtAgo(t){ const m = Math.max(1, Math.round((Date.now() - t) / 6e4)); return m < 60 ? m + 'm ago' : Math.round(m / 60) + 'h ago'; }
const botAll = () => BOT_TAMERS.map((_, i) => botStats(i)).filter(b => b.started);
// a feed of what the AI Tamers have been up to: only things they could really have done by then
function botFeed(n = 8){
  const out = [], H = 36e5, now = Date.now();
  for (let h = Math.floor(now / H); out.length < n && h > Math.floor(now / H) - 72; h--){
    for (let k = 0; k < 3 && out.length < n; k++){
      const at = h * H + Math.floor(sd(h, 502 + k) * H); if (at > now) continue;
      const i = Math.floor(sd(h, 503 + k) * BOT_TAMERS.length) % BOT_TAMERS.length, b = botStats(i, at);
      if (!b.started || botXP(i, at) - botXP(i, at - H) <= 0) continue;   // only while that Tamer is playing
      const nm = esc(b.name), kind = Math.floor(sd(h, 504 + k) * 7), st = Math.max(0, Math.min(b.stage, 4) - Math.floor(sd(h, 505 + k) * 2));
      const a = botMon(st, h, 506 + k), z = botMon(st + 1, h, 507 + k);
      const txt = kind === 0 && a && z && b.stage > st ? nm + '\'s ' + esc(a.name) + ' digivolved into <b>' + esc(z.name) + '</b>'
        : kind === 1 && a ? nm + ' hatched a <b>' + esc(a.name) + '</b>'
        : kind === 2 ? nm + ' dealt <b>' + Math.round((20 + sd(h, 508) * 50) * (0.4 + Math.min(1, b.tamerLv / 25))) + '</b> damage to the raid boss'
        : kind === 3 && b.colo ? nm + ' won a Colosseum match (' + esc(COLO[b.colo - 1].name) + ')'
        : kind === 4 && z ? nm + ' found <b>' + esc(z.name) + '</b> on an expedition'
        : kind === 5 && b.tamerLv > 1 ? nm + ' reached Tamer level <b>' + b.tamerLv + '</b>'
        : kind === 6 && b.pvp ? nm + ' won a live battle 🔥'
        : nm + ' won a battle';
      out.push({ at, txt });
    }
  }
  return out.sort((a, b) => b.at - a.at);
}
// raid: AI Tamers that have started join in, fighting during their play sessions; damage grows with their level
function botRaid(w = weekNo()){
  const ws = (7 * w - 3) * 864e5, now = Date.now(), out = [];
  BOT_TAMERS.forEach(([name], i) => {
    if (sd(i + 1, w * 3 + 1) < .15) return;
    const from = Math.max(ws, botStart(i)); if (now <= from) return;
    const lv = botLv(botXP(i, now)), days = Math.floor((now - from) / 864e5);
    let dmg = 0, fights = 0;
    for (let d = 0; d <= days; d++){
      const t = Math.min(now, from + (d + 1) * 864e5); if (botXP(i, t) - botXP(i, from + d * 864e5) <= 0) continue;   // didn't play that day
      const f = 1 + Math.floor(sd(i * 50 + d, w + 7) * 3);
      for (let k = 0; k < f; k++){ dmg += Math.round((20 + sd(i * 50 + d * 3 + k, w) * 60) * (0.4 + Math.min(1.2, lv / 25))); fights++; }
    }
    if (fights) out.push({ name, dmg, bot: true });
  });

// trades: a few listings every 6 hours from AI Tamers who have started, nothing above what they could have raised
function botTrades(){

  G.botTaken = G.botTaken || {};

  for (let j = 0; j < n; j++){
    const id = 'bot:' + slot + ':' + j; if (G.botTaken[id]) continue;
    const i = Math.floor(sd(slot * 7 + j, 15) * BOT_TAMERS.length) % BOT_TAMERS.length, bs = botStats(i, slot * 216e5);
    if (!bs.started) continue;
    const r = sd(slot * 7 + j, 13), st = Math.min(Math.max(1, bs.stage - 1), r < .5 ? 2 : r < .9 ? 3 : 4), b = botMon(st, slot * 7 + j, 14); if (!b) continue;
    const lvl = STAGE_MIN_LV[st] + Math.floor(sd(slot * 7 + j, 16) * 5);
    const price = Math.round(([0, 60, 120, 350, 900][st] * (.7 + sd(slot * 7 + j, 17) * .8)) / 10) * 10;

      note: BOT_NOTES[Math.floor(sd(slot * 7 + j, 18) * BOT_NOTES.length) % BOT_NOTES.length] });
  }

}

// ================= CLOUD SAVE: your game backed up online under a secret recovery code =================
// The recovery code is the key to the save: anyone with it can restore the game, so it is long and random.
var CLOUD_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

}
async function cloudUnpack(s){

var cloudBusy = false, cloudHash = '';
const cloudSig = () => { let s = ''; try{ s = localStorage.getItem('dx_game_v1') || ''; }catch{} let h = 0; for (let i = 0; i < s.length; i += 7) h = (h * 31 + s.charCodeAt(i)) | 0; return s.length + ':' + h; };

    }
    const at = Date.now(); C.last = at; C.seen = at; C.conflict = null; saveGame();
    const d = await cloudPack(makeBackup());

    const p = P();
    await F.setDoc(ref, { d, at, dev: cloudDev(), v: 1, name: (G.online && G.online.name) || (p ? p.name : ''), lv: (G.tamer && G.tamer.lv) || 1, found: foundCount(), partner: p ? p.name : '' });

async function cloudFetch(key){

async function cloudRestore(key, r){

  for (const k of SAVE_KEYS){ try{ localStorage.removeItem(k); }catch{} }
  for (const [k, v] of Object.entries(o.keys)) if (SAVE_KEYS.includes(k)){ try{ localStorage.setItem(k, v); }catch{} }
  // keep backing up to the same code from this device
  try{ const g = JSON.parse(localStorage.getItem('dx_game_v1')); g.cloud = Object.assign(g.cloud || {}, { on: true, key, seen: r.at || Date.now(), conflict: null }); localStorage.setItem('dx_game_v1', JSON.stringify(g)); }catch{}

// Both phones replay the same moves with the same random seed, so they always agree on what happened.
var DUEL_V = 1, DUEL_TURN = 40, DUEL_WAIT = 120;   // rules version, seconds to pick a move, seconds an invite stays open

async function duelFighter(){

    crit: f.critBonus || 0, tdm: f.tdm || 1, ttk: f.ttk || 1, endure: Math.min(1, f.endureChance || 0), noStatus: !!f.noStatus, pas: passiveOf(p.id, f.attr) });

  const moves = (s.moves || []).filter(m => m && m.name).slice(0, 6); if (!moves.length) moves.push(Object.assign({ cost: 0 }, BASIC), GUARD);

function duelMove(att, def, mv, R){ return moveCore(att, def, mv, R, false); }

function duelSim(D){

  const snap = () => ({ hp: [A.hp, B.hp], sp: [A.sp, B.sp], ss: [A.status ? A.status.k : '', B.status ? B.status.k : ''] });

      const s = duelStatus(u, R);
      if (s.text) ev.push(Object.assign({ side, text: s.text }, snap()));
      if (A.hp <= 0 || B.hp <= 0) break;
      if (s.skip) continue;
      let mv = u.moves[+(side === 'A' ? mA : mB)[t]] || u.moves[0];
      if ((mv.cost || 0) > u.sp) mv = u.moves[0];
      const r = duelMove(u, o, mv, R);
      ev.push(Object.assign({ side, mv, r, text: r.text }, snap()));
      if (A.hp <= 0 || B.hp <= 0) break;
    }
    if (A.hp <= 0 || B.hp <= 0) out = A.hp > 0 ? 'A' : 'B';
    else { A.sp = Math.min(A.st.sp, A.sp + 1); B.sp = Math.min(B.st.sp, B.sp + 1); }
    turns.push(ev); t++;
  }
  if (!out && t > 40) out = A.hp / A.st.hp >= B.hp / B.st.hp ? 'A' : 'B';
  return { A, B, turns, out, next: t };
}

async function duelStep(S){
  if (S.finished) return;
  const D = S.D, them = duelThem(S);
  if ((D.v || 0) !== DUEL_V){ duelGone(S, 'You and ' + them + ' are on different versions of the game. Both of you: close the app fully and reopen it, then try again.'); return; }
  if (D.status === 'declined'){ duelGone(S, them + ' said no this time.'); return; }
  if (D.status === 'invite'){ if (S.side === 'A' && !S.waiting) duelWaitInvite(S); return; }
  clearInterval(S.timer); S.waiting = false;
  const sim = duelSim(D); S.sim = sim;
  if (!S.built) duelBuild(S);
  while (S.shown < sim.turns.length){
    for (const e of sim.turns[S.shown]){
      if (duelSess !== S) return;
      duelLog(e.text);
      if (e.mv){ const u = e.side === 'A' ? sim.A : sim.B; await moveFx(duelSel(S, e.side), duelSel(S, e.side === 'A' ? 'B' : 'A'), e.mv, e.r, u.elem, () => duelPaint(S, e)); await sleep(500); }
      else { duelPaint(S, e); await sleep(850); }

  const winner = sim.out || (D.status === 'done' ? D.winner : null);
